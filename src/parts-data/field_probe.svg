<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 70" width="30" height="70">
  <!-- Field probe — a short bare wire with a stripped tip, sensing the room's electric field -->
  <!-- Field lines arriving at the tip -->
  <path d="M5 4 Q11 10 13 14 M25 4 Q19 10 17 14 M15 2 L15 12" fill="none" stroke="#9ab" stroke-width="0.7" stroke-dasharray="1.5 1.2"/>
  <!-- Stripped copper tip -->
  <line x1="15" y1="14" x2="15" y2="30" stroke="#b87333" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Insulated lead -->
  <line x1="15" y1="30" x2="15" y2="68" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="15" y1="68" x2="15" y2="70" stroke="#b87333" stroke-width="1.2"/>
  <text x="15" y="48" text-anchor="middle" font-family="monospace" font-size="4" fill="#eee" transform="rotate(-90 15 48)">PROBE</text>
  <circle cx="15" cy="70" r="2" fill="#c0c0c0"/>
</svg>
