<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 30" width="80" height="30">
  <!-- LEDBANK8 — 8 discrete LEDs in a row, bench-style module -->
  <!-- PCB body -->
  <rect x="2" y="3" width="76" height="20" rx="2" fill="#2a5a2a" stroke="#1a3a1a" stroke-width="0.8"/>
  <!-- 8 LEDs (red, 3mm style) -->
  <circle cx="8"  cy="13" r="4" fill="#cc2222" stroke="#991111" stroke-width="0.5" opacity="0.9"/>
  <circle cx="8"  cy="12" r="2" fill="#ff4444" opacity="0.4"/>
  <circle cx="16" cy="13" r="4" fill="#cc2222" stroke="#991111" stroke-width="0.5" opacity="0.9"/>
  <circle cx="16" cy="12" r="2" fill="#ff4444" opacity="0.4"/>
  <circle cx="24" cy="13" r="4" fill="#cc2222" stroke="#991111" stroke-width="0.5" opacity="0.9"/>
  <circle cx="24" cy="12" r="2" fill="#ff4444" opacity="0.4"/>
  <circle cx="32" cy="13" r="4" fill="#cc2222" stroke="#991111" stroke-width="0.5" opacity="0.9"/>
  <circle cx="32" cy="12" r="2" fill="#ff4444" opacity="0.4"/>
  <circle cx="40" cy="13" r="4" fill="#cc2222" stroke="#991111" stroke-width="0.5" opacity="0.9"/>
  <circle cx="40" cy="12" r="2" fill="#ff4444" opacity="0.4"/>
  <circle cx="48" cy="13" r="4" fill="#cc2222" stroke="#991111" stroke-width="0.5" opacity="0.9"/>
  <circle cx="48" cy="12" r="2" fill="#ff4444" opacity="0.4"/>
  <circle cx="56" cy="13" r="4" fill="#cc2222" stroke="#991111" stroke-width="0.5" opacity="0.9"/>
  <circle cx="56" cy="12" r="2" fill="#ff4444" opacity="0.4"/>
  <circle cx="64" cy="13" r="4" fill="#cc2222" stroke="#991111" stroke-width="0.5" opacity="0.9"/>
  <circle cx="64" cy="12" r="2" fill="#ff4444" opacity="0.4"/>
  <!-- Bottom pins (d0-d7) -->
  <line x1="8"  y1="23" x2="8"  y2="30" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="8"  cy="30" r="1" fill="#c0c0c0"/>
  <line x1="16" y1="23" x2="16" y2="30" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="16" cy="30" r="1" fill="#c0c0c0"/>
  <line x1="24" y1="23" x2="24" y2="30" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="24" cy="30" r="1" fill="#c0c0c0"/>
  <line x1="32" y1="23" x2="32" y2="30" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="32" cy="30" r="1" fill="#c0c0c0"/>
  <line x1="40" y1="23" x2="40" y2="30" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="40" cy="30" r="1" fill="#c0c0c0"/>
  <line x1="48" y1="23" x2="48" y2="30" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="48" cy="30" r="1" fill="#c0c0c0"/>
  <line x1="56" y1="23" x2="56" y2="30" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="56" cy="30" r="1" fill="#c0c0c0"/>
  <line x1="64" y1="23" x2="64" y2="30" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="64" cy="30" r="1" fill="#c0c0c0"/>
  <!-- Top pins (vcc, gnd) -->
  <line x1="72" y1="3" x2="72" y2="0" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="72" cy="0" r="1" fill="#cc3333"/>
  <line x1="80" y1="3" x2="80" y2="0" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="80" cy="0" r="1" fill="#333333"/>
</svg>
