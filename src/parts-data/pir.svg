<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- PIR Motion Sensor — dome-top module, bench-style -->
  <!-- PCB circle -->
  <circle cx="24" cy="28" r="18" fill="#0a5a0a" stroke="#084a08" stroke-width="0.8"/>
  <!-- Fresnel lens dome -->
  <circle cx="24" cy="22" r="14" fill="#e0e0d0" opacity="0.5" stroke="#ccc" stroke-width="0.5"/>
  <circle cx="24" cy="22" r="10" fill="#e8e8d8" opacity="0.3"/>
  <!-- Sensor window -->
  <rect x="20" y="18" width="8" height="8" rx="1" fill="#444" opacity="0.5"/>
  <!-- Trim pots -->
  <circle cx="14" cy="36" r="2" fill="#4488ff" stroke="#336" stroke-width="0.3"/>
  <circle cx="34" cy="36" r="2" fill="#4488ff" stroke="#336" stroke-width="0.3"/>
  <!-- 3 pins at bottom -->
  <line x1="16" y1="44" x2="16" y2="48" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="24" y1="44" x2="24" y2="48" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="32" y2="48" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="16" cy="48" r="1.5" fill="#c0c0c0"/>
  <circle cx="24" cy="48" r="1.5" fill="#c0c0c0"/>
  <circle cx="32" cy="48" r="1.5" fill="#c0c0c0"/>
</svg>
