<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- LED Matrix 8x8 — bench-style front view -->
  <!-- Housing -->
  <rect x="2" y="2" width="76" height="76" rx="2" fill="#1a1a1a" stroke="#333" stroke-width="0.8"/>
  <!-- LED dots (8x8 grid) -->
  <g fill="#ff2020" opacity="0.3">
    <!-- Row by row, 8 cols spaced at 8px, starting at (10, 10) -->
    <circle cx="14" cy="14" r="2.5"/><circle cx="22" cy="14" r="2.5"/><circle cx="30" cy="14" r="2.5"/><circle cx="38" cy="14" r="2.5"/>
    <circle cx="46" cy="14" r="2.5"/><circle cx="54" cy="14" r="2.5"/><circle cx="62" cy="14" r="2.5"/><circle cx="70" cy="14" r="2.5"/>
    <circle cx="14" cy="22" r="2.5"/><circle cx="22" cy="22" r="2.5"/><circle cx="30" cy="22" r="2.5"/><circle cx="38" cy="22" r="2.5"/>
    <circle cx="46" cy="22" r="2.5"/><circle cx="54" cy="22" r="2.5"/><circle cx="62" cy="22" r="2.5"/><circle cx="70" cy="22" r="2.5"/>
    <circle cx="14" cy="30" r="2.5"/><circle cx="22" cy="30" r="2.5"/><circle cx="30" cy="30" r="2.5"/><circle cx="38" cy="30" r="2.5"/>
    <circle cx="46" cy="30" r="2.5"/><circle cx="54" cy="30" r="2.5"/><circle cx="62" cy="30" r="2.5"/><circle cx="70" cy="30" r="2.5"/>
    <circle cx="14" cy="38" r="2.5"/><circle cx="22" cy="38" r="2.5"/><circle cx="30" cy="38" r="2.5"/><circle cx="38" cy="38" r="2.5"/>
    <circle cx="46" cy="38" r="2.5"/><circle cx="54" cy="38" r="2.5"/><circle cx="62" cy="38" r="2.5"/><circle cx="70" cy="38" r="2.5"/>
    <circle cx="14" cy="46" r="2.5"/><circle cx="22" cy="46" r="2.5"/><circle cx="30" cy="46" r="2.5"/><circle cx="38" cy="46" r="2.5"/>
    <circle cx="46" cy="46" r="2.5"/><circle cx="54" cy="46" r="2.5"/><circle cx="62" cy="46" r="2.5"/><circle cx="70" cy="46" r="2.5"/>
    <circle cx="14" cy="54" r="2.5"/><circle cx="22" cy="54" r="2.5"/><circle cx="30" cy="54" r="2.5"/><circle cx="38" cy="54" r="2.5"/>
    <circle cx="46" cy="54" r="2.5"/><circle cx="54" cy="54" r="2.5"/><circle cx="62" cy="54" r="2.5"/><circle cx="70" cy="54" r="2.5"/>
    <circle cx="14" cy="62" r="2.5"/><circle cx="22" cy="62" r="2.5"/><circle cx="30" cy="62" r="2.5"/><circle cx="38" cy="62" r="2.5"/>
    <circle cx="46" cy="62" r="2.5"/><circle cx="54" cy="62" r="2.5"/><circle cx="62" cy="62" r="2.5"/><circle cx="70" cy="62" r="2.5"/>
    <circle cx="14" cy="70" r="2.5"/><circle cx="22" cy="70" r="2.5"/><circle cx="30" cy="70" r="2.5"/><circle cx="38" cy="70" r="2.5"/>
    <circle cx="46" cy="70" r="2.5"/><circle cx="54" cy="70" r="2.5"/><circle cx="62" cy="70" r="2.5"/><circle cx="70" cy="70" r="2.5"/>
  </g>
  <!-- Some LEDs lit (pattern) -->
  <g fill="#ff2020" opacity="0.9">
    <circle cx="30" cy="22" r="2.5"/><circle cx="38" cy="22" r="2.5"/><circle cx="46" cy="22" r="2.5"/><circle cx="54" cy="22" r="2.5"/>
    <circle cx="22" cy="30" r="2.5"/><circle cx="62" cy="30" r="2.5"/>
    <circle cx="22" cy="38" r="2.5"/><circle cx="62" cy="38" r="2.5"/>
    <circle cx="30" cy="46" r="2.5"/><circle cx="38" cy="46" r="2.5"/><circle cx="46" cy="46" r="2.5"/><circle cx="54" cy="46" r="2.5"/>
  </g>
  <!-- Simplified leads -->
  <line x1="20" y1="78" x2="20" y2="80" stroke="#aaa" stroke-width="1"/>
  <line x1="60" y1="78" x2="60" y2="80" stroke="#aaa" stroke-width="1"/>
  <circle cx="20" cy="40" r="0" fill="transparent"/>
  <circle cx="60" cy="40" r="0" fill="transparent"/>
</svg>
