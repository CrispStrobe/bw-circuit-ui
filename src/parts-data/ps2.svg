<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 50" width="70" height="50">
  <!-- PS/2 Keyboard Interface — 9-pin peripheral (d0-d7 data bus + da strobe) -->
  <!-- Module PCB body -->
  <rect x="6" y="2" width="58" height="46" rx="2" fill="#2a5a2a" stroke="#1a3a1a" stroke-width="1"/>
  <!-- PS/2 connector (round DIN-style) -->
  <circle cx="42" cy="18" r="10" fill="#444" stroke="#333" stroke-width="1"/>
  <circle cx="42" cy="18" r="7" fill="#222" stroke="#555" stroke-width="0.5"/>
  <!-- Connector pin holes -->
  <circle cx="39" cy="14" r="1" fill="#888"/>
  <circle cx="45" cy="14" r="1" fill="#888"/>
  <circle cx="37" cy="18" r="1" fill="#888"/>
  <circle cx="47" cy="18" r="1" fill="#888"/>
  <circle cx="39" cy="22" r="1" fill="#888"/>
  <circle cx="45" cy="22" r="1" fill="#888"/>
  <!-- Labels -->
  <text x="18" y="16" font-family="monospace" font-size="4.5" fill="#c0c0c0">PS/2</text>
  <text x="18" y="22" font-family="monospace" font-size="3" fill="#888">KBD</text>
  <!-- Left pins (d0-d7) -->
  <line x1="0" y1="8" x2="6" y2="8" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="0" cy="8" r="1.2" fill="#c0c0c0"/>
  <line x1="0" y1="13" x2="6" y2="13" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="0" cy="13" r="1.2" fill="#c0c0c0"/>
  <line x1="0" y1="18" x2="6" y2="18" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="0" cy="18" r="1.2" fill="#c0c0c0"/>
  <line x1="0" y1="23" x2="6" y2="23" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="0" cy="23" r="1.2" fill="#c0c0c0"/>
  <line x1="0" y1="28" x2="6" y2="28" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="0" cy="28" r="1.2" fill="#c0c0c0"/>
  <line x1="0" y1="33" x2="6" y2="33" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="0" cy="33" r="1.2" fill="#c0c0c0"/>
  <line x1="0" y1="38" x2="6" y2="38" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="0" cy="38" r="1.2" fill="#c0c0c0"/>
  <line x1="0" y1="43" x2="6" y2="43" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="0" cy="43" r="1.2" fill="#c0c0c0"/>
  <!-- Pin labels d0-d7 -->
  <text x="8" y="9.5" font-family="monospace" font-size="2.5" fill="#888">d0</text>
  <text x="8" y="14.5" font-family="monospace" font-size="2.5" fill="#888">d1</text>
  <text x="8" y="19.5" font-family="monospace" font-size="2.5" fill="#888">d2</text>
  <text x="8" y="24.5" font-family="monospace" font-size="2.5" fill="#888">d3</text>
  <text x="8" y="29.5" font-family="monospace" font-size="2.5" fill="#888">d4</text>
  <text x="8" y="34.5" font-family="monospace" font-size="2.5" fill="#888">d5</text>
  <text x="8" y="39.5" font-family="monospace" font-size="2.5" fill="#888">d6</text>
  <text x="8" y="44.5" font-family="monospace" font-size="2.5" fill="#888">d7</text>
  <!-- Right pin (da) -->
  <line x1="64" y1="25" x2="70" y2="25" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="70" cy="25" r="1.2" fill="#c0c0c0"/>
  <text x="62" y="26.5" text-anchor="end" font-family="monospace" font-size="2.5" fill="#888">da</text>
  <!-- Status LED -->
  <circle cx="14" cy="38" r="2" fill="#1a5a1a" stroke="#0a3a0a" stroke-width="0.5"/>
</svg>
