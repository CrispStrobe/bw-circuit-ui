<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="160" height="100">
  <!-- micro:bit with breakout board — bench-style top view -->
  <!-- The breakout board exposes edge connector pins to breadboard-friendly headers -->

  <!-- Breakout board PCB -->
  <rect x="4" y="30" width="152" height="70" rx="3" fill="#1a5c1a" stroke="#0d3d0d" stroke-width="0.8"/>

  <!-- micro:bit sitting in the slot (top portion visible) -->
  <path d="M30 6 L130 6 L134 10 L134 38 L128 44 L32 44 L26 38 L26 10 Z" fill="#222" stroke="#333" stroke-width="0.8"/>

  <!-- 5x5 LED matrix on micro:bit -->
  <g fill="#ff2020" opacity="0.3">
    <circle cx="64" cy="16" r="1.5"/><circle cx="70" cy="16" r="1.5"/><circle cx="76" cy="16" r="1.5"/><circle cx="82" cy="16" r="1.5"/><circle cx="88" cy="16" r="1.5"/>
    <circle cx="64" cy="22" r="1.5"/><circle cx="70" cy="22" r="1.5"/><circle cx="76" cy="22" r="1.5"/><circle cx="82" cy="22" r="1.5"/><circle cx="88" cy="22" r="1.5"/>
    <circle cx="64" cy="28" r="1.5"/><circle cx="70" cy="28" r="1.5"/><circle cx="76" cy="28" r="1.5"/><circle cx="82" cy="28" r="1.5"/><circle cx="88" cy="28" r="1.5"/>
    <circle cx="64" cy="34" r="1.5"/><circle cx="70" cy="34" r="1.5"/><circle cx="76" cy="34" r="1.5"/><circle cx="82" cy="34" r="1.5"/><circle cx="88" cy="34" r="1.5"/>
    <circle cx="64" cy="40" r="1.5"/><circle cx="70" cy="40" r="1.5"/><circle cx="76" cy="40" r="1.5"/><circle cx="82" cy="40" r="1.5"/><circle cx="88" cy="40" r="1.5"/>
  </g>
  <!-- Heart pattern lit LEDs -->
  <g fill="#ff2020" opacity="0.8">
    <circle cx="70" cy="16" r="1.5"/><circle cx="82" cy="16" r="1.5"/>
    <circle cx="64" cy="22" r="1.5"/><circle cx="76" cy="22" r="1.5"/><circle cx="88" cy="22" r="1.5"/>
    <circle cx="64" cy="28" r="1.5"/><circle cx="88" cy="28" r="1.5"/>
    <circle cx="70" cy="34" r="1.5"/><circle cx="82" cy="34" r="1.5"/>
    <circle cx="76" cy="40" r="1.5"/>
  </g>

  <!-- Button A -->
  <circle cx="40" cy="24" r="4" fill="#333" stroke="#555" stroke-width="0.5"/>
  <circle cx="40" cy="24" r="2.5" fill="#444"/>
  <text x="40" y="34" text-anchor="middle" font-family="monospace" font-size="3" fill="#888">A</text>
  <!-- Button B -->
  <circle cx="112" cy="24" r="4" fill="#333" stroke="#555" stroke-width="0.5"/>
  <circle cx="112" cy="24" r="2.5" fill="#444"/>
  <text x="112" y="34" text-anchor="middle" font-family="monospace" font-size="3" fill="#888">B</text>

  <!-- USB connector on micro:bit -->
  <rect x="70" y="4" width="12" height="4" rx="1" fill="#c0c0c0" stroke="#999" stroke-width="0.3"/>

  <!-- Edge connector slot on breakout board -->
  <rect x="28" y="42" width="104" height="6" rx="1" fill="#333" stroke="#555" stroke-width="0.5"/>

  <!-- Breakout board label -->
  <text x="80" y="58" text-anchor="middle" font-family="monospace" font-size="4" fill="#aaffaa" font-weight="bold">BREAKOUT</text>

  <!-- Left-side pin headers (P0-P7, 3V, GND) -->
  <g font-family="monospace" font-size="3" fill="#ccc" text-anchor="end">
    <text x="18" y="66">P0</text>
    <text x="18" y="74">P1</text>
    <text x="18" y="82">P2</text>
    <text x="18" y="90">3V</text>
    <text x="18" y="98">GND</text>
  </g>
  <!-- Left terminal pads -->
  <circle cx="10" cy="64" r="2" fill="#c0c0c0"/>
  <circle cx="10" cy="72" r="2" fill="#c0c0c0"/>
  <circle cx="10" cy="80" r="2" fill="#c0c0c0"/>
  <circle cx="10" cy="88" r="2" fill="#ff8800"/>
  <circle cx="10" cy="96" r="2" fill="#666"/>
  <!-- Left pin leads -->
  <g stroke="#c0c0c0" stroke-width="1">
    <line x1="4" y1="64" x2="10" y2="64"/>
    <line x1="4" y1="72" x2="10" y2="72"/>
    <line x1="4" y1="80" x2="10" y2="80"/>
    <line x1="4" y1="88" x2="10" y2="88"/>
    <line x1="4" y1="96" x2="10" y2="96"/>
  </g>

  <!-- Right-side pin headers (P8-P16, additional) -->
  <g font-family="monospace" font-size="3" fill="#ccc" text-anchor="start">
    <text x="142" y="66">P8</text>
    <text x="142" y="74">P12</text>
    <text x="142" y="82">P16</text>
    <text x="142" y="90">3V</text>
    <text x="142" y="98">GND</text>
  </g>
  <!-- Right terminal pads -->
  <circle cx="150" cy="64" r="2" fill="#c0c0c0"/>
  <circle cx="150" cy="72" r="2" fill="#c0c0c0"/>
  <circle cx="150" cy="80" r="2" fill="#c0c0c0"/>
  <circle cx="150" cy="88" r="2" fill="#ff8800"/>
  <circle cx="150" cy="96" r="2" fill="#666"/>
  <!-- Right pin leads -->
  <g stroke="#c0c0c0" stroke-width="1">
    <line x1="150" y1="64" x2="156" y2="64"/>
    <line x1="150" y1="72" x2="156" y2="72"/>
    <line x1="150" y1="80" x2="156" y2="80"/>
    <line x1="150" y1="88" x2="156" y2="88"/>
    <line x1="150" y1="96" x2="156" y2="96"/>
  </g>
</svg>
