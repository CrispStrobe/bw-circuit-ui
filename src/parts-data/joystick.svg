<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 60" width="56" height="60">
  <!-- Joystick Module — dual-axis analog with pushbutton, bench-style -->
  <!-- PCB -->
  <rect x="2" y="8" width="52" height="40" rx="2" fill="#1a1a6b" stroke="#0d0d4d" stroke-width="0.8"/>
  <!-- Joystick mechanism base -->
  <rect x="12" y="14" width="32" height="28" rx="2" fill="#505050" stroke="#3a3a3a" stroke-width="0.6"/>
  <!-- Gimbal ring -->
  <circle cx="28" cy="28" r="11" fill="#666" stroke="#555" stroke-width="0.8"/>
  <!-- Stick boot -->
  <circle cx="28" cy="28" r="7" fill="#333" stroke="#222" stroke-width="0.6"/>
  <!-- Stick cap -->
  <circle cx="28" cy="28" r="4.5" fill="#444" stroke="#555" stroke-width="0.4"/>
  <!-- Cap texture lines -->
  <line x1="25" y1="27" x2="31" y2="27" stroke="#555" stroke-width="0.3"/>
  <line x1="25" y1="29" x2="31" y2="29" stroke="#555" stroke-width="0.3"/>
  <!-- Label -->
  <text x="28" y="45" text-anchor="middle" font-family="monospace" font-size="3" fill="#aaa">JOYSTICK</text>
  <!-- 5 header pins: VCC, GND, VRX, VRY, SW -->
  <line x1="8" y1="48" x2="8" y2="60" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="8" cy="60" r="1.5" fill="#c0c0c0"/>
  <line x1="16" y1="48" x2="16" y2="60" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="16" cy="60" r="1.5" fill="#c0c0c0"/>
  <line x1="24" y1="48" x2="24" y2="60" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="24" cy="60" r="1.5" fill="#c0c0c0"/>
  <line x1="32" y1="48" x2="32" y2="60" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="32" cy="60" r="1.5" fill="#c0c0c0"/>
  <line x1="40" y1="48" x2="40" y2="60" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="40" cy="60" r="1.5" fill="#c0c0c0"/>
</svg>
