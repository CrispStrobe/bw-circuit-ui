<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" width="60" height="40">
  <!-- Ultrasonic Distance Sensor (HC-SR04) — bench-style front view -->
  <!-- PCB -->
  <rect x="2" y="6" width="56" height="28" rx="2" fill="#0066aa" stroke="#004080" stroke-width="0.8"/>
  <!-- Two transducer cylinders -->
  <circle cx="18" cy="20" r="9" fill="#c0c0c0" stroke="#999" stroke-width="0.8"/>
  <circle cx="18" cy="20" r="6" fill="#aaa" stroke="#888" stroke-width="0.3"/>
  <circle cx="42" cy="20" r="9" fill="#c0c0c0" stroke="#999" stroke-width="0.8"/>
  <circle cx="42" cy="20" r="6" fill="#aaa" stroke="#888" stroke-width="0.3"/>
  <!-- Crystal marking -->
  <rect x="26" y="10" width="8" height="4" rx="0.5" fill="#c0c0c0" stroke="#999" stroke-width="0.3"/>
  <!-- Pin header at bottom -->
  <line x1="12" y1="34" x2="12" y2="40" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="22" y1="34" x2="22" y2="40" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="32" y1="34" x2="32" y2="40" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="42" y1="34" x2="42" y2="40" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="12" cy="40" r="1.5" fill="#c0c0c0"/>
  <circle cx="22" cy="40" r="1.5" fill="#c0c0c0"/>
  <circle cx="32" cy="40" r="1.5" fill="#c0c0c0"/>
  <circle cx="42" cy="40" r="1.5" fill="#c0c0c0"/>
  <text x="12" y="32" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#90b0d0">VCC</text>
  <text x="22" y="32" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#90b0d0">TRIG</text>
  <text x="32" y="32" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#90b0d0">ECHO</text>
  <text x="42" y="32" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#90b0d0">GND</text>
</svg>
