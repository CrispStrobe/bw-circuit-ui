<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 20" width="64" height="20">
  <!-- Resistor — bench-style axial through-hole, horizontal -->
  <!-- Lead wires -->
  <line x1="2" y1="10" x2="14" y2="10" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="10" x2="62" y2="10" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Body (tan/beige ceramic cylinder) -->
  <rect x="14" y="3" width="36" height="14" rx="3" fill="#d4b896" stroke="#b89870" stroke-width="0.8"/>
  <!-- Color bands -->
  <rect x="19" y="3" width="3" height="14" rx="0.5" fill="#a04020" opacity="0.85"/>
  <rect x="25" y="3" width="3" height="14" rx="0.5" fill="#222" opacity="0.85"/>
  <rect x="31" y="3" width="3" height="14" rx="0.5" fill="#dd4400" opacity="0.85"/>
  <rect x="41" y="3" width="3" height="14" rx="0.5" fill="#c8a040" opacity="0.85"/>
  <!-- Terminal pads -->
  <circle cx="2" cy="10" r="2" fill="#c0c0c0"/>
  <circle cx="62" cy="10" r="2" fill="#c0c0c0"/>
</svg>
