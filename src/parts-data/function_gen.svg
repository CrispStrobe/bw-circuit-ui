<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 56" width="80" height="56">
  <!-- Function Generator — bench instrument, bench-style -->
  <!-- Body -->
  <rect x="2" y="2" width="76" height="44" rx="3" fill="#2a3a2a" stroke="#1a2a1a" stroke-width="1"/>
  <!-- Display -->
  <rect x="6" y="6" width="36" height="14" rx="1" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
  <text x="24" y="16" text-anchor="middle" font-family="monospace" font-size="6" fill="#40ff40">1.0kHz</text>
  <!-- Waveform preview -->
  <path d="M8 24 Q12 18 16 24 Q20 30 24 24 Q28 18 32 24 Q36 30 40 24" fill="none" stroke="#40ff40" stroke-width="0.8"/>
  <!-- Knobs -->
  <circle cx="54" cy="14" r="5" fill="#555" stroke="#444" stroke-width="0.5"/>
  <line x1="54" y1="10" x2="54" y2="14" stroke="#888" stroke-width="1"/>
  <circle cx="68" cy="14" r="4" fill="#555" stroke="#444" stroke-width="0.5"/>
  <!-- Waveform buttons -->
  <rect x="48" y="26" width="8" height="6" rx="1" fill="#444" stroke="#555" stroke-width="0.3"/>
  <rect x="58" y="26" width="8" height="6" rx="1" fill="#444" stroke="#555" stroke-width="0.3"/>
  <rect x="68" y="26" width="8" height="6" rx="1" fill="#444" stroke="#555" stroke-width="0.3"/>
  <!-- Labels -->
  <text x="52" y="38" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#888">SIN</text>
  <text x="62" y="38" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#888">SQR</text>
  <text x="72" y="38" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#888">TRI</text>
  <!-- Output terminals -->
  <circle cx="24" cy="42" r="3" fill="#222" stroke="#444" stroke-width="0.5"/>
  <circle cx="24" cy="42" r="1.5" fill="#cc3030"/>
  <circle cx="40" cy="42" r="3" fill="#222" stroke="#444" stroke-width="0.5"/>
  <circle cx="40" cy="42" r="1.5" fill="#333"/>
  <line x1="24" y1="46" x2="24" y2="56" stroke="#cc3030" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40" y1="46" x2="40" y2="56" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="24" cy="56" r="2" fill="#cc3030"/>
  <circle cx="40" cy="56" r="2" fill="#333"/>
</svg>
