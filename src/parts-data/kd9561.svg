<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 48" width="40" height="48">
  <!-- KD9561 Sound-Effect IC — 8-pin DIP-style, bench-style -->
  <!-- Package body -->
  <rect x="6" y="2" width="28" height="34" rx="2" fill="#303030" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Notch -->
  <path d="M17 2 Q20 5 23 2" fill="#303030" stroke="#555" stroke-width="0.6"/>
  <!-- Pin 1 dot -->
  <circle cx="11" cy="8" r="1.2" fill="#b0b0b0"/>
  <!-- Label -->
  <text x="20" y="18" text-anchor="middle" font-family="monospace" font-size="4" fill="#c0c0c0">KD9561</text>
  <!-- Speaker icon -->
  <rect x="15" y="22" width="4" height="5" rx="0.5" fill="#888"/>
  <path d="M19 22 L23 19 L23 29 L19 27 Z" fill="#888" opacity="0.7"/>
  <!-- Sound waves -->
  <path d="M24 22 Q26 24 24 26" fill="none" stroke="#888" stroke-width="0.5"/>
  <path d="M25.5 21 Q28 24 25.5 27" fill="none" stroke="#888" stroke-width="0.4"/>
  <!-- Left pins: VDD, GND, OUT (top to bottom) -->
  <line x1="0" y1="10" x2="6" y2="10" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="0" cy="10" r="1.5" fill="#c0c0c0"/>
  <line x1="0" y1="20" x2="6" y2="20" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="0" cy="20" r="1.5" fill="#c0c0c0"/>
  <line x1="0" y1="30" x2="6" y2="30" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="0" cy="30" r="1.5" fill="#c0c0c0"/>
  <!-- Right pins: SEL1, SEL2 (top to bottom) -->
  <line x1="34" y1="10" x2="40" y2="10" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="40" cy="10" r="1.5" fill="#c0c0c0"/>
  <line x1="34" y1="20" x2="40" y2="20" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="40" cy="20" r="1.5" fill="#c0c0c0"/>
  <!-- Pin labels -->
  <text x="5" y="42" font-family="monospace" font-size="2.5" fill="#666">VDD GND OUT</text>
  <text x="24" y="42" font-family="monospace" font-size="2.5" fill="#666">S1 S2</text>
</svg>
