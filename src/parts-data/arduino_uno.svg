<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120" width="180" height="120">
  <!-- Arduino Uno R3 — bench-style top-down view, accurate pin layout -->
  <!-- PCB outline -->
  <rect x="2" y="2" width="176" height="116" rx="4" fill="#0066aa" stroke="#004080" stroke-width="1.2"/>
  <!-- USB-B connector (left side) -->
  <rect x="0" y="38" width="16" height="20" rx="2" fill="#c0c0c0" stroke="#999" stroke-width="0.8"/>
  <rect x="2" y="41" width="12" height="14" rx="1" fill="#666"/>
  <!-- DC barrel jack -->
  <rect x="0" y="68" width="14" height="12" rx="2" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
  <circle cx="7" cy="74" r="3" fill="#333" stroke="#444" stroke-width="0.3"/>
  <!-- ATmega328P DIP-28 -->
  <rect x="60" y="38" width="50" height="30" rx="2" fill="#1a1a1a" stroke="#333" stroke-width="0.8"/>
  <path d="M80 38 Q85 42 90 38" fill="#1a1a1a" stroke="#555" stroke-width="0.5"/>
  <circle cx="65" cy="43" r="1.2" fill="#666"/>
  <text x="85" y="54" text-anchor="middle" font-family="monospace" font-size="4.5" fill="#888">ATmega328P</text>
  <text x="85" y="62" text-anchor="middle" font-family="monospace" font-size="3.5" fill="#666">UNO R3</text>
  <!-- Crystal -->
  <rect x="116" y="48" width="8" height="12" rx="1" fill="#c0c0c0" stroke="#999" stroke-width="0.3"/>
  <!-- LEDs -->
  <circle cx="28" cy="100" r="1.8" fill="#00ff00" opacity="0.8"/>
  <text x="28" y="108" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#00aa00">PWR</text>
  <circle cx="38" cy="100" r="1.3" fill="#ff4040" opacity="0.5"/>
  <circle cx="44" cy="100" r="1.3" fill="#ffff40" opacity="0.5"/>
  <!-- Reset button -->
  <rect x="130" y="26" width="8" height="6" rx="1" fill="#ddd" stroke="#999" stroke-width="0.3"/>
  <text x="134" y="24" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#90b0d0">RST</text>
  <!-- ICSP header -->
  <rect x="140" y="50" width="10" height="14" rx="1" fill="#333" stroke="#555" stroke-width="0.3"/>

  <!-- TOP HEADER: D0-D13 + GND + AREF -->
  <rect x="30" y="2" width="142" height="7" rx="1" fill="#333" stroke="#444" stroke-width="0.3"/>
  <g fill="#222" stroke="#555" stroke-width="0.2">
    <rect x="34" y="3" width="4" height="5" rx="0.5"/>
    <rect x="42" y="3" width="4" height="5" rx="0.5"/>
    <rect x="50" y="3" width="4" height="5" rx="0.5"/>
    <rect x="58" y="3" width="4" height="5" rx="0.5"/>
    <rect x="66" y="3" width="4" height="5" rx="0.5"/>
    <rect x="74" y="3" width="4" height="5" rx="0.5"/>
    <rect x="82" y="3" width="4" height="5" rx="0.5"/>
    <rect x="90" y="3" width="4" height="5" rx="0.5"/>
    <rect x="102" y="3" width="4" height="5" rx="0.5"/>
    <rect x="110" y="3" width="4" height="5" rx="0.5"/>
    <rect x="118" y="3" width="4" height="5" rx="0.5"/>
    <rect x="126" y="3" width="4" height="5" rx="0.5"/>
    <rect x="134" y="3" width="4" height="5" rx="0.5"/>
    <rect x="142" y="3" width="4" height="5" rx="0.5"/>
    <rect x="152" y="3" width="4" height="5" rx="0.5"/>
    <rect x="160" y="3" width="4" height="5" rx="0.5"/>
  </g>
  <g font-family="monospace" font-size="2.5" fill="#90b0d0" text-anchor="middle">
    <text x="36" y="16">D0</text><text x="44" y="16">D1</text>
    <text x="52" y="16">D2</text><text x="60" y="16">D3</text>
    <text x="68" y="16">D4</text><text x="76" y="16">D5</text>
    <text x="84" y="16">D6</text><text x="92" y="16">D7</text>
    <text x="104" y="16">D8</text><text x="112" y="16">D9</text>
    <text x="120" y="16">10</text><text x="128" y="16">11</text>
    <text x="136" y="16">12</text><text x="144" y="16">13</text>
    <text x="154" y="16">GND</text><text x="162" y="16">REF</text>
  </g>

  <!-- BOTTOM HEADERS: Power + Analog -->
  <rect x="24" y="111" width="62" height="7" rx="1" fill="#333" stroke="#444" stroke-width="0.3"/>
  <g fill="#222" stroke="#555" stroke-width="0.2">
    <rect x="28" y="112" width="4" height="5" rx="0.5"/>
    <rect x="36" y="112" width="4" height="5" rx="0.5"/>
    <rect x="44" y="112" width="4" height="5" rx="0.5"/>
    <rect x="52" y="112" width="4" height="5" rx="0.5"/>
    <rect x="60" y="112" width="4" height="5" rx="0.5"/>
    <rect x="68" y="112" width="4" height="5" rx="0.5"/>
  </g>
  <rect x="96" y="111" width="64" height="7" rx="1" fill="#333" stroke="#444" stroke-width="0.3"/>
  <g fill="#222" stroke="#555" stroke-width="0.2">
    <rect x="100" y="112" width="4" height="5" rx="0.5"/>
    <rect x="108" y="112" width="4" height="5" rx="0.5"/>
    <rect x="116" y="112" width="4" height="5" rx="0.5"/>
    <rect x="124" y="112" width="4" height="5" rx="0.5"/>
    <rect x="132" y="112" width="4" height="5" rx="0.5"/>
    <rect x="140" y="112" width="4" height="5" rx="0.5"/>
  </g>
  <g font-family="monospace" font-size="2.5" fill="#90b0d0" text-anchor="middle">
    <text x="30" y="109">RST</text><text x="38" y="109">3V3</text>
    <text x="46" y="109">5V</text><text x="54" y="109">GND</text>
    <text x="62" y="109">GND</text><text x="70" y="109">VIN</text>
    <text x="102" y="109">A0</text><text x="110" y="109">A1</text>
    <text x="118" y="109">A2</text><text x="126" y="109">A3</text>
    <text x="134" y="109">A4</text><text x="142" y="109">A5</text>
  </g>

  <!-- Terminal pads -->
  <g fill="#c0c0c0">
    <circle cx="36" cy="0" r="1.5"/><circle cx="44" cy="0" r="1.5"/>
    <circle cx="52" cy="0" r="1.5"/><circle cx="60" cy="0" r="1.5"/>
    <circle cx="68" cy="0" r="1.5"/><circle cx="76" cy="0" r="1.5"/>
    <circle cx="84" cy="0" r="1.5"/><circle cx="92" cy="0" r="1.5"/>
    <circle cx="104" cy="0" r="1.5"/><circle cx="112" cy="0" r="1.5"/>
    <circle cx="120" cy="0" r="1.5"/><circle cx="128" cy="0" r="1.5"/>
    <circle cx="136" cy="0" r="1.5"/><circle cx="144" cy="0" r="1.5"/>
  </g>
  <circle cx="154" cy="0" r="1.5" fill="#666"/>
  <circle cx="162" cy="0" r="1.5" fill="#c0c0c0"/>
  <g>
    <circle cx="30" cy="120" r="1.5" fill="#c0c0c0"/>
    <circle cx="38" cy="120" r="1.5" fill="#ff8800"/>
    <circle cx="46" cy="120" r="1.5" fill="#cc3030"/>
    <circle cx="54" cy="120" r="1.5" fill="#666"/>
    <circle cx="62" cy="120" r="1.5" fill="#666"/>
    <circle cx="70" cy="120" r="1.5" fill="#c0c0c0"/>
    <circle cx="102" cy="120" r="1.5" fill="#c0c0c0"/>
    <circle cx="110" cy="120" r="1.5" fill="#c0c0c0"/>
    <circle cx="118" cy="120" r="1.5" fill="#c0c0c0"/>
    <circle cx="126" cy="120" r="1.5" fill="#c0c0c0"/>
    <circle cx="134" cy="120" r="1.5" fill="#c0c0c0"/>
    <circle cx="142" cy="120" r="1.5" fill="#c0c0c0"/>
  </g>
</svg>
