<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 210" width="60" height="210">
  <!-- Raspberry Pi Pico — bench-style top view, breadboard orientation -->
  <!-- RP2040, 40-pin DIP-style header layout -->

  <!-- PCB (green, characteristic Pico shape) -->
  <rect x="6" y="4" width="48" height="202" rx="2" fill="#007744" stroke="#005533" stroke-width="0.8"/>

  <!-- Micro-USB connector (top) -->
  <rect x="18" y="0" width="24" height="7" rx="1.5" fill="#c0c0c0" stroke="#999" stroke-width="0.4"/>

  <!-- RP2040 chip (QFN center) -->
  <rect x="14" y="70" width="32" height="32" rx="1" fill="#222" stroke="#333" stroke-width="0.5"/>
  <circle cx="18" cy="74" r="1.5" fill="#555"/>
  <text x="30" y="90" text-anchor="middle" font-family="monospace" font-size="3" fill="#888">RP2040</text>

  <!-- Flash chip -->
  <rect x="20" y="110" width="14" height="8" rx="0.5" fill="#333" stroke="#444" stroke-width="0.3"/>

  <!-- BOOTSEL button -->
  <rect x="22" y="48" width="10" height="5" rx="1" fill="#ddd" stroke="#aaa" stroke-width="0.3"/>
  <text x="27" y="58" text-anchor="middle" font-family="monospace" font-size="2" fill="#aaa">BOOT</text>

  <!-- Onboard LED (GP25) -->
  <circle cx="42" cy="42" r="1.5" fill="#00ff00" opacity="0.5"/>

  <!-- Board label -->
  <text x="30" y="135" text-anchor="middle" font-family="monospace" font-size="4" fill="#aaffaa" font-weight="bold">PICO</text>

  <!-- Left-side pins (physical pins 1-20, top to bottom) -->
  <g font-family="monospace" font-size="2" fill="#ccc" text-anchor="end">
    <text x="13" y="16">GP0</text>
    <text x="13" y="24">GP1</text>
    <text x="13" y="32">GND</text>
    <text x="13" y="40">GP2</text>
    <text x="13" y="48">GP3</text>
    <text x="13" y="56">GP4</text>
    <text x="13" y="64">GP5</text>
    <text x="13" y="72">GND</text>
    <text x="13" y="80">GP6</text>
    <text x="13" y="88">GP7</text>
    <text x="13" y="96">GP8</text>
    <text x="13" y="104">GP9</text>
    <text x="13" y="112">GND</text>
    <text x="13" y="120">GP10</text>
    <text x="13" y="128">GP11</text>
    <text x="13" y="136">GP12</text>
    <text x="13" y="144">GP13</text>
    <text x="13" y="152">GND</text>
    <text x="13" y="160">GP14</text>
    <text x="13" y="168">GP15</text>
  </g>
  <g fill="#c0c0c0">
    <circle cx="4" cy="14" r="1.8"/>
    <circle cx="4" cy="22" r="1.8"/>
    <circle cx="4" cy="30" r="1.8"/><circle cx="4" cy="30" r="1.8" fill="#666"/>
    <circle cx="4" cy="38" r="1.8"/>
    <circle cx="4" cy="46" r="1.8"/>
    <circle cx="4" cy="54" r="1.8"/>
    <circle cx="4" cy="62" r="1.8"/>
    <circle cx="4" cy="70" r="1.8"/><circle cx="4" cy="70" r="1.8" fill="#666"/>
    <circle cx="4" cy="78" r="1.8"/>
    <circle cx="4" cy="86" r="1.8"/>
    <circle cx="4" cy="94" r="1.8"/>
    <circle cx="4" cy="102" r="1.8"/>
    <circle cx="4" cy="110" r="1.8"/><circle cx="4" cy="110" r="1.8" fill="#666"/>
    <circle cx="4" cy="118" r="1.8"/>
    <circle cx="4" cy="126" r="1.8"/>
    <circle cx="4" cy="134" r="1.8"/>
    <circle cx="4" cy="142" r="1.8"/>
    <circle cx="4" cy="150" r="1.8"/><circle cx="4" cy="150" r="1.8" fill="#666"/>
    <circle cx="4" cy="158" r="1.8"/>
    <circle cx="4" cy="166" r="1.8"/>
  </g>

  <!-- Right-side pins (physical pins 40-21, top to bottom) -->
  <g font-family="monospace" font-size="2" fill="#ccc" text-anchor="start">
    <text x="47" y="16">VBUS</text>
    <text x="47" y="24">VSYS</text>
    <text x="47" y="32">GND</text>
    <text x="47" y="40">3V3E</text>
    <text x="47" y="48">3V3</text>
    <text x="47" y="56">VREF</text>
    <text x="47" y="64">GP28</text>
    <text x="47" y="72">AGND</text>
    <text x="47" y="80">GP27</text>
    <text x="47" y="88">GP26</text>
    <text x="47" y="96">RUN</text>
    <text x="47" y="104">GP22</text>
    <text x="47" y="112">GND</text>
    <text x="47" y="120">GP21</text>
    <text x="47" y="128">GP20</text>
    <text x="47" y="136">GP19</text>
    <text x="47" y="144">GP18</text>
    <text x="47" y="152">GND</text>
    <text x="47" y="160">GP17</text>
    <text x="47" y="168">GP16</text>
  </g>
  <g fill="#c0c0c0">
    <circle cx="56" cy="14" r="1.8"/><circle cx="56" cy="14" r="1.8" fill="#ff4400"/>
    <circle cx="56" cy="22" r="1.8"/><circle cx="56" cy="22" r="1.8" fill="#ff4400"/>
    <circle cx="56" cy="30" r="1.8"/><circle cx="56" cy="30" r="1.8" fill="#666"/>
    <circle cx="56" cy="38" r="1.8"/>
    <circle cx="56" cy="46" r="1.8"/><circle cx="56" cy="46" r="1.8" fill="#ff8800"/>
    <circle cx="56" cy="54" r="1.8"/>
    <circle cx="56" cy="62" r="1.8"/>
    <circle cx="56" cy="70" r="1.8"/><circle cx="56" cy="70" r="1.8" fill="#666"/>
    <circle cx="56" cy="78" r="1.8"/>
    <circle cx="56" cy="86" r="1.8"/>
    <circle cx="56" cy="94" r="1.8"/>
    <circle cx="56" cy="102" r="1.8"/>
    <circle cx="56" cy="110" r="1.8"/><circle cx="56" cy="110" r="1.8" fill="#666"/>
    <circle cx="56" cy="118" r="1.8"/>
    <circle cx="56" cy="126" r="1.8"/>
    <circle cx="56" cy="134" r="1.8"/>
    <circle cx="56" cy="142" r="1.8"/>
    <circle cx="56" cy="150" r="1.8"/><circle cx="56" cy="150" r="1.8" fill="#666"/>
    <circle cx="56" cy="158" r="1.8"/>
    <circle cx="56" cy="166" r="1.8"/>
  </g>

  <!-- Debug pins at bottom (SWD) -->
  <g font-family="monospace" font-size="2" fill="#999" text-anchor="middle">
    <text x="20" y="194">SWCLK</text>
    <text x="30" y="194">GND</text>
    <text x="40" y="194">SWDIO</text>
  </g>
  <circle cx="20" cy="198" r="1.5" fill="#c0c0c0"/>
  <circle cx="30" cy="198" r="1.5" fill="#666"/>
  <circle cx="40" cy="198" r="1.5" fill="#c0c0c0"/>
</svg>
