<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 50" width="88" height="50">
  <!-- XPT2046 Touch Controller Module — breakout board, bench-style -->
  <!-- PCB -->
  <rect x="2" y="2" width="84" height="38" rx="2" fill="#1a6b1a" stroke="#0d4d0d" stroke-width="0.8"/>
  <!-- IC package -->
  <rect x="28" y="10" width="32" height="16" rx="1" fill="#303030" stroke="#1a1a1a" stroke-width="0.6"/>
  <text x="44" y="19" text-anchor="middle" font-family="monospace" font-size="4.5" fill="#c0c0c0">XPT2046</text>
  <text x="44" y="25" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#888">TOUCH</text>
  <!-- Decoupling cap -->
  <rect x="66" y="12" width="6" height="3" rx="0.5" fill="#c89632" stroke="#8a6a20" stroke-width="0.3"/>
  <!-- Mounting holes -->
  <circle cx="7" cy="7" r="2" fill="none" stroke="#888" stroke-width="0.4"/>
  <circle cx="81" cy="7" r="2" fill="none" stroke="#888" stroke-width="0.4"/>
  <!-- 10 header pins at bottom -->
  <line x1="8" y1="40" x2="8" y2="50" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="8" cy="50" r="1.5" fill="#c0c0c0"/>
  <line x1="16" y1="40" x2="16" y2="50" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="16" cy="50" r="1.5" fill="#c0c0c0"/>
  <line x1="24" y1="40" x2="24" y2="50" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="24" cy="50" r="1.5" fill="#c0c0c0"/>
  <line x1="32" y1="40" x2="32" y2="50" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="32" cy="50" r="1.5" fill="#c0c0c0"/>
  <line x1="40" y1="40" x2="40" y2="50" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="40" cy="50" r="1.5" fill="#c0c0c0"/>
  <line x1="48" y1="40" x2="48" y2="50" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="48" cy="50" r="1.5" fill="#c0c0c0"/>
  <line x1="56" y1="40" x2="56" y2="50" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="56" cy="50" r="1.5" fill="#c0c0c0"/>
  <line x1="64" y1="40" x2="64" y2="50" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="64" cy="50" r="1.5" fill="#c0c0c0"/>
  <line x1="72" y1="40" x2="72" y2="50" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="72" cy="50" r="1.5" fill="#c0c0c0"/>
  <line x1="80" y1="40" x2="80" y2="50" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="80" cy="50" r="1.5" fill="#c0c0c0"/>
</svg>
