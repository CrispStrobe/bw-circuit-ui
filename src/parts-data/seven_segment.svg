<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 70" width="50" height="70">
  <!-- 7-Segment Display — single digit, bench-style front view -->
  <!-- Housing -->
  <rect x="2" y="2" width="46" height="56" rx="2" fill="#1a1a1a" stroke="#333" stroke-width="0.8"/>
  <!-- Display window (dark red background) -->
  <rect x="8" y="6" width="34" height="48" rx="1" fill="#200808"/>
  <!-- Segment a (top) -->
  <rect x="14" y="10" width="22" height="4" rx="1" fill="#ff2020" opacity="0.8"/>
  <!-- Segment b (top right) -->
  <rect x="34" y="14" width="4" height="16" rx="1" fill="#ff2020" opacity="0.8"/>
  <!-- Segment c (bottom right) -->
  <rect x="34" y="32" width="4" height="16" rx="1" fill="#ff2020" opacity="0.8"/>
  <!-- Segment d (bottom) -->
  <rect x="14" y="46" width="22" height="4" rx="1" fill="#ff2020" opacity="0.8"/>
  <!-- Segment e (bottom left) -->
  <rect x="12" y="32" width="4" height="16" rx="1" fill="#ff2020" opacity="0.3"/>
  <!-- Segment f (top left) -->
  <rect x="12" y="14" width="4" height="16" rx="1" fill="#ff2020" opacity="0.3"/>
  <!-- Segment g (middle) -->
  <rect x="14" y="28" width="22" height="4" rx="1" fill="#ff2020" opacity="0.3"/>
  <!-- DP -->
  <circle cx="42" cy="49" r="2" fill="#ff2020" opacity="0.3"/>
  <!-- Leads at bottom (composite - simplified) -->
  <line x1="15" y1="58" x2="15" y2="70" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="25" y1="58" x2="25" y2="70" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="35" y1="58" x2="35" y2="70" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
</svg>
