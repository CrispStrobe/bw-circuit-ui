<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 50" width="72" height="50">
  <!-- ISD1820 Voice Record/Playback Module — bench-style -->
  <!-- PCB -->
  <rect x="2" y="2" width="68" height="36" rx="2" fill="#8b1a1a" stroke="#5a0d0d" stroke-width="0.8"/>
  <!-- ISD1820 IC -->
  <rect x="24" y="6" width="20" height="12" rx="1" fill="#303030" stroke="#1a1a1a" stroke-width="0.6"/>
  <text x="34" y="12" text-anchor="middle" font-family="monospace" font-size="3.5" fill="#c0c0c0">ISD1820</text>
  <!-- Electret microphone -->
  <circle cx="10" cy="14" r="4" fill="#b0b0b0" stroke="#888" stroke-width="0.5"/>
  <circle cx="10" cy="14" r="2.5" fill="#999" stroke="#777" stroke-width="0.3"/>
  <circle cx="10" cy="14" r="0.5" fill="#666"/>
  <!-- Speaker terminals -->
  <rect x="54" y="8" width="10" height="8" rx="1" fill="#444" stroke="#333" stroke-width="0.4"/>
  <text x="59" y="13" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#aaa">SP</text>
  <!-- Control buttons (REC, PLAYE, PLAYL) -->
  <rect x="8" y="22" width="8" height="5" rx="1" fill="#cc3333" stroke="#992222" stroke-width="0.4"/>
  <text x="12" y="26" text-anchor="middle" font-family="monospace" font-size="2" fill="#fff">REC</text>
  <rect x="20" y="22" width="8" height="5" rx="1" fill="#336633" stroke="#224422" stroke-width="0.4"/>
  <text x="24" y="26" text-anchor="middle" font-family="monospace" font-size="2" fill="#fff">P-E</text>
  <rect x="32" y="22" width="8" height="5" rx="1" fill="#336633" stroke="#224422" stroke-width="0.4"/>
  <text x="36" y="26" text-anchor="middle" font-family="monospace" font-size="2" fill="#fff">P-L</text>
  <!-- Status LED -->
  <circle cx="58" cy="24" r="1.5" fill="#600000" stroke="#400000" stroke-width="0.3"/>
  <!-- Decoupling cap -->
  <rect x="48" y="22" width="5" height="2.5" rx="0.5" fill="#c89632" stroke="#8a6a20" stroke-width="0.3"/>
  <!-- Mounting holes -->
  <circle cx="6" cy="6" r="1.5" fill="none" stroke="#888" stroke-width="0.4"/>
  <circle cx="66" cy="6" r="1.5" fill="none" stroke="#888" stroke-width="0.4"/>
  <!-- Label -->
  <text x="36" y="35" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#aaa">VOICE MODULE</text>
  <!-- 8 header pins -->
  <line x1="8" y1="38" x2="8" y2="50" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="8" cy="50" r="1.5" fill="#c0c0c0"/>
  <line x1="16" y1="38" x2="16" y2="50" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="16" cy="50" r="1.5" fill="#c0c0c0"/>
  <line x1="24" y1="38" x2="24" y2="50" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="24" cy="50" r="1.5" fill="#c0c0c0"/>
  <line x1="32" y1="38" x2="32" y2="50" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="32" cy="50" r="1.5" fill="#c0c0c0"/>
  <line x1="40" y1="38" x2="40" y2="50" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="40" cy="50" r="1.5" fill="#c0c0c0"/>
  <line x1="48" y1="38" x2="48" y2="50" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="48" cy="50" r="1.5" fill="#c0c0c0"/>
  <line x1="56" y1="38" x2="56" y2="50" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="56" cy="50" r="1.5" fill="#c0c0c0"/>
  <line x1="64" y1="38" x2="64" y2="50" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="64" cy="50" r="1.5" fill="#c0c0c0"/>
</svg>
