<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 66 36" width="66" height="36">
  <!-- TM1637 4-digit 7-segment display module -->
  <rect x="1" y="1" width="64" height="30" rx="2" fill="#1a1a2e" stroke="#16213e" stroke-width="1"/>
  <!-- Four digit windows -->
  <g fill="#0a0a15" stroke="#333" stroke-width="0.5">
    <rect x="5" y="5" width="12" height="18" rx="1"/>
    <rect x="19" y="5" width="12" height="18" rx="1"/>
    <rect x="35" y="5" width="12" height="18" rx="1"/>
    <rect x="49" y="5" width="12" height="18" rx="1"/>
  </g>
  <!-- Segment placeholders (dim) -->
  <g fill="#1a3a1a" opacity="0.4">
    <rect x="7" y="7" width="8" height="1.5" rx="0.5"/><rect x="7" y="13" width="8" height="1.5" rx="0.5"/>
    <rect x="7" y="19" width="8" height="1.5" rx="0.5"/>
    <rect x="21" y="7" width="8" height="1.5" rx="0.5"/><rect x="21" y="13" width="8" height="1.5" rx="0.5"/>
    <rect x="21" y="19" width="8" height="1.5" rx="0.5"/>
    <rect x="37" y="7" width="8" height="1.5" rx="0.5"/><rect x="37" y="13" width="8" height="1.5" rx="0.5"/>
    <rect x="37" y="19" width="8" height="1.5" rx="0.5"/>
    <rect x="51" y="7" width="8" height="1.5" rx="0.5"/><rect x="51" y="13" width="8" height="1.5" rx="0.5"/>
    <rect x="51" y="19" width="8" height="1.5" rx="0.5"/>
  </g>
  <!-- Colon dots -->
  <circle cx="33" cy="11" r="1" fill="#1a3a1a" opacity="0.4"/>
  <circle cx="33" cy="17" r="1" fill="#1a3a1a" opacity="0.4"/>
  <!-- Bottom pins -->
  <g stroke="#aaa" stroke-width="1.2" stroke-linecap="round">
    <line x1="18" y1="31" x2="18" y2="36"/><line x1="28" y1="31" x2="28" y2="36"/>
    <line x1="38" y1="31" x2="38" y2="36"/><line x1="48" y1="31" x2="48" y2="36"/>
  </g>
  <g fill="#c0c0c0">
    <circle cx="18" cy="36" r="1.2"/><circle cx="28" cy="36" r="1.2"/>
    <circle cx="38" cy="36" r="1.2"/><circle cx="48" cy="36" r="1.2"/>
  </g>
</svg>
