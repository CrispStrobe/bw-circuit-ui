<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 12" width="48" height="12">
  <!-- 8-Pin Header — single-row male, bench-style -->
  <!-- Plastic housing -->
  <rect x="2" y="2" width="44" height="8" rx="1" fill="#333" stroke="#444" stroke-width="0.5"/>
  <!-- 8 pins -->
  <g fill="#c0a040" stroke="#a08020" stroke-width="0.2">
    <rect x="4" y="0" width="2" height="12" rx="0.3"/>
    <rect x="10" y="0" width="2" height="12" rx="0.3"/>
    <rect x="16" y="0" width="2" height="12" rx="0.3"/>
    <rect x="22" y="0" width="2" height="12" rx="0.3"/>
    <rect x="28" y="0" width="2" height="12" rx="0.3"/>
    <rect x="34" y="0" width="2" height="12" rx="0.3"/>
    <rect x="40" y="0" width="2" height="12" rx="0.3"/>
    <rect x="46" y="0" width="2" height="12" rx="0.3"/>
  </g>
  <!-- Terminal pads -->
  <circle cx="5" cy="0" r="1" fill="#c0c0c0"/>
  <circle cx="11" cy="0" r="1" fill="#c0c0c0"/>
  <circle cx="17" cy="0" r="1" fill="#c0c0c0"/>
  <circle cx="23" cy="0" r="1" fill="#c0c0c0"/>
  <circle cx="29" cy="0" r="1" fill="#c0c0c0"/>
  <circle cx="35" cy="0" r="1" fill="#c0c0c0"/>
  <circle cx="41" cy="0" r="1" fill="#c0c0c0"/>
  <circle cx="47" cy="0" r="1" fill="#c0c0c0"/>
</svg>
