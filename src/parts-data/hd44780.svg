<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 70" width="160" height="70">
  <!-- HD44780 16x2 Character LCD module — bench-style front view -->
  <!-- PCB board -->
  <rect x="0" y="0" width="160" height="62" rx="3" fill="#1a6a2a" stroke="#0e4a1a" stroke-width="1"/>
  <!-- LCD glass window -->
  <rect x="12" y="6" width="120" height="32" rx="2" fill="#3a5a2a" stroke="#2a4a1a" stroke-width="0.5"/>
  <!-- Character grid (16x2) -->
  <g fill="#4a7a3a" opacity="0.8">
    <!-- Row 1 -->
    <rect x="16" y="10" width="5" height="8" rx="0.5"/>
    <rect x="23" y="10" width="5" height="8" rx="0.5"/>
    <rect x="30" y="10" width="5" height="8" rx="0.5"/>
    <rect x="37" y="10" width="5" height="8" rx="0.5"/>
    <rect x="44" y="10" width="5" height="8" rx="0.5"/>
    <rect x="51" y="10" width="5" height="8" rx="0.5"/>
    <rect x="58" y="10" width="5" height="8" rx="0.5"/>
    <rect x="65" y="10" width="5" height="8" rx="0.5"/>
    <rect x="72" y="10" width="5" height="8" rx="0.5"/>
    <rect x="79" y="10" width="5" height="8" rx="0.5"/>
    <rect x="86" y="10" width="5" height="8" rx="0.5"/>
    <rect x="93" y="10" width="5" height="8" rx="0.5"/>
    <rect x="100" y="10" width="5" height="8" rx="0.5"/>
    <rect x="107" y="10" width="5" height="8" rx="0.5"/>
    <rect x="114" y="10" width="5" height="8" rx="0.5"/>
    <rect x="121" y="10" width="5" height="8" rx="0.5"/>
    <!-- Row 2 -->
    <rect x="16" y="24" width="5" height="8" rx="0.5"/>
    <rect x="23" y="24" width="5" height="8" rx="0.5"/>
    <rect x="30" y="24" width="5" height="8" rx="0.5"/>
    <rect x="37" y="24" width="5" height="8" rx="0.5"/>
    <rect x="44" y="24" width="5" height="8" rx="0.5"/>
    <rect x="51" y="24" width="5" height="8" rx="0.5"/>
    <rect x="58" y="24" width="5" height="8" rx="0.5"/>
    <rect x="65" y="24" width="5" height="8" rx="0.5"/>
    <rect x="72" y="24" width="5" height="8" rx="0.5"/>
    <rect x="79" y="24" width="5" height="8" rx="0.5"/>
    <rect x="86" y="24" width="5" height="8" rx="0.5"/>
    <rect x="93" y="24" width="5" height="8" rx="0.5"/>
    <rect x="100" y="24" width="5" height="8" rx="0.5"/>
    <rect x="107" y="24" width="5" height="8" rx="0.5"/>
    <rect x="114" y="24" width="5" height="8" rx="0.5"/>
    <rect x="121" y="24" width="5" height="8" rx="0.5"/>
  </g>
  <!-- "HD44780" label -->
  <text x="143" y="18" text-anchor="middle" font-family="monospace" font-size="3" fill="#90c090">HD44780</text>
  <text x="143" y="24" text-anchor="middle" font-family="monospace" font-size="3" fill="#90c090">16x2</text>

  <!-- 16-pin single-row header (pins 1-16, 8px spacing) -->
  <rect x="8" y="42" width="128" height="5" rx="1" fill="#333" stroke="#444" stroke-width="0.3"/>
  <g fill="#222" stroke="#555" stroke-width="0.2">
    <rect x="10" y="42.5" width="4" height="4" rx="0.5"/>
    <rect x="18" y="42.5" width="4" height="4" rx="0.5"/>
    <rect x="26" y="42.5" width="4" height="4" rx="0.5"/>
    <rect x="34" y="42.5" width="4" height="4" rx="0.5"/>
    <rect x="42" y="42.5" width="4" height="4" rx="0.5"/>
    <rect x="50" y="42.5" width="4" height="4" rx="0.5"/>
    <rect x="58" y="42.5" width="4" height="4" rx="0.5"/>
    <rect x="66" y="42.5" width="4" height="4" rx="0.5"/>
    <rect x="74" y="42.5" width="4" height="4" rx="0.5"/>
    <rect x="82" y="42.5" width="4" height="4" rx="0.5"/>
    <rect x="90" y="42.5" width="4" height="4" rx="0.5"/>
    <rect x="98" y="42.5" width="4" height="4" rx="0.5"/>
    <rect x="106" y="42.5" width="4" height="4" rx="0.5"/>
    <rect x="114" y="42.5" width="4" height="4" rx="0.5"/>
    <rect x="122" y="42.5" width="4" height="4" rx="0.5"/>
    <rect x="130" y="42.5" width="4" height="4" rx="0.5"/>
  </g>

  <!-- Pin stubs and terminal dots -->
  <g stroke="#aaa" stroke-width="1" stroke-linecap="round">
    <line x1="12" y1="47" x2="12" y2="65"/>
    <line x1="20" y1="47" x2="20" y2="65"/>
    <line x1="28" y1="47" x2="28" y2="65"/>
    <line x1="36" y1="47" x2="36" y2="65"/>
    <line x1="44" y1="47" x2="44" y2="65"/>
    <line x1="52" y1="47" x2="52" y2="65"/>
    <line x1="60" y1="47" x2="60" y2="65"/>
    <line x1="68" y1="47" x2="68" y2="65"/>
    <line x1="76" y1="47" x2="76" y2="65"/>
    <line x1="84" y1="47" x2="84" y2="65"/>
    <line x1="92" y1="47" x2="92" y2="65"/>
    <line x1="100" y1="47" x2="100" y2="65"/>
    <line x1="108" y1="47" x2="108" y2="65"/>
    <line x1="116" y1="47" x2="116" y2="65"/>
    <line x1="124" y1="47" x2="124" y2="65"/>
    <line x1="132" y1="47" x2="132" y2="65"/>
  </g>
  <g>
    <circle cx="12" cy="70" r="1.5" fill="#666"/>
    <circle cx="20" cy="70" r="1.5" fill="#cc3030"/>
    <circle cx="28" cy="70" r="1.5" fill="#c0c0c0"/>
    <circle cx="36" cy="70" r="1.5" fill="#c0c0c0"/>
    <circle cx="44" cy="70" r="1.5" fill="#c0c0c0"/>
    <circle cx="52" cy="70" r="1.5" fill="#c0c0c0"/>
    <circle cx="60" cy="70" r="1.5" fill="#c0c0c0"/>
    <circle cx="68" cy="70" r="1.5" fill="#c0c0c0"/>
    <circle cx="76" cy="70" r="1.5" fill="#c0c0c0"/>
    <circle cx="84" cy="70" r="1.5" fill="#c0c0c0"/>
    <circle cx="92" cy="70" r="1.5" fill="#c0c0c0"/>
    <circle cx="100" cy="70" r="1.5" fill="#c0c0c0"/>
    <circle cx="108" cy="70" r="1.5" fill="#c0c0c0"/>
    <circle cx="116" cy="70" r="1.5" fill="#c0c0c0"/>
    <circle cx="124" cy="70" r="1.5" fill="#ff8800"/>
    <circle cx="132" cy="70" r="1.5" fill="#666"/>
  </g>

  <!-- Pin labels -->
  <g font-family="monospace" font-size="2.5" fill="#90c090" text-anchor="middle">
    <text x="12" y="56">VSS</text>
    <text x="20" y="56">VDD</text>
    <text x="28" y="56">V0</text>
    <text x="36" y="56">RS</text>
    <text x="44" y="56">RW</text>
    <text x="52" y="56">E</text>
    <text x="60" y="56">D0</text>
    <text x="68" y="56">D1</text>
    <text x="76" y="56">D2</text>
    <text x="84" y="56">D3</text>
    <text x="92" y="56">D4</text>
    <text x="100" y="56">D5</text>
    <text x="108" y="56">D6</text>
    <text x="116" y="56">D7</text>
    <text x="124" y="56">A</text>
    <text x="132" y="56">K</text>
  </g>
</svg>
