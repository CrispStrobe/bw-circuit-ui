<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 36" width="50" height="36">
  <!-- INA219 Current/Power Monitor Module — bench-style -->
  <!-- PCB -->
  <rect x="2" y="4" width="46" height="24" rx="2" fill="#6b1a1a" stroke="#4d0d0d" stroke-width="0.8"/>
  <!-- INA219 SOIC chip -->
  <rect x="14" y="8" width="14" height="8" rx="1" fill="#303030" stroke="#222" stroke-width="0.5"/>
  <text x="21" y="13.5" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#aaa">INA219</text>
  <!-- Shunt resistor (large, power rated) -->
  <rect x="32" y="9" width="10" height="5" rx="0.5" fill="#1a3a1a" stroke="#0a2a0a" stroke-width="0.5"/>
  <text x="37" y="13" text-anchor="middle" font-family="monospace" font-size="1.8" fill="#888">R100</text>
  <!-- Screw terminals for VIN+/VIN- -->
  <rect x="4" y="18" width="16" height="6" rx="1" fill="#3a3a6a" stroke="#2a2a4a" stroke-width="0.5"/>
  <text x="12" y="22.5" text-anchor="middle" font-family="monospace" font-size="2" fill="#aaa">V+  V-</text>
  <!-- Labels -->
  <text x="37" y="22" text-anchor="middle" font-family="monospace" font-size="2" fill="#888">I2C</text>
  <!-- Bottom pins: VCC, GND, SDA, SCL -->
  <line x1="8" y1="28" x2="8" y2="36" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="8" cy="36" r="1.2" fill="#c0c0c0"/>
  <line x1="16" y1="28" x2="16" y2="36" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="16" cy="36" r="1.2" fill="#c0c0c0"/>
  <line x1="24" y1="28" x2="24" y2="36" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="24" cy="36" r="1.2" fill="#c0c0c0"/>
  <line x1="32" y1="28" x2="32" y2="36" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="32" cy="36" r="1.2" fill="#c0c0c0"/>
  <!-- Top pins: VIN+, VIN- -->
  <line x1="8" y1="4" x2="8" y2="0" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="8" cy="0" r="1.2" fill="#c0c0c0"/>
  <line x1="16" y1="4" x2="16" y2="0" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="16" cy="0" r="1.2" fill="#c0c0c0"/>
</svg>
