<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 70" width="30" height="70">
  <!-- Antenna — long-wire aerial between two insulators, lead-in down -->
  <!-- Span wire -->
  <line x1="2" y1="8" x2="28" y2="8" stroke="#b87333" stroke-width="1.2"/>
  <!-- Egg insulators -->
  <ellipse cx="4" cy="8" rx="2.5" ry="1.8" fill="#eee" stroke="#999" stroke-width="0.5"/>
  <ellipse cx="26" cy="8" rx="2.5" ry="1.8" fill="#eee" stroke="#999" stroke-width="0.5"/>
  <!-- Lead-in -->
  <line x1="15" y1="8" x2="15" y2="70" stroke="#b87333" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Antenna symbol on the lead-in -->
  <path d="M15 32 L8 20 M15 32 L22 20 M15 32 L15 20" fill="none" stroke="#ddd" stroke-width="1"/>
  <text x="15" y="44" text-anchor="middle" font-family="monospace" font-size="4" fill="#888">ANT</text>
  <circle cx="15" cy="70" r="2" fill="#c0c0c0"/>
</svg>
