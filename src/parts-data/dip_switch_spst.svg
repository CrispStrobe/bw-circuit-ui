<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 28" width="40" height="28">
  <!-- DIP Switch SPST x4 — 4-position, bench-style -->
  <!-- Body (red plastic, standard DIP switch look) -->
  <rect x="4" y="4" width="32" height="16" rx="1" fill="#cc2020" stroke="#a01818" stroke-width="0.8"/>
  <!-- 4 toggle channels -->
  <rect x="7" y="6" width="5" height="12" rx="0.5" fill="#881010"/>
  <rect x="14" y="6" width="5" height="12" rx="0.5" fill="#881010"/>
  <rect x="21" y="6" width="5" height="12" rx="0.5" fill="#881010"/>
  <rect x="28" y="6" width="5" height="12" rx="0.5" fill="#881010"/>
  <!-- Toggle levers (some ON, some OFF) -->
  <rect x="8" y="7" width="3" height="4" rx="0.5" fill="#e8e0d8"/>
  <rect x="15" y="13" width="3" height="4" rx="0.5" fill="#e8e0d8"/>
  <rect x="22" y="7" width="3" height="4" rx="0.5" fill="#e8e0d8"/>
  <rect x="29" y="13" width="3" height="4" rx="0.5" fill="#e8e0d8"/>
  <!-- ON/OFF labels -->
  <text x="20" y="3" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#999">ON</text>
  <!-- 8 pins (4 per side) -->
  <line x1="9.5" y1="20" x2="9.5" y2="28" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="16.5" y1="20" x2="16.5" y2="28" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="23.5" y1="20" x2="23.5" y2="28" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="30.5" y1="20" x2="30.5" y2="28" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="9.5" y1="4" x2="9.5" y2="0" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="16.5" y1="4" x2="16.5" y2="0" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="23.5" y1="4" x2="23.5" y2="0" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="30.5" y1="4" x2="30.5" y2="0" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="9.5" cy="28" r="1" fill="#c0c0c0"/>
  <circle cx="16.5" cy="28" r="1" fill="#c0c0c0"/>
  <circle cx="23.5" cy="28" r="1" fill="#c0c0c0"/>
  <circle cx="30.5" cy="28" r="1" fill="#c0c0c0"/>
  <circle cx="9.5" cy="0" r="1" fill="#c0c0c0"/>
  <circle cx="16.5" cy="0" r="1" fill="#c0c0c0"/>
  <circle cx="23.5" cy="0" r="1" fill="#c0c0c0"/>
  <circle cx="30.5" cy="0" r="1" fill="#c0c0c0"/>
</svg>
