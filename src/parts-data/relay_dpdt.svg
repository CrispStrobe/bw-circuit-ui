<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 50" width="80" height="50">
  <!-- Relay DPDT — double-pole, bench-style -->
  <!-- Body (blue, slightly wider than SPDT) -->
  <rect x="5" y="3" width="70" height="38" rx="2" fill="#1a4a7a" stroke="#0e3460" stroke-width="1"/>
  <rect x="8" y="5" width="64" height="3" rx="1" fill="#2060a0" opacity="0.4"/>
  <!-- Label -->
  <text x="40" y="22" text-anchor="middle" font-family="monospace" font-size="5" fill="#d0d8e0">RELAY</text>
  <text x="40" y="30" text-anchor="middle" font-family="monospace" font-size="4" fill="#8ab0d0">DPDT</text>
  <!-- 8 pins at bottom: coil(2) + pole1(3) + pole2(3) -->
  <line x1="10" y1="41" x2="10" y2="50" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="20" y1="41" x2="20" y2="50" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="30" y1="41" x2="30" y2="50" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="40" y1="41" x2="40" y2="50" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="50" y1="41" x2="50" y2="50" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="60" y1="41" x2="60" y2="50" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="70" y1="41" x2="70" y2="50" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="75" y1="41" x2="75" y2="50" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="10" cy="50" r="1.5" fill="#c0c0c0"/>
  <circle cx="20" cy="50" r="1.5" fill="#c0c0c0"/>
  <circle cx="30" cy="50" r="1.5" fill="#c0c0c0"/>
  <circle cx="40" cy="50" r="1.5" fill="#c0c0c0"/>
  <circle cx="50" cy="50" r="1.5" fill="#c0c0c0"/>
  <circle cx="60" cy="50" r="1.5" fill="#c0c0c0"/>
  <circle cx="70" cy="50" r="1.5" fill="#c0c0c0"/>
  <circle cx="75" cy="50" r="1.5" fill="#c0c0c0"/>
  <!-- Labels -->
  <text x="10" y="39" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#8ab0d0">C+</text>
  <text x="20" y="39" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#8ab0d0">C-</text>
  <text x="30" y="39" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#8ab0d0">NO1</text>
  <text x="40" y="39" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#8ab0d0">CM1</text>
  <text x="50" y="39" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#8ab0d0">NC1</text>
  <text x="60" y="39" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#8ab0d0">NO2</text>
  <text x="70" y="39" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#8ab0d0">CM2</text>
  <text x="75" y="39" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#8ab0d0">NC2</text>
</svg>
