<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 72" width="56" height="72">
  <!-- 4x4 Matrix Keypad — membrane style, bench-style -->
  <!-- Body -->
  <rect x="2" y="2" width="52" height="58" rx="3" fill="#e8e0d8" stroke="#ccc" stroke-width="0.8"/>
  <!-- 16 keys (4x4 grid) -->
  <g fill="#ddd" stroke="#bbb" stroke-width="0.5">
    <rect x="6" y="6" width="10" height="10" rx="1.5"/>
    <rect x="18" y="6" width="10" height="10" rx="1.5"/>
    <rect x="30" y="6" width="10" height="10" rx="1.5"/>
    <rect x="42" y="6" width="10" height="10" rx="1.5"/>
    <rect x="6" y="18" width="10" height="10" rx="1.5"/>
    <rect x="18" y="18" width="10" height="10" rx="1.5"/>
    <rect x="30" y="18" width="10" height="10" rx="1.5"/>
    <rect x="42" y="18" width="10" height="10" rx="1.5"/>
    <rect x="6" y="30" width="10" height="10" rx="1.5"/>
    <rect x="18" y="30" width="10" height="10" rx="1.5"/>
    <rect x="30" y="30" width="10" height="10" rx="1.5"/>
    <rect x="42" y="30" width="10" height="10" rx="1.5"/>
    <rect x="6" y="42" width="10" height="10" rx="1.5"/>
    <rect x="18" y="42" width="10" height="10" rx="1.5"/>
    <rect x="30" y="42" width="10" height="10" rx="1.5"/>
    <rect x="42" y="42" width="10" height="10" rx="1.5"/>
  </g>
  <!-- Key labels -->
  <g font-family="monospace" font-size="5" fill="#555" text-anchor="middle">
    <text x="11" y="14">1</text><text x="23" y="14">2</text><text x="35" y="14">3</text><text x="47" y="14">A</text>
    <text x="11" y="26">4</text><text x="23" y="26">5</text><text x="35" y="26">6</text><text x="47" y="26">B</text>
    <text x="11" y="38">7</text><text x="23" y="38">8</text><text x="35" y="38">9</text><text x="47" y="38">C</text>
    <text x="11" y="50">*</text><text x="23" y="50">0</text><text x="35" y="50">#</text><text x="47" y="50">D</text>
  </g>
  <!-- 8-pin ribbon cable connector at bottom -->
  <rect x="8" y="56" width="40" height="6" rx="1" fill="#666" stroke="#444" stroke-width="0.3"/>
  <!-- 8 pins -->
  <line x1="11" y1="62" x2="11" y2="72" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="16.5" y1="62" x2="16.5" y2="72" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="22" y1="62" x2="22" y2="72" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="27.5" y1="62" x2="27.5" y2="72" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="33" y1="62" x2="33" y2="72" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="38.5" y1="62" x2="38.5" y2="72" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="44" y1="62" x2="44" y2="72" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="11" cy="72" r="1.2" fill="#c0c0c0"/>
  <circle cx="16.5" cy="72" r="1.2" fill="#c0c0c0"/>
  <circle cx="22" cy="72" r="1.2" fill="#c0c0c0"/>
  <circle cx="27.5" cy="72" r="1.2" fill="#c0c0c0"/>
  <circle cx="33" cy="72" r="1.2" fill="#c0c0c0"/>
  <circle cx="38.5" cy="72" r="1.2" fill="#c0c0c0"/>
  <circle cx="44" cy="72" r="1.2" fill="#c0c0c0"/>
</svg>
