<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 80" width="60" height="80">
  <!-- Voltmeter — dedicated bench instrument, front view -->
  <!-- Body -->
  <rect x="4" y="4" width="52" height="68" rx="5" fill="#2a2a3a" stroke="#1a1a2a" stroke-width="1"/>
  <!-- Display window -->
  <rect x="8" y="8" width="44" height="22" rx="2" fill="#c8d8c0" stroke="#999" stroke-width="0.5"/>
  <!-- Static reading -->
  <text x="30" y="23" text-anchor="middle" font-family="monospace" font-size="10" fill="#222">5.00</text>
  <text x="48" y="14" font-family="monospace" font-size="4" fill="#444">V</text>
  <!-- V label (voltmeter identity) -->
  <circle cx="30" cy="44" r="10" fill="none" stroke="#4488cc" stroke-width="1.2"/>
  <text x="30" y="48" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#4488cc">V</text>
  <!-- Binding posts -->
  <circle cx="18" cy="66" r="4" fill="#222" stroke="#444" stroke-width="0.5"/>
  <circle cx="18" cy="66" r="2" fill="#cc3030"/>
  <text x="18" y="60" text-anchor="middle" font-family="monospace" font-size="3" fill="#cc3030">+</text>
  <circle cx="42" cy="66" r="4" fill="#222" stroke="#444" stroke-width="0.5"/>
  <circle cx="42" cy="66" r="2" fill="#333"/>
  <text x="42" y="60" text-anchor="middle" font-family="monospace" font-size="3" fill="#888">-</text>
  <!-- Terminal leads -->
  <line x1="18" y1="72" x2="18" y2="80" stroke="#cc3030" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="18" cy="80" r="1.5" fill="#cc3030"/>
  <line x1="42" y1="72" x2="42" y2="80" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="42" cy="80" r="1.5" fill="#333"/>
</svg>
