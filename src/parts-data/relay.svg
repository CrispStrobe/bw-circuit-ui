<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 50" width="70" height="50">
  <!-- SPDT Relay — bench-style, blue rectangular package -->
  <!-- Body -->
  <rect x="5" y="3" width="60" height="44" rx="2" fill="#1a4a7a" stroke="#0e3460" stroke-width="1"/>
  <!-- Top cover ridge -->
  <rect x="8" y="5" width="54" height="3" rx="1" fill="#2060a0" opacity="0.4"/>
  <!-- Label -->
  <text x="35" y="24" text-anchor="middle" font-family="monospace" font-size="6" fill="#d0d8e0">RELAY</text>
  <text x="35" y="32" text-anchor="middle" font-family="monospace" font-size="4" fill="#8ab0d0">SPDT</text>

  <!-- Coil pins (bottom left) -->
  <line x1="15" y1="47" x2="15" y2="50" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="15" cy="50" r="1.5" fill="#c0c0c0"/>
  <line x1="28" y1="47" x2="28" y2="50" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="28" cy="50" r="1.5" fill="#c0c0c0"/>

  <!-- Switch pins (bottom right): COM, NC, NO -->
  <line x1="42" y1="47" x2="42" y2="50" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="42" cy="50" r="1.5" fill="#c0c0c0"/>
  <line x1="52" y1="47" x2="52" y2="50" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="52" cy="50" r="1.5" fill="#c0c0c0"/>
  <line x1="62" y1="47" x2="62" y2="50" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="62" cy="50" r="1.5" fill="#c0c0c0"/>

  <!-- Pin labels -->
  <text x="15" y="43" text-anchor="middle" font-family="monospace" font-size="3" fill="#8ab0d0">C+</text>
  <text x="28" y="43" text-anchor="middle" font-family="monospace" font-size="3" fill="#8ab0d0">C-</text>
  <text x="42" y="43" text-anchor="middle" font-family="monospace" font-size="3" fill="#8ab0d0">NO</text>
  <text x="52" y="43" text-anchor="middle" font-family="monospace" font-size="3" fill="#8ab0d0">CM</text>
  <text x="62" y="43" text-anchor="middle" font-family="monospace" font-size="3" fill="#8ab0d0">NC</text>
</svg>
