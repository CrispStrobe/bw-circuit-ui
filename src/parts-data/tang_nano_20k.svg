<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 210" width="60" height="210">
  <!-- Sipeed Tang Nano 20K — bench-style top view, breadboard orientation -->
  <!-- Gowin GW2AR-LV18QN88C8/I7, 2x20P 2.54 mm headers (34 free IOs) -->
  <!-- Geometry from the Sipeed datasheet v1.3 mechanical drawing: -->
  <!-- 54.04 x 22.55 mm, header rows 20.32 mm apart (8 x 2.54). -->

  <!-- PCB (black, characteristic Tang Nano shape) -->
  <rect x="6" y="4" width="48" height="202" rx="2" fill="#151515" stroke="#333" stroke-width="0.8"/>

  <!-- USB-C connector (top) -->
  <rect x="19" y="0" width="22" height="8" rx="2.5" fill="#c8c8c8" stroke="#888" stroke-width="0.4"/>

  <!-- Buttons S1 / S2 flanking the USB end -->
  <rect x="9.5" y="11" width="7" height="7" rx="1" fill="#2b2b2b" stroke="#444" stroke-width="0.4"/>
  <rect x="43.5" y="11" width="7" height="7" rx="1" fill="#2b2b2b" stroke="#444" stroke-width="0.4"/>

  <!-- GW2AR-18 FPGA (QN88, centre) -->
  <rect x="17" y="40" width="26" height="26" rx="1" fill="#1d1d1d" stroke="#3a3a3a" stroke-width="0.5"/>
  <circle cx="20" cy="43" r="1.2" fill="#555"/>
  <text x="30" y="52" font-family="monospace" font-size="3.4" fill="#9a9a9a" text-anchor="middle">GW2AR</text>
  <text x="30" y="57" font-family="monospace" font-size="3.4" fill="#9a9a9a" text-anchor="middle">-LV18</text>
  <text x="30" y="62" font-family="monospace" font-size="2.9" fill="#777" text-anchor="middle">QN88</text>

  <!-- Onboard LEDs 0..5 (left edge, near pins 15-20) -->
  <g fill="#7ac943">
    <rect x="12" y="74" width="2.4" height="1.6"/><rect x="12" y="78" width="2.4" height="1.6"/>
    <rect x="12" y="82" width="2.4" height="1.6"/><rect x="12" y="86" width="2.4" height="1.6"/>
    <rect x="12" y="90" width="2.4" height="1.6"/><rect x="12" y="94" width="2.4" height="1.6"/>
  </g>
  <!-- WS2812 RGB LED (pin 79) -->
  <rect x="44" y="76" width="4" height="4" rx="0.5" fill="#e8e8e8" stroke="#aaa" stroke-width="0.3"/>

  <!-- microSD socket -->
  <rect x="14" y="104" width="32" height="14" rx="1" fill="#2a2a2a" stroke="#444" stroke-width="0.4"/>
  <text x="30" y="113" font-family="sans-serif" font-size="3" fill="#888" text-anchor="middle">microSD</text>

  <!-- 27 MHz oscillator -->
  <rect x="38" y="126" width="7" height="5" rx="0.6" fill="#3a3a3a" stroke="#4d4d4d" stroke-width="0.3"/>

  <!-- HDMI connector (bottom) -->
  <rect x="16" y="192" width="28" height="14" rx="1.5" fill="#b8b8b8" stroke="#8a8a8a" stroke-width="0.5"/>
  <rect x="19" y="195" width="22" height="7" rx="1" fill="#6e6e6e"/>
  <text x="30" y="189" font-family="sans-serif" font-size="3" fill="#8a8a8a" text-anchor="middle">HDMI</text>

  <!-- Silkscreen -->
  <text x="30" y="34" font-family="sans-serif" font-size="4" fill="#d0d0d0" text-anchor="middle" font-weight="bold">TANG NANO 20K</text>

  <!-- Header pads: left column (p73 .. gnd_1), right column (5v .. p52) -->
  <g fill="#caa53a" stroke="#8a7020" stroke-width="0.3">
    <circle cx="4" cy="14" r="1.7"/><circle cx="4" cy="22" r="1.7"/><circle cx="4" cy="30" r="1.7"/>
    <circle cx="4" cy="38" r="1.7"/><circle cx="4" cy="46" r="1.7"/><circle cx="4" cy="54" r="1.7"/>
    <circle cx="4" cy="62" r="1.7"/><circle cx="4" cy="70" r="1.7"/><circle cx="4" cy="78" r="1.7"/>
    <circle cx="4" cy="86" r="1.7"/><circle cx="4" cy="94" r="1.7"/><circle cx="4" cy="102" r="1.7"/>
    <circle cx="4" cy="110" r="1.7"/><circle cx="4" cy="118" r="1.7"/><circle cx="4" cy="126" r="1.7"/>
    <circle cx="4" cy="134" r="1.7"/><circle cx="4" cy="142" r="1.7"/><circle cx="4" cy="150" r="1.7"/>
    <circle cx="4" cy="158" r="1.7"/><circle cx="4" cy="166" r="1.7"/>
    <circle cx="56" cy="14" r="1.7"/><circle cx="56" cy="22" r="1.7"/><circle cx="56" cy="30" r="1.7"/>
    <circle cx="56" cy="38" r="1.7"/><circle cx="56" cy="46" r="1.7"/><circle cx="56" cy="54" r="1.7"/>
    <circle cx="56" cy="62" r="1.7"/><circle cx="56" cy="70" r="1.7"/><circle cx="56" cy="78" r="1.7"/>
    <circle cx="56" cy="86" r="1.7"/><circle cx="56" cy="94" r="1.7"/><circle cx="56" cy="102" r="1.7"/>
    <circle cx="56" cy="110" r="1.7"/><circle cx="56" cy="118" r="1.7"/><circle cx="56" cy="126" r="1.7"/>
    <circle cx="56" cy="134" r="1.7"/><circle cx="56" cy="142" r="1.7"/><circle cx="56" cy="150" r="1.7"/>
    <circle cx="56" cy="158" r="1.7"/><circle cx="56" cy="166" r="1.7"/>
  </g>
  <!-- 5 V pin (right column, position 1) marked: it is a power OUTPUT, and the -->
  <!-- one pin whose misuse destroys the FPGA. See the tang-nano-voltage DRC rule. -->
  <circle cx="56" cy="14" r="2.4" fill="none" stroke="#d64545" stroke-width="0.6"/>
  <!-- 3V3 rails -->
  <circle cx="4" cy="158" r="2.2" fill="none" stroke="#d64545" stroke-width="0.4"/>
  <circle cx="56" cy="134" r="2.2" fill="none" stroke="#d64545" stroke-width="0.4"/>
</svg>
