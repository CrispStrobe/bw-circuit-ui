<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <!-- NeoPixel Single — WS2812B SMD, bench-style -->
  <rect x="2" y="2" width="16" height="16" rx="1" fill="#222" stroke="#444" stroke-width="0.5"/>
  <!-- RGB LED dome -->
  <circle cx="10" cy="10" r="5" fill="#ff6600" opacity="0.7"/>
  <circle cx="8" cy="8" r="2" fill="#fff" opacity="0.3"/>
  <!-- Corner pads -->
  <rect x="0" y="2" width="3" height="4" rx="0.3" fill="#c0a040"/>
  <rect x="0" y="14" width="3" height="4" rx="0.3" fill="#c0a040"/>
  <rect x="17" y="2" width="3" height="4" rx="0.3" fill="#c0a040"/>
  <rect x="17" y="14" width="3" height="4" rx="0.3" fill="#c0a040"/>
  <circle cx="0" cy="4" r="1" fill="#c0c0c0"/>
  <circle cx="0" cy="16" r="1" fill="#c0c0c0"/>
  <circle cx="20" cy="4" r="1" fill="#c0c0c0"/>
  <circle cx="20" cy="16" r="1" fill="#c0c0c0"/>
</svg>
