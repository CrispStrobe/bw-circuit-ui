<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 36" width="32" height="36">
  <!-- Ambient Light Sensor — small breakout, bench-style -->
  <!-- PCB -->
  <rect x="2" y="2" width="28" height="24" rx="2" fill="#0a5a0a" stroke="#084a08" stroke-width="0.8"/>
  <!-- Sensor IC (tiny clear window) -->
  <rect x="10" y="8" width="12" height="8" rx="1" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
  <rect x="12" y="10" width="8" height="4" rx="0.5" fill="#444" opacity="0.5"/>
  <!-- Label -->
  <text x="16" y="22" text-anchor="middle" font-family="monospace" font-size="3" fill="#90c090">LIGHT</text>
  <!-- Pins -->
  <line x1="8" y1="26" x2="8" y2="36" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16" y1="26" x2="16" y2="36" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="24" y1="26" x2="24" y2="36" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="8" cy="36" r="1.5" fill="#c0c0c0"/>
  <circle cx="16" cy="36" r="1.5" fill="#c0c0c0"/>
  <circle cx="24" cy="36" r="1.5" fill="#c0c0c0"/>
</svg>
