<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 45" width="40" height="45">
  <!-- Sound Sensor Module — bench-style -->
  <!-- PCB -->
  <rect x="2" y="2" width="36" height="31" rx="2" fill="#1a1a6b" stroke="#0d0d4d" stroke-width="0.8"/>
  <!-- Electret microphone (cylindrical, silver can) -->
  <circle cx="14" cy="13" r="5" fill="#b0b0b0" stroke="#888" stroke-width="0.5"/>
  <circle cx="14" cy="13" r="3.5" fill="#999" stroke="#777" stroke-width="0.3"/>
  <!-- Sound hole pattern -->
  <circle cx="14" cy="13" r="0.6" fill="#666"/>
  <circle cx="12.5" cy="11.8" r="0.4" fill="#666"/>
  <circle cx="15.5" cy="11.8" r="0.4" fill="#666"/>
  <circle cx="12.5" cy="14.2" r="0.4" fill="#666"/>
  <circle cx="15.5" cy="14.2" r="0.4" fill="#666"/>
  <!-- Op-amp IC -->
  <rect x="24" y="8" width="8" height="5" rx="0.5" fill="#303030" stroke="#222" stroke-width="0.3"/>
  <!-- Trimpot (sensitivity) -->
  <circle cx="28" cy="20" r="3" fill="#4682b4" stroke="#36648b" stroke-width="0.4"/>
  <line x1="28" y1="18" x2="28" y2="22" stroke="#fff" stroke-width="0.5"/>
  <!-- Status LED -->
  <circle cx="8" cy="27" r="1.5" fill="#600000" stroke="#400000" stroke-width="0.3"/>
  <!-- Label -->
  <text x="20" y="31" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#aaa">SOUND</text>
  <!-- 4 header pins: VCC, GND, AO, DO -->
  <line x1="8" y1="33" x2="8" y2="45" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="8" cy="45" r="1.5" fill="#c0c0c0"/>
  <line x1="16" y1="33" x2="16" y2="45" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="16" cy="45" r="1.5" fill="#c0c0c0"/>
  <line x1="24" y1="33" x2="24" y2="45" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="24" cy="45" r="1.5" fill="#c0c0c0"/>
  <line x1="32" y1="33" x2="32" y2="45" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="32" cy="45" r="1.5" fill="#c0c0c0"/>
</svg>
