<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 24" width="96" height="24">
  <!-- NeoPixel Strip (8 LEDs) — flexible PCB strip, bench-style -->
  <!-- Strip body -->
  <rect x="0" y="4" width="96" height="16" rx="2" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
  <!-- 8 LED packages with RGB glow -->
  <g>
    <rect x="4" y="7" width="8" height="10" rx="1" fill="#222" stroke="#444" stroke-width="0.3"/>
    <circle cx="8" cy="12" r="3" fill="#ff2020" opacity="0.6"/>
    <rect x="16" y="7" width="8" height="10" rx="1" fill="#222" stroke="#444" stroke-width="0.3"/>
    <circle cx="20" cy="12" r="3" fill="#ff8800" opacity="0.6"/>
    <rect x="28" y="7" width="8" height="10" rx="1" fill="#222" stroke="#444" stroke-width="0.3"/>
    <circle cx="32" cy="12" r="3" fill="#ffff00" opacity="0.6"/>
    <rect x="40" y="7" width="8" height="10" rx="1" fill="#222" stroke="#444" stroke-width="0.3"/>
    <circle cx="44" cy="12" r="3" fill="#00ff00" opacity="0.6"/>
    <rect x="52" y="7" width="8" height="10" rx="1" fill="#222" stroke="#444" stroke-width="0.3"/>
    <circle cx="56" cy="12" r="3" fill="#00ccff" opacity="0.6"/>
    <rect x="64" y="7" width="8" height="10" rx="1" fill="#222" stroke="#444" stroke-width="0.3"/>
    <circle cx="68" cy="12" r="3" fill="#0044ff" opacity="0.6"/>
    <rect x="76" y="7" width="8" height="10" rx="1" fill="#222" stroke="#444" stroke-width="0.3"/>
    <circle cx="80" cy="12" r="3" fill="#8800ff" opacity="0.6"/>
    <rect x="88" y="7" width="6" height="10" rx="1" fill="#222" stroke="#444" stroke-width="0.3"/>
    <circle cx="91" cy="12" r="3" fill="#ff00ff" opacity="0.6"/>
  </g>
  <!-- Input pads (left) -->
  <circle cx="0" cy="8" r="1.5" fill="#cc3030"/>
  <circle cx="0" cy="12" r="1.5" fill="#30cc30"/>
  <circle cx="0" cy="16" r="1.5" fill="#333"/>
  <!-- Output pad (right) -->
  <circle cx="96" cy="12" r="1.5" fill="#30cc30"/>
</svg>
