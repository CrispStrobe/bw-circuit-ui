<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 56" width="140" height="56">
  <!-- Character LCD 16x2 (HD44780) — bench-style front view -->
  <!-- PCB board -->
  <rect x="0" y="0" width="140" height="56" rx="3" fill="#1a6a2a" stroke="#0e4a1a" stroke-width="1"/>
  <!-- LCD glass window -->
  <rect x="10" y="6" width="120" height="30" rx="2" fill="#3a5a2a" stroke="#2a4a1a" stroke-width="0.5"/>
  <!-- Character grid (16x2, simplified) -->
  <g fill="#4a7a3a" opacity="0.8">
    <!-- Row 1 -->
    <rect x="14" y="10" width="5" height="8" rx="0.5"/>
    <rect x="21" y="10" width="5" height="8" rx="0.5"/>
    <rect x="28" y="10" width="5" height="8" rx="0.5"/>
    <rect x="35" y="10" width="5" height="8" rx="0.5"/>
    <rect x="42" y="10" width="5" height="8" rx="0.5"/>
    <rect x="49" y="10" width="5" height="8" rx="0.5"/>
    <rect x="56" y="10" width="5" height="8" rx="0.5"/>
    <rect x="63" y="10" width="5" height="8" rx="0.5"/>
    <rect x="70" y="10" width="5" height="8" rx="0.5"/>
    <rect x="77" y="10" width="5" height="8" rx="0.5"/>
    <rect x="84" y="10" width="5" height="8" rx="0.5"/>
    <rect x="91" y="10" width="5" height="8" rx="0.5"/>
    <rect x="98" y="10" width="5" height="8" rx="0.5"/>
    <rect x="105" y="10" width="5" height="8" rx="0.5"/>
    <rect x="112" y="10" width="5" height="8" rx="0.5"/>
    <rect x="119" y="10" width="5" height="8" rx="0.5"/>
    <!-- Row 2 -->
    <rect x="14" y="22" width="5" height="8" rx="0.5"/>
    <rect x="21" y="22" width="5" height="8" rx="0.5"/>
    <rect x="28" y="22" width="5" height="8" rx="0.5"/>
    <rect x="35" y="22" width="5" height="8" rx="0.5"/>
    <rect x="42" y="22" width="5" height="8" rx="0.5"/>
    <rect x="49" y="22" width="5" height="8" rx="0.5"/>
    <rect x="56" y="22" width="5" height="8" rx="0.5"/>
    <rect x="63" y="22" width="5" height="8" rx="0.5"/>
    <rect x="70" y="22" width="5" height="8" rx="0.5"/>
    <rect x="77" y="22" width="5" height="8" rx="0.5"/>
    <rect x="84" y="22" width="5" height="8" rx="0.5"/>
    <rect x="91" y="22" width="5" height="8" rx="0.5"/>
    <rect x="98" y="22" width="5" height="8" rx="0.5"/>
    <rect x="105" y="22" width="5" height="8" rx="0.5"/>
    <rect x="112" y="22" width="5" height="8" rx="0.5"/>
    <rect x="119" y="22" width="5" height="8" rx="0.5"/>
  </g>
  <!-- Pin header at bottom (16 pins, only key ones labeled) -->
  <line x1="20" y1="46" x2="20" y2="53" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="40" y1="46" x2="40" y2="53" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="60" y1="46" x2="60" y2="53" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="80" y1="46" x2="80" y2="53" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="100" y1="46" x2="100" y2="53" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <line x1="120" y1="46" x2="120" y2="53" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <!-- Terminal pads -->
  <circle cx="20" cy="53" r="1.5" fill="#c0c0c0"/>
  <circle cx="40" cy="53" r="1.5" fill="#c0c0c0"/>
  <circle cx="60" cy="53" r="1.5" fill="#c0c0c0"/>
  <circle cx="80" cy="53" r="1.5" fill="#c0c0c0"/>
  <circle cx="100" cy="53" r="1.5" fill="#c0c0c0"/>
  <circle cx="120" cy="53" r="1.5" fill="#c0c0c0"/>
  <!-- Labels -->
  <text x="20" y="44" text-anchor="middle" font-family="monospace" font-size="3" fill="#90c090">RS</text>
  <text x="40" y="44" text-anchor="middle" font-family="monospace" font-size="3" fill="#90c090">E</text>
  <text x="60" y="44" text-anchor="middle" font-family="monospace" font-size="3" fill="#90c090">D4</text>
  <text x="80" y="44" text-anchor="middle" font-family="monospace" font-size="3" fill="#90c090">D5</text>
  <text x="100" y="44" text-anchor="middle" font-family="monospace" font-size="3" fill="#90c090">D6</text>
  <text x="120" y="44" text-anchor="middle" font-family="monospace" font-size="3" fill="#90c090">D7</text>
</svg>
