<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 48" width="32" height="48">
  <!-- DHT22 (AM2302) temperature/humidity sensor module -->
  <rect x="2" y="2" width="28" height="42" rx="3" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <!-- Vent grille -->
  <g stroke="#bbb" stroke-width="0.5">
    <line x1="8" y1="8" x2="24" y2="8"/><line x1="8" y1="11" x2="24" y2="11"/>
    <line x1="8" y1="14" x2="24" y2="14"/><line x1="8" y1="17" x2="24" y2="17"/>
    <line x1="8" y1="20" x2="24" y2="20"/>
  </g>
  <text x="16" y="30" text-anchor="middle" font-family="monospace" font-size="4" fill="#555">DHT22</text>
  <text x="16" y="37" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#888">AM2302</text>
  <!-- Bottom pins -->
  <g stroke="#aaa" stroke-width="1.2" stroke-linecap="round">
    <line x1="8" y1="44" x2="8" y2="48"/><line x1="16" y1="44" x2="16" y2="48"/>
    <line x1="24" y1="44" x2="24" y2="48"/>
  </g>
  <g fill="#c0c0c0">
    <circle cx="8" cy="48" r="1.2"/><circle cx="16" cy="48" r="1.2"/>
    <circle cx="24" cy="48" r="1.2"/>
  </g>
</svg>
