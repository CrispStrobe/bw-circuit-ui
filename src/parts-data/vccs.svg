<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 56" width="64" height="56">
  <!-- Voltage-controlled current source (SPICE G card) — schematic style.
       Same controlling port as the E card; the body carries a current arrow
       instead of polarity marks, because what it fixes is the branch current. -->
  <line x1="0" y1="18" x2="16" y2="18" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="0" y1="38" x2="16" y2="38" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="16" cy="18" r="2" fill="none" stroke="#aaa" stroke-width="1"/>
  <circle cx="16" cy="38" r="2" fill="none" stroke="#aaa" stroke-width="1"/>
  <text x="10" y="30" font-family="monospace" font-size="6" fill="#888">v</text>
  <path d="M16 21 L16 28 L34 28" fill="none" stroke="#7f8c8d" stroke-width="1"
    stroke-dasharray="2,2"/>
  <line x1="64" y1="18" x2="44" y2="18" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="64" y1="38" x2="44" y2="38" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="18" x2="44" y2="19" stroke="#aaa" stroke-width="1.5"/>
  <line x1="44" y1="37" x2="44" y2="38" stroke="#aaa" stroke-width="1.5"/>
  <polygon points="44,19 52,28 44,37 36,28" fill="#2a3a2a" stroke="#b0b0b0" stroke-width="1"/>
  <!-- A CURRENT source: an arrow through the body. It points from outn to
       outp, which is the direction bw-board's stamp drives positive gm. -->
  <line x1="44" y1="34" x2="44" y2="23" stroke="#d0d0d0" stroke-width="1"/>
  <polygon points="44,21 41.6,25 46.4,25" fill="#d0d0d0"/>
  <text x="32" y="52" text-anchor="middle" font-family="monospace" font-size="5" fill="#888">G</text>
  <circle cx="64" cy="18" r="2" fill="#c0c0c0"/>
  <circle cx="64" cy="38" r="2" fill="#c0c0c0"/>
</svg>
