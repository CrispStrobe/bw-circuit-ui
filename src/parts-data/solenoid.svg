<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 40" width="70" height="40">
  <!-- Solenoid — bench-style front view -->
  <!-- Cylindrical solenoid with plunger -->
  <!-- Body (cylinder) -->
  <rect x="12" y="6" width="40" height="28" rx="3" fill="#555" stroke="#444" stroke-width="0.8"/>
  <!-- Coil winding hints -->
  <g stroke="#c08040" stroke-width="0.5" opacity="0.6">
    <line x1="16" y1="8" x2="16" y2="32"/>
    <line x1="20" y1="8" x2="20" y2="32"/>
    <line x1="24" y1="8" x2="24" y2="32"/>
    <line x1="28" y1="8" x2="28" y2="32"/>
    <line x1="32" y1="8" x2="32" y2="32"/>
    <line x1="36" y1="8" x2="36" y2="32"/>
    <line x1="40" y1="8" x2="40" y2="32"/>
    <line x1="44" y1="8" x2="44" y2="32"/>
    <line x1="48" y1="8" x2="48" y2="32"/>
  </g>
  <!-- Plunger (extending from right) -->
  <rect x="52" y="14" width="14" height="12" rx="1" fill="#888" stroke="#777" stroke-width="0.5"/>
  <!-- Spring hint -->
  <path d="M54 17 L56 20 L54 23 L56 26" fill="none" stroke="#aaa" stroke-width="0.5"/>
  <!-- Leads (bottom) -->
  <line x1="22" y1="34" x2="22" y2="40" stroke="#c0c0c0" stroke-width="1.2"/>
  <line x1="42" y1="34" x2="42" y2="40" stroke="#c0c0c0" stroke-width="1.2"/>
  <!-- Terminal pads -->
  <circle cx="22" cy="40" r="2" fill="#c0c0c0"/>
  <circle cx="42" cy="40" r="2" fill="#c0c0c0"/>
  <!-- Label -->
  <text x="32" y="22" text-anchor="middle" font-family="monospace" font-size="4" fill="#ccc">SOL</text>
</svg>
