<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 20" width="52" height="20">
  <!-- Zener Diode — axial package, bench-style -->
  <!-- Lead wires -->
  <line x1="2" y1="10" x2="12" y2="10" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40" y1="10" x2="50" y2="10" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Body (black with markings) -->
  <rect x="12" y="3" width="28" height="14" rx="3" fill="#1a1a1a" stroke="#444" stroke-width="0.8"/>
  <!-- Cathode double band (zener marking) -->
  <rect x="34" y="3" width="2" height="14" fill="#c0c0c0" opacity="0.8"/>
  <rect x="37" y="3" width="2" height="14" fill="#c0c0c0" opacity="0.8"/>
  <!-- Type marking -->
  <text x="24" y="12" text-anchor="middle" font-family="monospace" font-size="4" fill="#aaa">ZD</text>
  <!-- Terminal pads -->
  <circle cx="2" cy="10" r="2" fill="#c0c0c0"/>
  <circle cx="50" cy="10" r="2" fill="#c0c0c0"/>
</svg>
