<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 20" width="56" height="20">
  <!-- AA Battery 1.5V — cylindrical, horizontal bench-style -->
  <!-- Body cylinder -->
  <rect x="6" y="3" width="40" height="14" rx="3" fill="#2266aa" stroke="#1a5090" stroke-width="0.8"/>
  <!-- Positive nub (right) -->
  <rect x="46" y="6" width="6" height="8" rx="2" fill="#c0c0c0" stroke="#999" stroke-width="0.5"/>
  <!-- Negative flat (left) -->
  <rect x="2" y="5" width="6" height="10" rx="1" fill="#888" stroke="#666" stroke-width="0.5"/>
  <!-- Label -->
  <text x="26" y="12" text-anchor="middle" font-family="monospace" font-size="5" fill="#c0d8f0">1.5V</text>
  <!-- Polarity markings -->
  <text x="48" y="5" font-family="monospace" font-size="4" fill="#cc3030">+</text>
  <text x="4" y="4" font-family="monospace" font-size="5" fill="#666">-</text>
  <!-- Terminal pads -->
  <circle cx="52" cy="10" r="2" fill="#cc3030"/>
  <circle cx="2" cy="10" r="2" fill="#666"/>
</svg>
