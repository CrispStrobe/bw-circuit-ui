<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 36" width="20" height="36">
  <!-- Tilt Switch (ball type) — black cylindrical, bench-style -->
  <!-- Body -->
  <rect x="3" y="2" width="14" height="22" rx="5" fill="#1a1a1a" stroke="#333" stroke-width="0.8"/>
  <!-- Ball visible through cutaway -->
  <circle cx="10" cy="18" r="3" fill="#c0c0c0" stroke="#999" stroke-width="0.3"/>
  <!-- Label -->
  <text x="10" y="10" text-anchor="middle" font-family="monospace" font-size="3" fill="#666">TILT</text>
  <!-- Leads -->
  <line x1="7" y1="24" x2="7" y2="36" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="13" y1="24" x2="13" y2="36" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="7" cy="36" r="1.5" fill="#c0c0c0"/>
  <circle cx="13" cy="36" r="1.5" fill="#c0c0c0"/>
</svg>
