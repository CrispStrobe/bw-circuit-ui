<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <!-- ELECFREAKS micro:bit Arcade Shield — bench-style face -->
  <!-- Outer shell (rounded handheld console shape) -->
  <rect x="2" y="2" width="96" height="76" rx="8" fill="#222" stroke="#111" stroke-width="1"/>
  <!-- Inner bezel -->
  <rect x="6" y="6" width="88" height="68" rx="5" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>

  <!-- micro:bit edge connector slot (top centre) -->
  <rect x="30" y="0" width="40" height="6" rx="1" fill="#c8a032" stroke="#a08028" stroke-width="0.5"/>
  <text x="50" y="5" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#665020">micro:bit</text>

  <!-- 160x128 TFT display (centre-left) -->
  <rect x="14" y="14" width="44" height="36" rx="2" fill="#111" stroke="#444" stroke-width="0.8"/>
  <!-- Active display area -->
  <rect x="16" y="16" width="40" height="32" rx="1" fill="#0a0a2a" stroke="#222" stroke-width="0.3"/>
  <!-- Sample game pixels -->
  <g fill="#33cc33" opacity="0.6">
    <rect x="20" y="24" width="3" height="3"/>
    <rect x="28" y="20" width="3" height="3"/>
    <rect x="36" y="28" width="3" height="3"/>
    <rect x="44" y="22" width="3" height="3"/>
  </g>
  <g fill="#cc3333" opacity="0.5">
    <rect x="24" y="32" width="3" height="3"/>
    <rect x="40" y="18" width="3" height="3"/>
  </g>
  <text x="36" y="44" text-anchor="middle" font-family="monospace" font-size="2" fill="#334">160x128</text>

  <!-- D-pad (left side, below display) -->
  <g transform="translate(24, 58)">
    <!-- D-pad cross -->
    <rect x="-4" y="-1.5" width="8" height="3" rx="0.5" fill="#444" stroke="#333" stroke-width="0.3"/>
    <rect x="-1.5" y="-4" width="3" height="8" rx="0.5" fill="#444" stroke="#333" stroke-width="0.3"/>
    <!-- Centre dot -->
    <circle cx="0" cy="0" r="1" fill="#333"/>
    <!-- Arrow indicators -->
    <text x="0" y="-5" text-anchor="middle" font-family="sans-serif" font-size="2" fill="#666">U</text>
    <text x="0" y="7" text-anchor="middle" font-family="sans-serif" font-size="2" fill="#666">D</text>
    <text x="-6" y="1" text-anchor="middle" font-family="sans-serif" font-size="2" fill="#666">L</text>
    <text x="6" y="1" text-anchor="middle" font-family="sans-serif" font-size="2" fill="#666">R</text>
  </g>

  <!-- A and B buttons (right side) -->
  <circle cx="72" cy="54" r="5" fill="#cc3333" stroke="#aa2222" stroke-width="0.5"/>
  <text x="72" y="56" text-anchor="middle" font-family="sans-serif" font-size="4" font-weight="bold" fill="#eee">A</text>
  <circle cx="84" cy="62" r="5" fill="#3333cc" stroke="#2222aa" stroke-width="0.5"/>
  <text x="84" y="64" text-anchor="middle" font-family="sans-serif" font-size="4" font-weight="bold" fill="#eee">B</text>

  <!-- Reset button (small, bottom-right) -->
  <circle cx="84" cy="48" r="2" fill="#555" stroke="#444" stroke-width="0.3"/>
  <text x="84" y="44" text-anchor="middle" font-family="monospace" font-size="1.8" fill="#666">RST</text>

  <!-- Label -->
  <text x="50" y="12" text-anchor="middle" font-family="monospace" font-size="3" fill="#888">ELECFREAKS ARCADE</text>

  <!-- Terminal indicators (not visible pins — shield is a module) -->
  <!-- Top: microbit connector -->
  <circle cx="50" cy="0" r="1" fill="#c8a032" opacity="0.5"/>
  <!-- Left: SPI signals -->
  <circle cx="0" cy="20" r="0.8" fill="#888" opacity="0.4"/>
  <circle cx="0" cy="30" r="0.8" fill="#888" opacity="0.4"/>
  <circle cx="0" cy="40" r="0.8" fill="#888" opacity="0.4"/>
  <circle cx="0" cy="50" r="0.8" fill="#888" opacity="0.4"/>
  <!-- Right: button signals -->
  <circle cx="100" cy="20" r="0.8" fill="#888" opacity="0.4"/>
  <circle cx="100" cy="30" r="0.8" fill="#888" opacity="0.4"/>
  <circle cx="100" cy="40" r="0.8" fill="#888" opacity="0.4"/>
  <circle cx="100" cy="50" r="0.8" fill="#888" opacity="0.4"/>
  <circle cx="100" cy="60" r="0.8" fill="#888" opacity="0.4"/>
  <circle cx="100" cy="70" r="0.8" fill="#888" opacity="0.4"/>
  <!-- Bottom: power + reset -->
  <circle cx="20" cy="80" r="0.8" fill="#cc3333" opacity="0.4"/>
  <circle cx="40" cy="80" r="0.8" fill="#333" opacity="0.4"/>
  <circle cx="60" cy="80" r="0.8" fill="#888" opacity="0.4"/>
</svg>
