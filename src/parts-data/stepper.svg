<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70" width="70" height="70">
  <!-- Stepper motor — bench-style front view -->
  <!-- NEMA-style stepper with 4 wire leads -->
  <!-- Motor body (square with rounded corners, typical NEMA shape) -->
  <rect x="8" y="8" width="54" height="54" rx="4" fill="#444" stroke="#333" stroke-width="0.8"/>
  <!-- Mounting holes (4 corners) -->
  <circle cx="14" cy="14" r="2" fill="#333" stroke="#555" stroke-width="0.3"/>
  <circle cx="56" cy="14" r="2" fill="#333" stroke="#555" stroke-width="0.3"/>
  <circle cx="14" cy="56" r="2" fill="#333" stroke="#555" stroke-width="0.3"/>
  <circle cx="56" cy="56" r="2" fill="#333" stroke="#555" stroke-width="0.3"/>
  <!-- Central shaft circle -->
  <circle cx="35" cy="35" r="12" fill="#555" stroke="#666" stroke-width="0.5"/>
  <circle cx="35" cy="35" r="4" fill="#888" stroke="#777" stroke-width="0.5"/>
  <!-- Shaft -->
  <circle cx="35" cy="35" r="2" fill="#c0c0c0"/>
  <!-- Wire leads (4 wires coming from top) -->
  <g stroke-width="1.2">
    <line x1="24" y1="8" x2="24" y2="0" stroke="#ff4444"/>
    <line x1="32" y1="8" x2="32" y2="0" stroke="#4444ff"/>
    <line x1="38" y1="8" x2="38" y2="0" stroke="#44cc44"/>
    <line x1="46" y1="8" x2="46" y2="0" stroke="#333"/>
  </g>
  <!-- Wire labels -->
  <g font-family="monospace" font-size="3" fill="#ccc" text-anchor="middle">
    <text x="24" y="22">A</text>
    <text x="32" y="22">B</text>
    <text x="38" y="22">C</text>
    <text x="46" y="22">D</text>
  </g>
  <!-- Terminal pads -->
  <circle cx="24" cy="0" r="2" fill="#ff4444"/>
  <circle cx="32" cy="0" r="2" fill="#4444ff"/>
  <circle cx="38" cy="0" r="2" fill="#44cc44"/>
  <circle cx="46" cy="0" r="2" fill="#333" stroke="#888" stroke-width="0.5"/>
  <!-- Label -->
  <text x="35" y="50" text-anchor="middle" font-family="monospace" font-size="4" fill="#aaa">STEPPER</text>
</svg>
