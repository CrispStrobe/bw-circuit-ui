<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 16" width="24" height="16">
  <!-- USB-A Connector — standard type A, bench-style -->
  <!-- Metal shell -->
  <rect x="0" y="0" width="24" height="16" rx="1" fill="#c0c0c0" stroke="#999" stroke-width="0.8"/>
  <!-- Inner cavity -->
  <rect x="2" y="2" width="20" height="12" rx="0.5" fill="#e8e0d8"/>
  <!-- Plastic tongue -->
  <rect x="4" y="8" width="16" height="5" rx="0.5" fill="#ddd" stroke="#ccc" stroke-width="0.3"/>
  <!-- 4 contacts on tongue -->
  <rect x="6" y="9" width="2" height="3" rx="0.3" fill="#c0a040"/>
  <rect x="10" y="9" width="2" height="3" rx="0.3" fill="#c0a040"/>
  <rect x="14" y="9" width="2" height="3" rx="0.3" fill="#c0a040"/>
  <rect x="18" y="9" width="2" height="3" rx="0.3" fill="#c0a040"/>
  <!-- Terminal pads (back edge) -->
  <circle cx="7" cy="16" r="1" fill="#cc3030"/>
  <circle cx="11" cy="16" r="1" fill="#c0c0c0"/>
  <circle cx="15" cy="16" r="1" fill="#c0c0c0"/>
  <circle cx="19" cy="16" r="1" fill="#333"/>
</svg>
