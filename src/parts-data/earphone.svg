<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 50" width="44" height="50">
  <!-- Earphone — high-impedance earpiece on its lead, bench-style -->
  <!-- Earpiece body -->
  <ellipse cx="22" cy="16" rx="14" ry="13" fill="#1c1c1c" stroke="#000" stroke-width="0.8"/>
  <!-- Ear tip with sound holes -->
  <ellipse cx="22" cy="13" rx="8" ry="7" fill="#2e2e2e" stroke="#444" stroke-width="0.6"/>
  <circle cx="19" cy="12" r="0.9" fill="#555"/>
  <circle cx="22" cy="11" r="0.9" fill="#555"/>
  <circle cx="25" cy="12" r="0.9" fill="#555"/>
  <circle cx="22" cy="14.5" r="0.9" fill="#555"/>
  <!-- Strain relief -->
  <rect x="19" y="28" width="6" height="5" rx="1" fill="#1c1c1c"/>
  <!-- Two-wire lead splitting to the pins -->
  <path d="M21 33 Q21 40 15 44 L15 50" fill="none" stroke="#aaa" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M23 33 Q23 40 29 44 L29 50" fill="none" stroke="#aaa" stroke-width="1.3" stroke-linecap="round"/>
  <text x="22" y="24" text-anchor="middle" font-family="monospace" font-size="3.5" fill="#888">2k</text>
  <circle cx="15" cy="50" r="2" fill="#c0c0c0"/>
  <circle cx="29" cy="50" r="2" fill="#c0c0c0"/>
</svg>
