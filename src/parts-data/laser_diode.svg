<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 44" width="30" height="44">
  <!-- Laser diode module: brass barrel with a collimating lens, side view -->
  <rect x="6" y="8" width="18" height="22" rx="2" fill="#c8a24a" stroke="#8a6d22" stroke-width="0.8"/>
  <path d="M6 13 H24 M6 18 H24 M6 23 H24" stroke="#a88630" stroke-width="0.6"/>
  <!-- Lens and beam -->
  <ellipse cx="15" cy="8" rx="6" ry="2" fill="#e8f0ff" stroke="#8a6d22" stroke-width="0.6"/>
  <line x1="15" y1="6" x2="15" y2="0" stroke="#e8302a" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Base and leads -->
  <rect x="7" y="30" width="16" height="4" fill="#3a3a3a"/>
  <line x1="8" y1="34" x2="8" y2="44" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="34" x2="22" y2="44" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="8" cy="44" r="2" fill="#c0c0c0"/>
  <circle cx="22" cy="44" r="2" fill="#c0c0c0"/>
  <text x="4" y="40" text-anchor="middle" font-family="monospace" font-size="4" fill="#888">+</text>
</svg>
