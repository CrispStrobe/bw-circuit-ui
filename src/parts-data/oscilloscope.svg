<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 64" width="90" height="64">
  <!-- Oscilloscope — bench instrument, bench-style -->
  <!-- Body -->
  <rect x="2" y="2" width="86" height="52" rx="3" fill="#2a2a3a" stroke="#1a1a2a" stroke-width="1"/>
  <!-- Screen -->
  <rect x="6" y="6" width="50" height="36" rx="2" fill="#0a0a1a" stroke="#333" stroke-width="0.5"/>
  <!-- Grid lines -->
  <g stroke="#1a2a1a" stroke-width="0.3" opacity="0.5">
    <line x1="6" y1="16" x2="56" y2="16"/><line x1="6" y1="24" x2="56" y2="24"/>
    <line x1="6" y1="32" x2="56" y2="32"/>
    <line x1="18" y1="6" x2="18" y2="42"/><line x1="31" y1="6" x2="31" y2="42"/>
    <line x1="44" y1="6" x2="44" y2="42"/>
  </g>
  <!-- Waveform trace (CH1 yellow) -->
  <path d="M8 24 Q14 10 20 24 Q26 38 32 24 Q38 10 44 24 Q50 38 54 24" fill="none" stroke="#ffff00" stroke-width="1"/>
  <!-- Waveform trace (CH2 cyan) -->
  <path d="M8 24 L14 24 L14 16 L26 16 L26 32 L38 32 L38 16 L50 16 L50 24 L54 24" fill="none" stroke="#00ffff" stroke-width="0.8" opacity="0.6"/>
  <!-- Knobs (right panel) -->
  <circle cx="68" cy="14" r="5" fill="#555" stroke="#444" stroke-width="0.5"/>
  <circle cx="80" cy="14" r="4" fill="#555" stroke="#444" stroke-width="0.5"/>
  <circle cx="68" cy="30" r="4" fill="#555" stroke="#444" stroke-width="0.5"/>
  <circle cx="80" cy="30" r="4" fill="#555" stroke="#444" stroke-width="0.5"/>
  <!-- Channel labels -->
  <text x="68" y="42" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#ffff00">CH1</text>
  <text x="80" y="42" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#00ffff">CH2</text>
  <!-- Probe terminals (bottom) -->
  <circle cx="20" cy="52" r="3" fill="#222" stroke="#ffff00" stroke-width="0.5"/>
  <circle cx="36" cy="52" r="3" fill="#222" stroke="#00ffff" stroke-width="0.5"/>
  <circle cx="52" cy="52" r="3" fill="#222" stroke="#444" stroke-width="0.5"/>
  <line x1="20" y1="54" x2="20" y2="64" stroke="#ffff00" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="54" x2="36" y2="64" stroke="#00ffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="54" x2="52" y2="64" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="20" cy="64" r="2" fill="#ffff00"/>
  <circle cx="36" cy="64" r="2" fill="#00ffff"/>
  <circle cx="52" cy="64" r="2" fill="#666"/>
</svg>
