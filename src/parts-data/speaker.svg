<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 60" width="56" height="60">
  <!-- Speaker — dynamic loudspeaker, bench-style top view -->
  <!-- Frame (steel basket) -->
  <circle cx="28" cy="26" r="24" fill="#2b2b2b" stroke="#111" stroke-width="1"/>
  <!-- Surround -->
  <circle cx="28" cy="26" r="21" fill="#3a3a3a" stroke="#222" stroke-width="0.8"/>
  <!-- Paper cone -->
  <circle cx="28" cy="26" r="17" fill="#4a4036" stroke="#2a241e" stroke-width="0.6"/>
  <circle cx="28" cy="26" r="12" fill="none" stroke="#3a322a" stroke-width="0.5"/>
  <!-- Dust cap -->
  <circle cx="28" cy="26" r="6" fill="#222" stroke="#555" stroke-width="0.6"/>
  <!-- Mounting holes -->
  <circle cx="11" cy="9" r="1.5" fill="#111"/>
  <circle cx="45" cy="9" r="1.5" fill="#111"/>
  <circle cx="11" cy="43" r="1.5" fill="#111"/>
  <circle cx="45" cy="43" r="1.5" fill="#111"/>
  <!-- Label -->
  <text x="28" y="27.5" text-anchor="middle" font-family="monospace" font-size="3.5" fill="#bbb">8&#937;</text>
  <!-- Solder tags and leads -->
  <line x1="14" y1="44" x2="14" y2="60" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42" y1="44" x2="42" y2="60" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <text x="18" y="56" font-family="monospace" font-size="4" fill="#888">+</text>
  <circle cx="14" cy="60" r="2" fill="#c0c0c0"/>
  <circle cx="42" cy="60" r="2" fill="#c0c0c0"/>
</svg>
