<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 36" width="40" height="36">
  <!-- SGP30 Air Quality / Gas Sensor Module — bench-style -->
  <!-- PCB -->
  <rect x="2" y="4" width="36" height="24" rx="2" fill="#1a6b4a" stroke="#0d4d2a" stroke-width="0.8"/>
  <!-- SGP30 sensor (metal-lid QFN with filter membrane) -->
  <rect x="12" y="7" width="14" height="10" rx="1" fill="#777" stroke="#555" stroke-width="0.5"/>
  <!-- Filter membrane (white dot) -->
  <circle cx="19" cy="12" r="3" fill="#ddd" stroke="#bbb" stroke-width="0.4"/>
  <circle cx="19" cy="12" r="1.5" fill="#eee" opacity="0.5"/>
  <!-- Labels -->
  <text x="20" y="22" text-anchor="middle" font-family="monospace" font-size="3" fill="#ccc">SGP30</text>
  <text x="20" y="26" text-anchor="middle" font-family="monospace" font-size="2" fill="#888">eCO2/TVOC</text>
  <!-- Bottom pins: VCC, GND, SDA, SCL -->
  <line x1="8" y1="28" x2="8" y2="36" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="8" cy="36" r="1.2" fill="#c0c0c0"/>
  <line x1="16" y1="28" x2="16" y2="36" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="16" cy="36" r="1.2" fill="#c0c0c0"/>
  <line x1="24" y1="28" x2="24" y2="36" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="24" cy="36" r="1.2" fill="#c0c0c0"/>
  <line x1="32" y1="28" x2="32" y2="36" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="32" cy="36" r="1.2" fill="#c0c0c0"/>
</svg>
