<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 46" width="70" height="46">
  <!-- osc_can — full-size DIP-14 metal-can oscillator, bench-style -->
  <rect x="10" y="2" width="50" height="42" rx="6" fill="#b8bcc0" stroke="#7a7e82" stroke-width="1"/>
  <rect x="13" y="5" width="44" height="36" rx="4" fill="none" stroke="#d8dadc" stroke-width="0.8"/>
  <circle cx="16" cy="9" r="1.5" fill="#7a7e82"/>
  <text x="35" y="20" text-anchor="middle" font-family="monospace" font-size="5" fill="#3a3d40">OSC</text>
  <text x="35" y="28" text-anchor="middle" font-family="monospace" font-size="3.5" fill="#5a5e62">XTAL CLK</text>
  <text x="35" y="35" text-anchor="middle" font-family="monospace" font-size="3" fill="#5a5e62">MHz</text>
  <!-- Corner leads: pin 1 OE, pin 7 GND (left), pin 8 OUT, pin 14 VCC (right) -->
  <line x1="0" y1="8" x2="10" y2="8" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="0" cy="8" r="1.5" fill="#c0c0c0"/>
  <line x1="0" y1="38" x2="10" y2="38" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="0" cy="38" r="1.5" fill="#c0c0c0"/>
  <line x1="60" y1="38" x2="70" y2="38" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="70" cy="38" r="1.5" fill="#c0c0c0"/>
  <line x1="60" y1="8" x2="70" y2="8" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="70" cy="8" r="1.5" fill="#c0c0c0"/>
</svg>
