<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 48" width="40" height="48">
  <!-- DS3231 RTC Module — DIP-style face, bench-style -->
  <!-- PCB -->
  <rect x="2" y="2" width="36" height="34" rx="2" fill="#1a6b1a" stroke="#0d4d0d" stroke-width="0.8"/>
  <!-- IC package -->
  <rect x="8" y="6" width="24" height="16" rx="1" fill="#303030" stroke="#1a1a1a" stroke-width="0.6"/>
  <!-- Notch -->
  <path d="M17 6 Q20 9 23 6" fill="#303030" stroke="#555" stroke-width="0.5"/>
  <!-- Pin 1 dot -->
  <circle cx="12" cy="10" r="1" fill="#b0b0b0"/>
  <!-- IC label -->
  <text x="20" y="17" text-anchor="middle" font-family="monospace" font-size="3.5" fill="#c0c0c0">DS3231</text>
  <!-- Battery holder outline -->
  <circle cx="20" cy="30" r="5" fill="none" stroke="#888" stroke-width="0.5"/>
  <text x="20" y="31.5" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#666">BAT</text>
  <!-- 32.768 kHz crystal -->
  <rect x="6" y="25" width="5" height="3" rx="1" fill="#c0c0c0" stroke="#999" stroke-width="0.3"/>
  <!-- 4 header pins: VCC, GND, SDA, SCL -->
  <line x1="10" y1="36" x2="10" y2="48" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="10" cy="48" r="1.5" fill="#c0c0c0"/>
  <line x1="18" y1="36" x2="18" y2="48" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="18" cy="48" r="1.5" fill="#c0c0c0"/>
  <line x1="26" y1="36" x2="26" y2="48" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="26" cy="48" r="1.5" fill="#c0c0c0"/>
  <line x1="34" y1="36" x2="34" y2="48" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="34" cy="48" r="1.5" fill="#c0c0c0"/>
</svg>
