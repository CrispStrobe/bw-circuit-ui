<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 71" width="70" height="71">
  <!-- FTDI UM245R USB-to-parallel-FIFO module (DIP-24 breakout), bench style.
       Terminal pads match the sidecar's modeled pins; the unlabelled leads
       between them are the module's unmodeled physical pins. -->
  <!-- module PCB -->
  <rect x="6" y="2" width="58" height="67" rx="3" fill="#14532d" stroke="#0c3a1f" stroke-width="1"/>
  <!-- USB-B connector at the top -->
  <rect x="22" y="0" width="26" height="12" rx="2" fill="#9ca3af" stroke="#6b7280" stroke-width="1"/>
  <rect x="26" y="2" width="18" height="8" rx="1" fill="#d1d5db"/>
  <!-- FT245R chip -->
  <rect x="22" y="26" width="26" height="22" rx="2" fill="#111827" stroke="#374151" stroke-width="1"/>
  <circle cx="26" cy="30" r="1.5" fill="#4b5563"/>
  <text x="35" y="39" text-anchor="middle" fill="#e5e7eb" font-size="5" font-family="monospace">FT245R</text>
  <!-- label -->
  <text x="35" y="61" text-anchor="middle" fill="#a7f3d0" font-size="6" font-family="monospace">UM245R</text>
  <!-- left leads: d0-d7, rdb, gnd -->
  <g stroke="#a1a1aa" stroke-width="1.5">
    <line x1="0" y1="8" x2="6" y2="8"/>
    <line x1="0" y1="13" x2="6" y2="13"/>
    <line x1="0" y1="18" x2="6" y2="18"/>
    <line x1="0" y1="23" x2="6" y2="23"/>
    <line x1="0" y1="28" x2="6" y2="28"/>
    <line x1="0" y1="33" x2="6" y2="33"/>
    <line x1="0" y1="38" x2="6" y2="38"/>
    <line x1="0" y1="43" x2="6" y2="43"/>
    <line x1="0" y1="48" x2="6" y2="48"/>
    <line x1="0" y1="63" x2="6" y2="63"/>
    <!-- right leads: vcc, resetb, wr, txeb, rxfb -->
    <line x1="64" y1="18" x2="70" y2="18"/>
    <line x1="64" y1="28" x2="70" y2="28"/>
    <line x1="64" y1="38" x2="70" y2="38"/>
    <line x1="64" y1="58" x2="70" y2="58"/>
    <line x1="64" y1="63" x2="70" y2="63"/>
  </g>
  <!-- pads -->
  <g fill="#fbbf24">
    <circle cx="0" cy="8" r="1.5"/><circle cx="0" cy="13" r="1.5"/>
    <circle cx="0" cy="18" r="1.5"/><circle cx="0" cy="23" r="1.5"/>
    <circle cx="0" cy="28" r="1.5"/><circle cx="0" cy="33" r="1.5"/>
    <circle cx="0" cy="38" r="1.5"/><circle cx="0" cy="43" r="1.5"/>
    <circle cx="0" cy="48" r="1.5"/><circle cx="0" cy="63" r="1.5"/>
    <circle cx="70" cy="18" r="1.5"/><circle cx="70" cy="28" r="1.5"/>
    <circle cx="70" cy="38" r="1.5"/><circle cx="70" cy="58" r="1.5"/>
    <circle cx="70" cy="63" r="1.5"/>
  </g>
</svg>
