<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70" width="70" height="70">
  <!-- DC Motor — bench-style cylindrical can motor, front view -->
  <!-- Motor body (cylindrical can, shown as rounded rect) -->
  <rect x="10" y="8" width="50" height="44" rx="8" fill="#6a6a6a" stroke="#444" stroke-width="1"/>
  <!-- Metal endcap -->
  <rect x="14" y="10" width="42" height="40" rx="6" fill="#808080" stroke="#5a5a5a" stroke-width="0.5"/>
  <!-- Center shaft circle -->
  <circle cx="35" cy="30" r="8" fill="#555" stroke="#444" stroke-width="0.8"/>
  <circle cx="35" cy="30" r="3" fill="#b0b0b0" stroke="#888" stroke-width="0.5"/>
  <!-- Shaft line (comes out top) -->
  <rect x="33.5" y="0" width="3" height="10" rx="1" fill="#b0b0b0" stroke="#888" stroke-width="0.3"/>
  <!-- Label -->
  <text x="35" y="47" text-anchor="middle" font-family="monospace" font-size="5" fill="#d0d0d0">DC MOTOR</text>
  <!-- Terminal tabs at bottom -->
  <rect x="22" y="52" width="6" height="8" rx="1" fill="#c0a040" stroke="#a08020" stroke-width="0.5"/>
  <rect x="42" y="52" width="6" height="8" rx="1" fill="#c0a040" stroke="#a08020" stroke-width="0.5"/>
  <!-- Terminal connection points -->
  <line x1="25" y1="60" x2="25" y2="70" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="25" cy="70" r="1.5" fill="#c0c0c0"/>
  <line x1="45" y1="60" x2="45" y2="70" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="45" cy="70" r="1.5" fill="#c0c0c0"/>
  <!-- Polarity markings -->
  <text x="25" y="57" text-anchor="middle" font-family="monospace" font-size="4" fill="#333">+</text>
  <text x="45" y="57" text-anchor="middle" font-family="monospace" font-size="4" fill="#333">-</text>
</svg>
