  <text x="40" y="50" text-anchor="middle" font-family="monospace" font-size="3.5" fill="#888">DISPLAY</text>
  <text x="40" y="56" text-anchor="middle" font-family="monospace" font-size="3.5" fill="#888">PROCESSOR</text>
  <!-- Date code -->
  <text x="40" y="70" text-anchor="middle" font-family="monospace" font-size="3" fill="#666">DIP-40</text>

