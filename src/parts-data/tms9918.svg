<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 111" width="80" height="111">
  <!-- TMS9918A Video Display Processor — DIP-40 package, bench-style -->
  <!-- Package body -->
  <rect x="10" y="2" width="60" height="107" rx="2" fill="#303030" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Notch -->
  <path d="M36 2 Q40 7 44 2" fill="#303030" stroke="#555" stroke-width="0.8"/>
