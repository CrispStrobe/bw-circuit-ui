<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 48" width="60" height="48">
  <!-- Breadboard Power Supply — small PCB module, bench-style -->
  <!-- PCB -->
  <rect x="2" y="2" width="56" height="44" rx="2" fill="#0a5a0a" stroke="#084a08" stroke-width="0.8"/>
  <!-- USB connector -->
  <rect x="22" y="0" width="16" height="6" rx="1" fill="#c0c0c0" stroke="#999" stroke-width="0.5"/>
  <!-- Voltage regulator IC -->
  <rect x="20" y="14" width="20" height="10" rx="1" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
  <text x="30" y="21" text-anchor="middle" font-family="monospace" font-size="3.5" fill="#888">AMS1117</text>
  <!-- Toggle switches for 3.3V/5V -->
  <rect x="8" y="28" width="12" height="6" rx="1" fill="#333" stroke="#555" stroke-width="0.3"/>
  <rect x="40" y="28" width="12" height="6" rx="1" fill="#333" stroke="#555" stroke-width="0.3"/>
  <!-- Power LED -->
  <circle cx="30" cy="36" r="2" fill="#00ff00" opacity="0.7"/>
  <!-- Output pins at bottom -->
  <line x1="12" y1="46" x2="12" y2="48" stroke="#cc3030" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="12" cy="48" r="1.5" fill="#cc3030"/>
  <line x1="30" y1="46" x2="30" y2="48" stroke="#4488ff" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="30" cy="48" r="1.5" fill="#4488ff"/>
  <line x1="48" y1="46" x2="48" y2="48" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="48" cy="48" r="1.5" fill="#333"/>
  <!-- Labels -->
  <text x="12" y="44" text-anchor="middle" font-family="monospace" font-size="3" fill="#90c090">5V</text>
  <text x="30" y="44" text-anchor="middle" font-family="monospace" font-size="3" fill="#90c090">3V3</text>
  <text x="48" y="44" text-anchor="middle" font-family="monospace" font-size="3" fill="#90c090">GND</text>
</svg>
