<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160" viewBox="0 0 240 160" role="img" aria-labelledby="title desc">
  <title id="title">GUITION ESP32-4848S040 display board and rear H1 connector</title>
  <desc id="desc">Original stylised front display with separate rear connector inset. H1 rows, left then right: GND and GND; GPIO40 and RXD GPIO44; GPIO2 and TXD GPIO43; GPIO1 and 5V. GPIO uses 3.3 volt logic. Not to mechanical scale.</desc>
  <rect x="4" y="4" width="148" height="148" rx="8" fill="#24272d" stroke="#555b65" stroke-width="1.5"/>
  <rect x="9" y="9" width="138" height="138" rx="5" fill="#15181d" stroke="#080b10"/>
  <rect x="16" y="16" width="124" height="124" fill="#080d15"/>
  <text x="78" y="70" fill="#91a1b6" font-family="sans-serif" font-size="7" text-anchor="middle">480 × 480</text>
  <text x="78" y="82" fill="#627389" font-family="sans-serif" font-size="5.5" text-anchor="middle">ST7701 · GT911</text>
  <text x="78" y="149" fill="#b7c0ce" font-family="sans-serif" font-size="5.4" text-anchor="middle">ESP32-4848S040 · FRONT</text>
  <rect x="160" y="8" width="76" height="144" rx="5" fill="#123b39" stroke="#37716b"/>
  <text x="198" y="20" fill="#e4f2ee" font-family="sans-serif" font-size="6.8" font-weight="bold" text-anchor="middle">REAR H1 INSET</text>
  <text x="198" y="29" fill="#a8ccc4" font-family="sans-serif" font-size="4.7" text-anchor="middle">SEPARATE VIEW · NOT TO SCALE</text>
  <rect x="170" y="37" width="56" height="100" rx="3" fill="#151c22" stroke="#080c10"/>
  <g fill="#d5ad57" stroke="#785c24" stroke-width="0.7">
    <rect x="177" y="45" width="6" height="6"/><rect x="213" y="45" width="6" height="6"/>
    <rect x="177" y="69" width="6" height="6"/><rect x="213" y="69" width="6" height="6"/>
    <rect x="177" y="93" width="6" height="6"/><rect x="213" y="93" width="6" height="6"/>
    <rect x="177" y="117" width="6" height="6"/><rect x="213" y="117" width="6" height="6"/>
  </g>
  <g fill="#e3eaf0" font-family="sans-serif" font-size="5.2" text-anchor="middle">
    <text x="180" y="59">GND</text><text x="216" y="59">GND</text>
    <text x="180" y="83">GPIO40</text><text x="216" y="83">RXD44</text>
    <text x="180" y="107">GPIO2</text><text x="216" y="107">TXD43</text>
    <text x="180" y="131">GPIO1</text><text x="216" y="131" fill="#ffd28b">5V</text>
  </g>
  <text x="198" y="146" fill="#b6ddd1" font-family="sans-serif" font-size="5.2" text-anchor="middle">GPIO: 3.3 V</text>
</svg>
