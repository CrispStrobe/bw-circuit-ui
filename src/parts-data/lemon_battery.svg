<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 36" width="56" height="36">
  <!-- Lemon Battery — pedagogical, bench-style -->
  <!-- Lemon body -->
  <ellipse cx="28" cy="20" rx="22" ry="12" fill="#e8d020" stroke="#c8b010" stroke-width="0.8"/>
  <!-- Stem end -->
  <ellipse cx="8" cy="18" rx="3" ry="2" fill="#90a020" opacity="0.6"/>
  <!-- Copper electrode -->
  <rect x="16" y="8" width="3" height="16" rx="0.5" fill="#c07030" stroke="#a06020" stroke-width="0.3"/>
  <!-- Zinc electrode -->
  <rect x="36" y="6" width="2" height="20" rx="0.3" fill="#a0a0a0" stroke="#808080" stroke-width="0.3"/>
  <rect x="34" y="4" width="6" height="4" rx="1" fill="#888" stroke="#777" stroke-width="0.3"/>
  <!-- Wire leads -->
  <line x1="17.5" y1="8" x2="17.5" y2="0" stroke="#c07030" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="37" y1="6" x2="37" y2="0" stroke="#a0a0a0" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="17.5" cy="0" r="2" fill="#c07030"/>
  <circle cx="37" cy="0" r="2" fill="#a0a0a0"/>
  <text x="17.5" y="36" text-anchor="middle" font-family="monospace" font-size="3" fill="#888">Cu+</text>
  <text x="37" y="36" text-anchor="middle" font-family="monospace" font-size="3" fill="#888">Zn-</text>
</svg>
