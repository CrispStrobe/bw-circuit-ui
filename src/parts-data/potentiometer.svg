<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <!-- Potentiometer — 3-pin panel mount, bench-style top view -->
  <!-- Body (blue cylindrical, top-down view) -->
  <circle cx="30" cy="28" r="18" fill="#2255aa" stroke="#1a4090" stroke-width="1"/>
  <!-- Center shaft slot -->
  <circle cx="30" cy="28" r="6" fill="#e0e0e0" stroke="#bbb" stroke-width="0.5"/>
  <line x1="27" y1="28" x2="33" y2="28" stroke="#888" stroke-width="1.5"/>
  <!-- Knob marking -->
  <line x1="30" y1="22" x2="30" y2="12" stroke="#4080d0" stroke-width="1" stroke-dasharray="2,1"/>
  <!-- Terminal legs -->
  <line x1="5" y1="50" x2="12" y2="44" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="5" cy="50" r="2" fill="#c0c0c0"/>
  <line x1="30" y1="10" x2="30" y2="4" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="30" cy="10" r="2" fill="#c0c0c0"/>
  <line x1="55" y1="50" x2="48" y2="44" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="55" cy="50" r="2" fill="#c0c0c0"/>
  <!-- Pin labels -->
  <text x="5" y="58" text-anchor="middle" font-family="monospace" font-size="3.5" fill="#888">A</text>
  <text x="30" y="4" text-anchor="middle" font-family="monospace" font-size="3.5" fill="#888">W</text>
  <text x="55" y="58" text-anchor="middle" font-family="monospace" font-size="3.5" fill="#888">B</text>
</svg>
