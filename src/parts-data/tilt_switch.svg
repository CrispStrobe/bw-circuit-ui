<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 36" width="20" height="36">
  <!-- Tilt Switch — cylindrical mercury/ball type, bench-style -->
  <!-- Glass cylinder body -->
  <rect x="4" y="2" width="12" height="22" rx="4" fill="#888" stroke="#666" stroke-width="0.5" opacity="0.4"/>
  <rect x="5" y="3" width="10" height="20" rx="3" fill="#b0b0b0" stroke="#999" stroke-width="0.3" opacity="0.2"/>
  <!-- Mercury/ball inside -->
  <ellipse cx="10" cy="18" rx="3.5" ry="3" fill="#a0a0b0" stroke="#808090" stroke-width="0.3"/>
  <!-- Contact electrodes -->
  <line x1="7" y1="22" x2="7" y2="20" stroke="#c0a040" stroke-width="1"/>
  <line x1="13" y1="22" x2="13" y2="20" stroke="#c0a040" stroke-width="1"/>
  <!-- Leads -->
  <line x1="7" y1="24" x2="7" y2="36" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="13" y1="24" x2="13" y2="36" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="7" cy="36" r="1.5" fill="#c0c0c0"/>
  <circle cx="13" cy="36" r="1.5" fill="#c0c0c0"/>
</svg>
