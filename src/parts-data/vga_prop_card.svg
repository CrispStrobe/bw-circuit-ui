<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 70" width="130" height="70">
  <!-- VGA Propeller Tile Card — single-module card face, bench-style -->
  <!-- PCB substrate -->
  <rect x="2" y="2" width="126" height="56" rx="3" fill="#1a2a6b" stroke="#0d1a4d" stroke-width="1"/>
  <!-- VGA connector (DE-15, blue housing) -->
  <rect x="6" y="8" width="30" height="18" rx="2" fill="#2255aa" stroke="#1a3d7a" stroke-width="0.8"/>
  <!-- DE-15 pin pattern -->
  <g fill="#c0c0c0">
    <circle cx="12" cy="14" r="1"/><circle cx="16" cy="14" r="1"/><circle cx="20" cy="14" r="1"/>
    <circle cx="24" cy="14" r="1"/><circle cx="28" cy="14" r="1"/>
    <circle cx="14" cy="18" r="1"/><circle cx="18" cy="18" r="1"/><circle cx="22" cy="18" r="1"/>
    <circle cx="26" cy="18" r="1"/><circle cx="30" cy="18" r="1"/>
    <circle cx="12" cy="22" r="1"/><circle cx="16" cy="22" r="1"/><circle cx="20" cy="22" r="1"/>
    <circle cx="24" cy="22" r="1"/><circle cx="28" cy="22" r="1"/>
  </g>
  <rect x="9" y="10" width="24" height="14" rx="6" fill="none" stroke="#8ab4f8" stroke-width="0.5"/>
  <text x="21" y="32" text-anchor="middle" font-family="monospace" font-size="3" fill="#8fbc8f">VGA</text>
  <!-- Propeller P8X32A chip (QFP drawn as rectangle) -->
  <rect x="44" y="6" width="30" height="30" rx="1" fill="#303030" stroke="#1a1a1a" stroke-width="0.6"/>
  <circle cx="50" cy="12" r="1" fill="#555"/>
  <text x="59" y="20" text-anchor="middle" font-family="monospace" font-size="3.5" fill="#aaa">P8X32A</text>
  <text x="59" y="26" text-anchor="middle" font-family="monospace" font-size="3" fill="#777">PROPELLER</text>
  <!-- QFP pin stubs (simplified, 4 sides) -->
  <g stroke="#aaa" stroke-width="0.6">
    <line x1="47" y1="4" x2="47" y2="6"/><line x1="51" y1="4" x2="51" y2="6"/>
    <line x1="55" y1="4" x2="55" y2="6"/><line x1="59" y1="4" x2="59" y2="6"/>
    <line x1="63" y1="4" x2="63" y2="6"/><line x1="67" y1="4" x2="67" y2="6"/>
    <line x1="71" y1="4" x2="71" y2="6"/>
    <line x1="47" y1="36" x2="47" y2="38"/><line x1="51" y1="36" x2="51" y2="38"/>
    <line x1="55" y1="36" x2="55" y2="38"/><line x1="59" y1="36" x2="59" y2="38"/>
    <line x1="63" y1="36" x2="63" y2="38"/><line x1="67" y1="36" x2="67" y2="38"/>
    <line x1="71" y1="36" x2="71" y2="38"/>
    <line x1="42" y1="10" x2="44" y2="10"/><line x1="42" y1="14" x2="44" y2="14"/>
    <line x1="42" y1="18" x2="44" y2="18"/><line x1="42" y1="22" x2="44" y2="22"/>
    <line x1="42" y1="26" x2="44" y2="26"/><line x1="42" y1="30" x2="44" y2="30"/>
    <line x1="74" y1="10" x2="76" y2="10"/><line x1="74" y1="14" x2="76" y2="14"/>
    <line x1="74" y1="18" x2="76" y2="18"/><line x1="74" y1="22" x2="76" y2="22"/>
    <line x1="74" y1="26" x2="76" y2="26"/><line x1="74" y1="30" x2="76" y2="30"/>
  </g>
  <!-- Crystal oscillator -->
  <rect x="82" y="8" width="12" height="6" rx="2" fill="#c0c0c0" stroke="#999" stroke-width="0.4"/>
  <text x="88" y="12.5" text-anchor="middle" font-family="monospace" font-size="2" fill="#555">5MHz</text>
  <!-- EEPROM -->
  <rect x="82" y="20" width="14" height="8" rx="1" fill="#303030" stroke="#1a1a1a" stroke-width="0.4"/>
  <text x="89" y="25.5" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#aaa">EEPROM</text>
  <!-- Resistor DAC network -->
  <rect x="44" y="42" width="24" height="5" rx="1" fill="#333" stroke="#222" stroke-width="0.4"/>
  <text x="56" y="46" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#888">R-2R DAC</text>
  <!-- Level shifter / buffer -->
  <rect x="100" y="8" width="16" height="10" rx="1" fill="#303030" stroke="#1a1a1a" stroke-width="0.4"/>
  <text x="108" y="14.5" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#aaa">BUF</text>
  <!-- Decoupling caps -->
  <rect x="100" y="22" width="4" height="2" rx="0.5" fill="#c89632" stroke="#8a6a20" stroke-width="0.3"/>
  <rect x="106" y="22" width="4" height="2" rx="0.5" fill="#c89632" stroke="#8a6a20" stroke-width="0.3"/>
  <rect x="112" y="22" width="4" height="2" rx="0.5" fill="#c89632" stroke="#8a6a20" stroke-width="0.3"/>
  <!-- Board label -->
  <text x="65" y="52" text-anchor="middle" font-family="monospace" font-size="4.5" fill="#c0d8f0" font-weight="bold">VGA-PROP TILE</text>
  <!-- 3 header pins: VCC, GND, BUS -->
  <line x1="44" y1="58" x2="44" y2="70" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="44" cy="70" r="1.5" fill="#c0c0c0"/>
  <line x1="60" y1="58" x2="60" y2="70" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="60" cy="70" r="1.5" fill="#c0c0c0"/>
  <line x1="76" y1="58" x2="76" y2="70" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="76" cy="70" r="1.5" fill="#c0c0c0"/>
</svg>
