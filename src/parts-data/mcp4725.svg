<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- MCP4725 I2C DAC breakout module — one 6-pin header (OUT GND VCC SDA SCL A0) -->
  <rect x="2" y="4" width="44" height="40" rx="2" fill="#1a5276" stroke="#154360" stroke-width="1"/>
  <rect x="13" y="8" width="22" height="14" rx="1" fill="#212f3d" stroke="#1c2833" stroke-width="0.5"/>
  <text x="24" y="16" text-anchor="middle" font-family="monospace" font-size="4" fill="#aed6f1">MCP</text>
  <text x="24" y="21" text-anchor="middle" font-family="monospace" font-size="4" fill="#aed6f1">4725</text>
  <text x="24" y="28.5" text-anchor="middle" font-family="monospace" font-size="3" fill="#85929e">12-BIT DAC</text>
  <text x="24" y="33" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#5d6d7e">I2C 0x60</text>
  <rect x="1.8" y="38.8" width="4.4" height="4.4" fill="#d9b44a" stroke="#8a6d1d" stroke-width="0.4"/>
  <line x1="4" y1="44" x2="4" y2="48" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="4" cy="48" r="1.2" fill="#c0c0c0"/>
  <text x="4" y="37.4" text-anchor="middle" font-family="monospace" font-size="1.9" fill="#d6eaf8">OUT</text>
  <rect x="9.8" y="38.8" width="4.4" height="4.4" fill="#d9b44a" stroke="#8a6d1d" stroke-width="0.4"/>
  <line x1="12" y1="44" x2="12" y2="48" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="12" cy="48" r="1.2" fill="#c0c0c0"/>
  <text x="12" y="37.4" text-anchor="middle" font-family="monospace" font-size="1.9" fill="#d6eaf8">GND</text>
  <rect x="17.8" y="38.8" width="4.4" height="4.4" fill="#d9b44a" stroke="#8a6d1d" stroke-width="0.4"/>
  <line x1="20" y1="44" x2="20" y2="48" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="20" cy="48" r="1.2" fill="#c0c0c0"/>
  <text x="20" y="37.4" text-anchor="middle" font-family="monospace" font-size="1.9" fill="#d6eaf8">VCC</text>
  <rect x="25.8" y="38.8" width="4.4" height="4.4" fill="#d9b44a" stroke="#8a6d1d" stroke-width="0.4"/>
  <line x1="28" y1="44" x2="28" y2="48" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="28" cy="48" r="1.2" fill="#c0c0c0"/>
  <text x="28" y="37.4" text-anchor="middle" font-family="monospace" font-size="1.9" fill="#d6eaf8">SDA</text>
  <rect x="33.8" y="38.8" width="4.4" height="4.4" fill="#d9b44a" stroke="#8a6d1d" stroke-width="0.4"/>
  <line x1="36" y1="44" x2="36" y2="48" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="36" cy="48" r="1.2" fill="#c0c0c0"/>
  <text x="36" y="37.4" text-anchor="middle" font-family="monospace" font-size="1.9" fill="#d6eaf8">SCL</text>
  <rect x="41.8" y="38.8" width="4.4" height="4.4" fill="#d9b44a" stroke="#8a6d1d" stroke-width="0.4"/>
  <line x1="44" y1="44" x2="44" y2="48" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="44" cy="48" r="1.2" fill="#c0c0c0"/>
  <text x="44" y="37.4" text-anchor="middle" font-family="monospace" font-size="1.9" fill="#d6eaf8">A0</text>
