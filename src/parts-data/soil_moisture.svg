<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 60" width="20" height="60">
  <!-- Soil Moisture Sensor — fork probe, bench-style -->
  <!-- Probe tines -->
  <rect x="2" y="0" width="5" height="40" rx="1" fill="#c0a040" stroke="#a08020" stroke-width="0.5"/>
  <rect x="13" y="0" width="5" height="40" rx="1" fill="#c0a040" stroke="#a08020" stroke-width="0.5"/>
  <!-- PCB header -->
  <rect x="0" y="40" width="20" height="12" rx="1" fill="#0a5a0a" stroke="#084a08" stroke-width="0.5"/>
  <!-- Traces between tines -->
  <line x1="4.5" y1="6" x2="15.5" y2="6" stroke="#b09020" stroke-width="0.3" stroke-dasharray="1,2"/>
  <line x1="4.5" y1="12" x2="15.5" y2="12" stroke="#b09020" stroke-width="0.3" stroke-dasharray="1,2"/>
  <line x1="4.5" y1="18" x2="15.5" y2="18" stroke="#b09020" stroke-width="0.3" stroke-dasharray="1,2"/>
  <!-- Pins -->
  <line x1="4" y1="52" x2="4" y2="60" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="10" y1="52" x2="10" y2="60" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16" y1="52" x2="16" y2="60" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="4" cy="60" r="1.5" fill="#c0c0c0"/>
  <circle cx="10" cy="60" r="1.5" fill="#c0c0c0"/>
  <circle cx="16" cy="60" r="1.5" fill="#c0c0c0"/>
</svg>
