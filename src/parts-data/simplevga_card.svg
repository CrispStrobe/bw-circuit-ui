<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 70" width="120" height="70">
  <!-- SimpleVGA6502 Card — single-module card face, bench-style -->
  <!-- PCB substrate -->
  <rect x="2" y="2" width="116" height="56" rx="3" fill="#1a6b2a" stroke="#0d4d15" stroke-width="1"/>
  <!-- VGA connector (DE-15, blue housing) -->
  <rect x="6" y="8" width="30" height="18" rx="2" fill="#2255aa" stroke="#1a3d7a" stroke-width="0.8"/>
  <!-- DE-15 pin pattern (3 rows of 5) -->
  <g fill="#c0c0c0">
    <circle cx="12" cy="14" r="1"/><circle cx="16" cy="14" r="1"/><circle cx="20" cy="14" r="1"/>
    <circle cx="24" cy="14" r="1"/><circle cx="28" cy="14" r="1"/>
    <circle cx="14" cy="18" r="1"/><circle cx="18" cy="18" r="1"/><circle cx="22" cy="18" r="1"/>
    <circle cx="26" cy="18" r="1"/><circle cx="30" cy="18" r="1"/>
    <circle cx="12" cy="22" r="1"/><circle cx="16" cy="22" r="1"/><circle cx="20" cy="22" r="1"/>
    <circle cx="24" cy="22" r="1"/><circle cx="28" cy="22" r="1"/>
  </g>
  <!-- Connector housing outline -->
  <rect x="9" y="10" width="24" height="14" rx="6" fill="none" stroke="#8ab4f8" stroke-width="0.5"/>
  <text x="21" y="32" text-anchor="middle" font-family="monospace" font-size="3" fill="#8fbc8f">VGA</text>
  <!-- Counter / logic block -->
  <rect x="44" y="8" width="30" height="18" rx="1" fill="#303030" stroke="#1a1a1a" stroke-width="0.6"/>
  <text x="59" y="17" text-anchor="middle" font-family="monospace" font-size="3" fill="#aaa">COUNTER</text>
  <text x="59" y="22" text-anchor="middle" font-family="monospace" font-size="3" fill="#aaa">LOGIC</text>
  <!-- Character ROM -->
  <rect x="80" y="8" width="30" height="18" rx="1" fill="#303030" stroke="#1a1a1a" stroke-width="0.6"/>
  <text x="95" y="17" text-anchor="middle" font-family="monospace" font-size="3" fill="#aaa">CHAR</text>
  <text x="95" y="22" text-anchor="middle" font-family="monospace" font-size="3" fill="#aaa">ROM</text>
  <!-- Resistor DAC network -->
  <rect x="44" y="32" width="24" height="6" rx="1" fill="#333" stroke="#222" stroke-width="0.4"/>
  <text x="56" y="36.5" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#888">R-DAC</text>
  <!-- Sync generation -->
  <rect x="74" y="32" width="20" height="6" rx="1" fill="#333" stroke="#222" stroke-width="0.4"/>
  <text x="84" y="36.5" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#888">SYNC</text>
  <!-- Board label -->
  <text x="60" y="50" text-anchor="middle" font-family="monospace" font-size="4" fill="#c0d8c0" font-weight="bold">SIMPLEVGA</text>
  <!-- Decoupling caps -->
  <rect x="100" y="34" width="4" height="2" rx="0.5" fill="#c89632" stroke="#8a6a20" stroke-width="0.3"/>
  <rect x="106" y="34" width="4" height="2" rx="0.5" fill="#c89632" stroke="#8a6a20" stroke-width="0.3"/>
  <!-- 3 header pins: VCC, GND, BUS -->
  <line x1="40" y1="58" x2="40" y2="70" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="40" cy="70" r="1.5" fill="#c0c0c0"/>
  <line x1="56" y1="58" x2="56" y2="70" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="56" cy="70" r="1.5" fill="#c0c0c0"/>
  <line x1="72" y1="58" x2="72" y2="70" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="88" y1="58" x2="88" y2="70" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="72" cy="70" r="1.5" fill="#c0c0c0"/>
  <circle cx="88" cy="70" r="1.5" fill="#c0c0c0"/>
</svg>
