<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 56" width="32" height="56">
  <!-- Force Sensor (FSR) — round sensing area with flex tail -->
  <!-- Flex PCB tail -->
  <rect x="10" y="30" width="12" height="26" rx="1" fill="#c8a040" stroke="#a08020" stroke-width="0.5"/>
  <!-- Sensing disc -->
  <circle cx="16" cy="18" r="14" fill="#333" stroke="#222" stroke-width="0.8"/>
  <circle cx="16" cy="18" r="10" fill="#444" stroke="#333" stroke-width="0.5"/>
  <!-- Active zone marking -->
  <circle cx="16" cy="18" r="6" fill="none" stroke="#666" stroke-width="0.5" stroke-dasharray="2,1"/>
  <!-- Leads -->
  <line x1="13" y1="56" x2="13" y2="54" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="19" y1="56" x2="19" y2="54" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="13" cy="56" r="1.5" fill="#c0c0c0"/>
  <circle cx="19" cy="56" r="1.5" fill="#c0c0c0"/>
</svg>
