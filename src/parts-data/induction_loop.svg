<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 48" width="56" height="48">
  <!-- Magnetic field source: a flat loop of enamelled wire, its field lines around it -->
  <g fill="none" stroke="#7fb3d5" stroke-width="0.7" stroke-dasharray="2 1.5">
    <ellipse cx="28" cy="19" rx="26" ry="17"/>
    <ellipse cx="28" cy="19" rx="21" ry="13"/>
  </g>
  <!-- The loop (several turns) -->
  <g fill="none" stroke="#b5651d" stroke-width="1.6">
    <ellipse cx="28" cy="19" rx="15" ry="9"/>
    <ellipse cx="28" cy="19" rx="13.5" ry="8"/>
    <ellipse cx="28" cy="19" rx="12" ry="7"/>
  </g>
  <ellipse cx="28" cy="19" rx="10" ry="5.5" fill="#f4ecd8" stroke="#8b7a5a" stroke-width="0.5"/>
  <text x="28" y="21.5" font-family="sans-serif" font-size="6" text-anchor="middle" fill="#5d4a2a">B</text>
  <!-- Wire ends to the leads -->
  <path d="M16 25 C 10 32, 7 36, 7 42" fill="none" stroke="#b5651d" stroke-width="1.4"/>
  <path d="M40 25 C 46 32, 49 36, 49 42" fill="none" stroke="#b5651d" stroke-width="1.4"/>
  <line x1="7" y1="42" x2="7" y2="48" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="49" y1="42" x2="49" y2="48" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="7" cy="48" r="2" fill="#c0c0c0"/>
  <circle cx="49" cy="48" r="2" fill="#c0c0c0"/>
</svg>
