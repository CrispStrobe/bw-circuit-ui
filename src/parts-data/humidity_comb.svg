<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 48" width="44" height="48">
  <!-- Humidity comb: two interleaved copper combs on a board under a salt film -->
  <rect x="3" y="3" width="38" height="32" rx="2" fill="#2f6b3a" stroke="#1d4426" stroke-width="0.8"/>
  <!-- Left comb (lead a) -->
  <rect x="6" y="6" width="3" height="26" fill="#c98a3a"/>
  <rect x="6" y="8" width="26" height="2" fill="#c98a3a"/>
  <rect x="6" y="16" width="26" height="2" fill="#c98a3a"/>
  <rect x="6" y="24" width="26" height="2" fill="#c98a3a"/>
  <!-- Right comb (lead b) -->
  <rect x="35" y="6" width="3" height="26" fill="#c98a3a"/>
  <rect x="12" y="12" width="26" height="2" fill="#c98a3a"/>
  <rect x="12" y="20" width="26" height="2" fill="#c98a3a"/>
  <rect x="12" y="28" width="26" height="2" fill="#c98a3a"/>
  <!-- Salt film -->
  <rect x="5" y="5" width="34" height="28" fill="#ffffff" opacity="0.22"/>
  <!-- Leads -->
  <line x1="8" y1="35" x2="8" y2="48" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="35" x2="36" y2="48" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="8" cy="48" r="2" fill="#c0c0c0"/>
  <circle cx="36" cy="48" r="2" fill="#c0c0c0"/>
</svg>
