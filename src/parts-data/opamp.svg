<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 50" width="60" height="50">
  <!-- Op-Amp — 8-pin DIP package, bench-style -->
  <rect x="8" y="3" width="44" height="44" rx="2" fill="#303030" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Notch -->
  <path d="M27 3 Q30 7 33 3" fill="#303030" stroke="#555" stroke-width="0.8"/>
  <!-- Pin 1 dot -->
  <circle cx="14" cy="9" r="1.5" fill="#b0b0b0"/>
  <!-- Triangle symbol -->
  <polygon points="18,15 42,25 18,35" fill="none" stroke="#b0b0b0" stroke-width="1"/>
  <!-- +/- markings -->
  <text x="22" y="21" font-family="monospace" font-size="5" fill="#b0b0b0">+</text>
  <text x="22" y="33" font-family="monospace" font-size="6" fill="#b0b0b0">-</text>
  <!-- Label -->
  <text x="30" y="44" text-anchor="middle" font-family="monospace" font-size="4" fill="#888">LM741</text>
  <!-- Leads: inp (left top), inn (left bottom), out (right center) -->
  <line x1="0" y1="15" x2="8" y2="15" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="0" y1="35" x2="8" y2="35" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="25" x2="60" y2="25" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="0" cy="15" r="2" fill="#c0c0c0"/>
  <circle cx="0" cy="35" r="2" fill="#c0c0c0"/>
  <circle cx="60" cy="25" r="2" fill="#c0c0c0"/>
</svg>
