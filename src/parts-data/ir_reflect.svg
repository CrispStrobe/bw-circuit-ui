<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 45" width="32" height="45">
  <!-- IR Reflective Sensor Module — bench-style -->
  <!-- PCB -->
  <rect x="2" y="2" width="28" height="31" rx="2" fill="#1a1a6b" stroke="#0d0d4d" stroke-width="0.8"/>
  <!-- IR LED (clear/blue tint) -->
  <circle cx="10" cy="12" r="3" fill="#e0e0ff" stroke="#aaa" stroke-width="0.4"/>
  <circle cx="10" cy="12" r="1.5" fill="#c0c0e0"/>
  <!-- IR photodiode (dark) -->
  <circle cx="22" cy="12" r="3" fill="#1a1a1a" stroke="#444" stroke-width="0.4"/>
  <circle cx="22" cy="12" r="1.5" fill="#111"/>
  <!-- Comparator IC -->
  <rect x="8" y="20" width="8" height="4" rx="0.5" fill="#303030" stroke="#222" stroke-width="0.3"/>
  <!-- Trimpot -->
  <circle cx="24" cy="22" r="2.5" fill="#4682b4" stroke="#36648b" stroke-width="0.4"/>
  <line x1="24" y1="20.5" x2="24" y2="23.5" stroke="#fff" stroke-width="0.4"/>
  <!-- Status LED -->
  <circle cx="8" cy="28" r="1.2" fill="#600000" stroke="#400000" stroke-width="0.3"/>
  <!-- Label -->
  <text x="16" y="31" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#aaa">IR</text>
  <!-- 3 header pins: VCC, GND, DO -->
  <line x1="8" y1="33" x2="8" y2="45" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="8" cy="45" r="1.5" fill="#c0c0c0"/>
  <line x1="16" y1="33" x2="16" y2="45" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="16" cy="45" r="1.5" fill="#c0c0c0"/>
  <line x1="24" y1="33" x2="24" y2="45" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="24" cy="45" r="1.5" fill="#c0c0c0"/>
</svg>
