<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 28" width="48" height="28">
  <!-- Optocoupler (4N35) — 6-pin DIP, bench-style -->
  <rect x="8" y="2" width="32" height="24" rx="2" fill="#303030" stroke="#1a1a1a" stroke-width="1"/>
  <path d="M21 2 Q24 5 27 2" fill="#303030" stroke="#555" stroke-width="0.8"/>
  <circle cx="13" cy="7" r="1.5" fill="#b0b0b0"/>
  <text x="24" y="14" text-anchor="middle" font-family="monospace" font-size="4.5" fill="#c0c0c0">4N35</text>
  <text x="24" y="21" text-anchor="middle" font-family="monospace" font-size="3" fill="#888">OPTO</text>
  <!-- Left pins: anode, cathode, NC -->
  <line x1="0" y1="8" x2="8" y2="8" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="0" cy="8" r="1.5" fill="#c0c0c0"/>
  <line x1="0" y1="14" x2="8" y2="14" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="0" cy="14" r="1.5" fill="#c0c0c0"/>
  <line x1="0" y1="20" x2="8" y2="20" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="0" cy="20" r="1.5" fill="#c0c0c0"/>
  <!-- Right pins: emitter, collector, base -->
  <line x1="40" y1="20" x2="48" y2="20" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="48" cy="20" r="1.5" fill="#c0c0c0"/>
  <line x1="40" y1="14" x2="48" y2="14" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="48" cy="14" r="1.5" fill="#c0c0c0"/>
  <line x1="40" y1="8" x2="48" y2="8" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="48" cy="8" r="1.5" fill="#c0c0c0"/>
</svg>
