<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 44" width="50" height="44">
  <!-- ADS1115 16-bit I2C ADC Module — bench-style -->
  <!-- PCB -->
  <rect x="2" y="5" width="46" height="34" rx="2" fill="#1a4a6b" stroke="#0d2a4d" stroke-width="0.8"/>
  <!-- ADS1115 MSOP chip -->
  <rect x="14" y="12" width="14" height="8" rx="1" fill="#303030" stroke="#222" stroke-width="0.5"/>
  <text x="21" y="17.5" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#aaa">ADS1115</text>
  <!-- Labels -->
  <text x="25" y="26" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#ccc">16-bit ADC</text>
  <text x="25" y="30" text-anchor="middle" font-family="monospace" font-size="2" fill="#888">4-ch I2C</text>
  <!-- Decoupling cap -->
  <rect x="34" y="14" width="4" height="2" rx="0.5" fill="#c89632" stroke="#8a6a20" stroke-width="0.3"/>
  <!-- Bottom pins: VCC, GND, SDA, SCL, ADDR -->
  <line x1="8" y1="39" x2="8" y2="44" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="8" cy="44" r="1.2" fill="#c0c0c0"/>
  <line x1="16" y1="39" x2="16" y2="44" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="16" cy="44" r="1.2" fill="#c0c0c0"/>
  <line x1="24" y1="39" x2="24" y2="44" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="24" cy="44" r="1.2" fill="#c0c0c0"/>
  <line x1="32" y1="39" x2="32" y2="44" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="32" cy="44" r="1.2" fill="#c0c0c0"/>
  <line x1="40" y1="39" x2="40" y2="44" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="40" cy="44" r="1.2" fill="#c0c0c0"/>
  <!-- Top pins: ALRT, A0, A1, A2, A3 -->
  <line x1="8" y1="5" x2="8" y2="0" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="8" cy="0" r="1.2" fill="#c0c0c0"/>
  <line x1="16" y1="5" x2="16" y2="0" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="16" cy="0" r="1.2" fill="#c0c0c0"/>
  <line x1="24" y1="5" x2="24" y2="0" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="24" cy="0" r="1.2" fill="#c0c0c0"/>
  <line x1="32" y1="5" x2="32" y2="0" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="32" cy="0" r="1.2" fill="#c0c0c0"/>
  <line x1="40" y1="5" x2="40" y2="0" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="40" cy="0" r="1.2" fill="#c0c0c0"/>
</svg>
