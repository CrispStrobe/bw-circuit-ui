<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 56" width="48" height="56">
  <!-- Voltage Source — bench power supply style, bench-style -->
  <!-- Body -->
  <rect x="4" y="10" width="40" height="36" rx="3" fill="#2a3a2a" stroke="#1a2a1a" stroke-width="1"/>
  <!-- Display area -->
  <rect x="8" y="14" width="32" height="12" rx="1" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
  <!-- Voltage readout -->
  <text x="24" y="24" text-anchor="middle" font-family="monospace" font-size="7" fill="#40ff40">5.0V</text>
  <!-- Knob -->
  <circle cx="24" cy="36" r="5" fill="#555" stroke="#444" stroke-width="0.5"/>
  <line x1="24" y1="32" x2="24" y2="36" stroke="#888" stroke-width="1"/>
  <!-- + terminal (top) -->
  <circle cx="24" cy="4" r="4" fill="#cc3030" stroke="#a02020" stroke-width="0.8"/>
  <text x="24" y="6" text-anchor="middle" font-family="monospace" font-size="5" fill="#fff">+</text>
  <!-- - terminal (bottom) -->
  <circle cx="24" cy="52" r="4" fill="#222" stroke="#444" stroke-width="0.8"/>
  <text x="24" y="54" text-anchor="middle" font-family="monospace" font-size="6" fill="#fff">-</text>
</svg>
