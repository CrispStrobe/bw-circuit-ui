  <text x="29" y="15" text-anchor="middle" font-family="monospace" font-size="4" fill="#bbb">MOS</text>
  <text x="29" y="20" text-anchor="middle" font-family="monospace" font-size="3" fill="#888">2G</text>
  <!-- Leads: drain, gate 2, gate 1, source -->
  <path d="M15 22 L 8 34 L 8 44" fill="none" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M25 24 L 22 34 L 22 44" fill="none" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M33 24 L 36 34 L 36 44" fill="none" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M43 22 L 50 34 L 50 44" fill="none" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="8" cy="44" r="2" fill="#c0c0c0"/>
  <circle cx="22" cy="44" r="2" fill="#c0c0c0"/>
  <circle cx="36" cy="44" r="2" fill="#c0c0c0"/>
  <circle cx="50" cy="44" r="2" fill="#c0c0c0"/>
  <text x="3" y="33" font-family="monospace" font-size="3.2" fill="#888">D</text>
  <text x="16" y="33" font-family="monospace" font-size="3.2" fill="#888">G2</text>
  <text x="38" y="33" font-family="monospace" font-size="3.2" fill="#888">G1</text>
  <text x="52" y="33" font-family="monospace" font-size="3.2" fill="#888">S</text>
</svg>
