  <line x1="13.5" y1="4" x2="13.5" y2="28" stroke="#8090a0" stroke-width="0.5"/>
  <line x1="25" y1="4" x2="25" y2="28" stroke="#8090a0" stroke-width="0.5"/>
  <line x1="36.5" y1="4" x2="36.5" y2="28" stroke="#8090a0" stroke-width="0.5"/>
  <line x1="4" y1="11" x2="46" y2="11" stroke="#8090a0" stroke-width="0.3"/>
