<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 56" width="32" height="56">
  <!-- IR Remote Control — handheld remote, bench-style -->
  <!-- Body -->
  <rect x="2" y="2" width="28" height="52" rx="4" fill="#222" stroke="#333" stroke-width="0.8"/>
  <!-- IR LED dome at top -->
  <rect x="10" y="2" width="12" height="6" rx="2" fill="#444" stroke="#555" stroke-width="0.3"/>
  <circle cx="16" cy="5" r="2.5" fill="#660044" opacity="0.6"/>
  <!-- Buttons (3x4 grid) -->
  <g fill="#444" stroke="#555" stroke-width="0.3">
    <circle cx="10" cy="16" r="3"/>
    <circle cx="22" cy="16" r="3"/>
    <circle cx="16" cy="22" r="3"/>
    <circle cx="10" cy="28" r="2.5"/>
    <circle cx="16" cy="28" r="2.5"/>
    <circle cx="22" cy="28" r="2.5"/>
    <rect x="7" y="34" width="6" height="4" rx="1"/>
    <rect x="13" y="34" width="6" height="4" rx="1"/>
    <rect x="19" y="34" width="6" height="4" rx="1"/>
    <rect x="7" y="40" width="6" height="4" rx="1"/>
    <rect x="13" y="40" width="6" height="4" rx="1"/>
    <rect x="19" y="40" width="6" height="4" rx="1"/>
  </g>
  <!-- The remote is a standalone unit, terminals are virtual -->
</svg>
