<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 44" width="30" height="44">
  <!-- IR transmitter LED — bench-style front view -->
  <!-- Looks like a clear/bluish LED but emits infrared -->
  <!-- Leads -->
  <line x1="10" y1="28" x2="10" y2="44" stroke="#c0c0c0" stroke-width="1.2"/>
  <line x1="20" y1="28" x2="20" y2="44" stroke="#c0c0c0" stroke-width="1.2"/>
  <!-- LED body (dome, clear/translucent) -->
  <path d="M6 28 L6 16 Q6 4 15 4 Q24 4 24 16 L24 28 Z" fill="#c0c8d8" opacity="0.3" stroke="#8899aa" stroke-width="0.6"/>
  <!-- Inner glow (IR — shown as faint purple for visibility) -->
  <circle cx="15" cy="18" r="5" fill="#9966cc" opacity="0.2"/>
  <circle cx="15" cy="18" r="2.5" fill="#9966cc" opacity="0.3"/>
  <!-- IR emission waves -->
  <g stroke="#9966cc" stroke-width="0.5" fill="none" opacity="0.4">
    <path d="M10 8 Q15 2 20 8"/>
    <path d="M8 5 Q15 -2 22 5"/>
  </g>
  <!-- Flat on cathode side -->
  <line x1="6" y1="26" x2="6" y2="28" stroke="#8899aa" stroke-width="1"/>
  <!-- Lead labels -->
  <text x="10" y="36" text-anchor="middle" font-family="monospace" font-size="3" fill="#888">+</text>
  <text x="20" y="36" text-anchor="middle" font-family="monospace" font-size="3" fill="#888">-</text>
  <!-- Terminal pads -->
  <circle cx="10" cy="44" r="2" fill="#c0c0c0"/>
  <circle cx="20" cy="44" r="2" fill="#c0c0c0"/>
</svg>
