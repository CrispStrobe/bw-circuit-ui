<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 44" width="30" height="44">
  <!-- IR LED, 5 mm, side view: clear blue-tinted dome, leads one breadboard pitch (14) apart -->
  <!-- Leads -->
  <line x1="8" y1="28" x2="8" y2="44" stroke="#c0c0c0" stroke-width="1.2"/>
  <line x1="22" y1="28" x2="22" y2="44" stroke="#c0c0c0" stroke-width="1.2"/>
  <!-- Dome and rim -->
  <path d="M5 28 L5 15 Q5 4 15 4 Q25 4 25 15 L25 28 Z" fill="#c0c8d8" opacity="0.35" stroke="#8899aa" stroke-width="0.6"/>
  <rect x="4" y="26" width="22" height="2.5" rx="0.8" fill="#b4bccc" stroke="#8899aa" stroke-width="0.5"/>
  <!-- Die and its faint (invisible) glow, shown purple -->
  <rect x="13.5" y="17" width="3" height="2" fill="#555"/>
  <circle cx="15" cy="16" r="5" fill="#9966cc" opacity="0.2"/>
  <!-- IR waves -->
  <g stroke="#9966cc" stroke-width="0.5" fill="none" opacity="0.45">
    <path d="M10 8 Q15 2 20 8"/>
    <path d="M8 5 Q15 -2 22 5"/>
  </g>
  <!-- Flat on the cathode side -->
  <line x1="25" y1="22" x2="25" y2="28" stroke="#556677" stroke-width="1"/>
  <text x="8" y="36" text-anchor="middle" font-family="monospace" font-size="3" fill="#888">+</text>
  <text x="22" y="36" text-anchor="middle" font-family="monospace" font-size="3" fill="#888">-</text>
  <!-- Terminal pads -->
  <circle cx="8" cy="44" r="2" fill="#c0c0c0"/>
  <circle cx="22" cy="44" r="2" fill="#c0c0c0"/>
</svg>
