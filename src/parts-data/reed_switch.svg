<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 20" width="36" height="20">
  <!-- Reed Switch — glass envelope, bench-style -->
  <!-- Glass tube -->
  <rect x="6" y="6" width="24" height="8" rx="4" fill="none" stroke="#8fbc8f" stroke-width="0.8"/>
  <rect x="6" y="6" width="24" height="8" rx="4" fill="#d0e8d0" opacity="0.3"/>
  <!-- Reed blades -->
  <line x1="10" y1="10" x2="16" y2="10" stroke="#888" stroke-width="1" stroke-linecap="round"/>
  <line x1="20" y1="10" x2="26" y2="10" stroke="#888" stroke-width="1" stroke-linecap="round"/>
  <!-- Gap between contacts -->
  <line x1="16" y1="10" x2="20" y2="10" stroke="#888" stroke-width="0.3" stroke-dasharray="1,1"/>
  <!-- Lead wires -->
  <line x1="0" y1="10" x2="6" y2="10" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="0" cy="10" r="1.5" fill="#c0c0c0"/>
  <line x1="30" y1="10" x2="36" y2="10" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="36" cy="10" r="1.5" fill="#c0c0c0"/>
</svg>
