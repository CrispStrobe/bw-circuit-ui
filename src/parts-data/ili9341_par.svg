<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 58" width="160" height="58">
  <!-- ILI9341 2.4" TFT Display Module — parallel 8080 interface, red PCB, bench-style -->
  <!-- PCB -->
  <rect x="2" y="2" width="156" height="44" rx="2" fill="#8b1a1a" stroke="#5a0d0d" stroke-width="0.8"/>
  <!-- TFT display panel -->
  <rect x="4" y="4" width="58" height="38" rx="1" fill="#111" stroke="#333" stroke-width="0.6"/>
  <!-- Active display area -->
  <rect x="7" y="7" width="52" height="32" rx="0.5" fill="#0a0a0a" stroke="#222" stroke-width="0.3"/>
  <!-- Color bars -->
  <rect x="9" y="10" width="7" height="26" fill="#cc0000" opacity="0.5"/>
  <rect x="16" y="10" width="7" height="26" fill="#00cc00" opacity="0.5"/>
  <rect x="23" y="10" width="7" height="26" fill="#0000cc" opacity="0.5"/>
  <rect x="30" y="10" width="7" height="26" fill="#cccc00" opacity="0.5"/>
  <rect x="37" y="10" width="7" height="26" fill="#cc00cc" opacity="0.5"/>
  <rect x="44" y="10" width="7" height="26" fill="#00cccc" opacity="0.5"/>
  <rect x="51" y="10" width="6" height="26" fill="#cccccc" opacity="0.3"/>
  <text x="34" y="40" text-anchor="middle" font-family="monospace" font-size="2" fill="#333">240x320</text>
  <!-- Controller + interface label area -->
  <rect x="66" y="8" width="44" height="14" rx="1" fill="#303030" stroke="#1a1a1a" stroke-width="0.5"/>
  <text x="88" y="16" text-anchor="middle" font-family="monospace" font-size="3.5" fill="#c0c0c0">ILI9341</text>
  <text x="88" y="20" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#888">8080 PAR</text>
  <!-- Level shifter ICs -->
  <rect x="116" y="8" width="16" height="8" rx="0.5" fill="#303030" stroke="#222" stroke-width="0.3"/>
  <text x="124" y="13.5" text-anchor="middle" font-family="monospace" font-size="2" fill="#aaa">LVL</text>
  <rect x="116" y="20" width="16" height="8" rx="0.5" fill="#303030" stroke="#222" stroke-width="0.3"/>
  <text x="124" y="25.5" text-anchor="middle" font-family="monospace" font-size="2" fill="#aaa">LVL</text>
  <!-- SD card slot -->
  <rect x="136" y="10" width="16" height="14" rx="1" fill="#444" stroke="#333" stroke-width="0.4"/>
  <text x="144" y="19" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#888">SD</text>
  <!-- Decoupling caps -->
  <rect x="68" y="28" width="4" height="2" rx="0.5" fill="#c89632" stroke="#8a6a20" stroke-width="0.3"/>
  <rect x="76" y="28" width="4" height="2" rx="0.5" fill="#c89632" stroke="#8a6a20" stroke-width="0.3"/>
  <!-- Module label -->
  <text x="110" y="38" text-anchor="middle" font-family="monospace" font-size="3" fill="#aaa">PARALLEL 8-BIT</text>
  <!-- 16 header pins -->
  <g stroke="#aaa" stroke-width="1.2" stroke-linecap="round">
    <line x1="8" y1="46" x2="8" y2="58"/><line x1="16" y1="46" x2="16" y2="58"/>
    <line x1="24" y1="46" x2="24" y2="58"/><line x1="32" y1="46" x2="32" y2="58"/>
    <line x1="40" y1="46" x2="40" y2="58"/><line x1="48" y1="46" x2="48" y2="58"/>
    <line x1="56" y1="46" x2="56" y2="58"/><line x1="64" y1="46" x2="64" y2="58"/>
    <line x1="72" y1="46" x2="72" y2="58"/><line x1="80" y1="46" x2="80" y2="58"/>
    <line x1="88" y1="46" x2="88" y2="58"/><line x1="96" y1="46" x2="96" y2="58"/>
    <line x1="104" y1="46" x2="104" y2="58"/><line x1="112" y1="46" x2="112" y2="58"/>
    <line x1="120" y1="46" x2="120" y2="58"/><line x1="128" y1="46" x2="128" y2="58"/>
  </g>
  <g fill="#c0c0c0">
    <circle cx="8" cy="58" r="1.5"/><circle cx="16" cy="58" r="1.5"/>
    <circle cx="24" cy="58" r="1.5"/><circle cx="32" cy="58" r="1.5"/>
    <circle cx="40" cy="58" r="1.5"/><circle cx="48" cy="58" r="1.5"/>
    <circle cx="56" cy="58" r="1.5"/><circle cx="64" cy="58" r="1.5"/>
    <circle cx="72" cy="58" r="1.5"/><circle cx="80" cy="58" r="1.5"/>
    <circle cx="88" cy="58" r="1.5"/><circle cx="96" cy="58" r="1.5"/>
    <circle cx="104" cy="58" r="1.5"/><circle cx="112" cy="58" r="1.5"/>
    <circle cx="120" cy="58" r="1.5"/><circle cx="128" cy="58" r="1.5"/>
  </g>
</svg>
