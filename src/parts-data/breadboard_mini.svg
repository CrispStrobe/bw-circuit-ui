<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 56" width="110" height="56">
  <!-- Breadboard Mini — bench-style top view, no power rails -->
  <rect x="0" y="0" width="110" height="56" rx="3" fill="#e8e0d0" stroke="#ccc" stroke-width="1"/>
  <!-- Top terminal area (rows a-e) -->
  <rect x="4" y="4" width="102" height="20" rx="1" fill="#f0ece4" stroke="#ddd" stroke-width="0.5"/>
  <g fill="#555" opacity="0.4">
    <circle cx="10" cy="8" r="1"/><circle cx="16" cy="8" r="1"/><circle cx="22" cy="8" r="1"/><circle cx="28" cy="8" r="1"/><circle cx="34" cy="8" r="1"/>
    <circle cx="44" cy="8" r="1"/><circle cx="50" cy="8" r="1"/><circle cx="56" cy="8" r="1"/><circle cx="62" cy="8" r="1"/><circle cx="68" cy="8" r="1"/>
    <circle cx="78" cy="8" r="1"/><circle cx="84" cy="8" r="1"/><circle cx="90" cy="8" r="1"/><circle cx="96" cy="8" r="1"/><circle cx="102" cy="8" r="1"/>
    <circle cx="10" cy="12" r="1"/><circle cx="16" cy="12" r="1"/><circle cx="22" cy="12" r="1"/><circle cx="28" cy="12" r="1"/><circle cx="34" cy="12" r="1"/>
    <circle cx="44" cy="12" r="1"/><circle cx="50" cy="12" r="1"/><circle cx="56" cy="12" r="1"/><circle cx="62" cy="12" r="1"/><circle cx="68" cy="12" r="1"/>
    <circle cx="10" cy="16" r="1"/><circle cx="16" cy="16" r="1"/><circle cx="22" cy="16" r="1"/><circle cx="28" cy="16" r="1"/><circle cx="34" cy="16" r="1"/>
    <circle cx="10" cy="20" r="1"/><circle cx="16" cy="20" r="1"/><circle cx="22" cy="20" r="1"/><circle cx="28" cy="20" r="1"/><circle cx="34" cy="20" r="1"/>
  </g>
  <!-- Center gap -->
  <rect x="4" y="24" width="102" height="8" rx="0" fill="#d8d0c0" stroke="#ccc" stroke-width="0.3"/>
  <!-- Bottom terminal area (rows f-j) -->
  <rect x="4" y="32" width="102" height="20" rx="1" fill="#f0ece4" stroke="#ddd" stroke-width="0.5"/>
  <g fill="#555" opacity="0.4">
    <circle cx="10" cy="36" r="1"/><circle cx="16" cy="36" r="1"/><circle cx="22" cy="36" r="1"/><circle cx="28" cy="36" r="1"/><circle cx="34" cy="36" r="1"/>
    <circle cx="44" cy="36" r="1"/><circle cx="50" cy="36" r="1"/><circle cx="56" cy="36" r="1"/><circle cx="62" cy="36" r="1"/><circle cx="68" cy="36" r="1"/>
    <circle cx="10" cy="40" r="1"/><circle cx="16" cy="40" r="1"/><circle cx="22" cy="40" r="1"/><circle cx="28" cy="40" r="1"/><circle cx="34" cy="40" r="1"/>
    <circle cx="10" cy="44" r="1"/><circle cx="16" cy="44" r="1"/><circle cx="22" cy="44" r="1"/><circle cx="28" cy="44" r="1"/><circle cx="34" cy="44" r="1"/>
    <circle cx="10" cy="48" r="1"/><circle cx="16" cy="48" r="1"/><circle cx="22" cy="48" r="1"/><circle cx="28" cy="48" r="1"/><circle cx="34" cy="48" r="1"/>
  </g>
  <!-- Row labels -->
  <g font-family="monospace" font-size="2.5" fill="#999">
    <text x="5" y="10">a</text><text x="5" y="22">e</text>
    <text x="5" y="38">f</text><text x="5" y="50">j</text>
