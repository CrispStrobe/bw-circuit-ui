<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 44" width="84" height="44">
  <!-- Ferrite-rod coil — MW antenna coil with tap and coupling winding -->
  <!-- Ferrite rod -->
  <rect x="2" y="8" width="80" height="10" rx="5" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="0.8"/>
  <!-- Main winding (a-tap-b) -->
  <rect x="10" y="6" width="36" height="14" rx="2" fill="#b87333" stroke="#7a4a1f" stroke-width="0.6"/>
  <path d="M13 6 V20 M16 6 V20 M19 6 V20 M22 6 V20 M25 6 V20 M28 6 V20 M31 6 V20 M34 6 V20 M37 6 V20 M40 6 V20 M43 6 V20" stroke="#8a5523" stroke-width="0.5"/>
  <!-- Coupling winding (c1-c2) -->
  <rect x="54" y="6" width="18" height="14" rx="2" fill="#c8a040" stroke="#8a6a20" stroke-width="0.6"/>
  <path d="M57 6 V20 M60 6 V20 M63 6 V20 M66 6 V20 M69 6 V20" stroke="#8a6a20" stroke-width="0.5"/>
  <!-- Leads -->
  <line x1="14" y1="20" x2="14" y2="44" stroke="#aaa" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="28" y1="20" x2="28" y2="44" stroke="#aaa" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="42" y1="20" x2="42" y2="44" stroke="#aaa" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="56" y1="20" x2="56" y2="44" stroke="#aaa" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="70" y1="20" x2="70" y2="44" stroke="#aaa" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Pin labels -->
  <text x="16" y="36" text-anchor="start" font-family="monospace" font-size="3.5" fill="#888">a</text>
  <text x="30" y="36" text-anchor="start" font-family="monospace" font-size="3.5" fill="#888">tap</text>
  <text x="44" y="36" text-anchor="start" font-family="monospace" font-size="3.5" fill="#888">b</text>
  <text x="58" y="36" text-anchor="start" font-family="monospace" font-size="3.5" fill="#888">c1</text>
  <text x="72" y="36" text-anchor="start" font-family="monospace" font-size="3.5" fill="#888">c2</text>
  <circle cx="14" cy="44" r="2" fill="#c0c0c0"/>
  <circle cx="28" cy="44" r="2" fill="#c0c0c0"/>
  <circle cx="42" cy="44" r="2" fill="#c0c0c0"/>
  <circle cx="56" cy="44" r="2" fill="#c0c0c0"/>
  <circle cx="70" cy="44" r="2" fill="#c0c0c0"/>
</svg>
