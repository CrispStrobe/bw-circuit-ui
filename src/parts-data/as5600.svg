<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 44" width="56" height="44">
  <!-- AS5600 Magnetic Rotary Position Sensor Module — bench-style -->
  <!-- One 6-pin header along the bottom edge, as on the breakout board (VCC, GND, SDA, SCL, OUT, DIR) -->
  <rect x="2" y="4" width="52" height="34" rx="2" fill="#2a5a2a" stroke="#1a3a1a" stroke-width="0.8"/>
  <g transform="translate(8 0)">
    <!-- PCB (green, typical breakout) -->
    <!-- AS5600 SOIC chip -->
    <rect x="12" y="8" width="12" height="8" rx="1" fill="#303030" stroke="#222" stroke-width="0.5"/>
    <text x="18" y="13.5" text-anchor="middle" font-family="monospace" font-size="2.2" fill="#aaa">AS5600</text>
    <!-- Magnet position indicator (circle with arrow = rotation) -->
    <circle cx="30" cy="12" r="4" fill="none" stroke="#cc4444" stroke-width="0.6" opacity="0.7"/>
    <path d="M30 8 L31 10 L29 10 Z" fill="#cc4444" opacity="0.7"/>
    <!-- Magnet mounting hole -->
    <circle cx="18" cy="22" r="3" fill="none" stroke="#888" stroke-width="0.5" stroke-dasharray="1,1"/>
    <circle cx="18" cy="22" r="1" fill="#666"/>
    <!-- Labels -->
    <text x="30" y="22" text-anchor="middle" font-family="monospace" font-size="2" fill="#888">12-bit</text>
    <text x="30" y="26" text-anchor="middle" font-family="monospace" font-size="1.8" fill="#666">angle</text>
  </g>
  <rect x="5.8" y="32.8" width="4.4" height="4.4" fill="#d9b44a" stroke="#8a6d1d" stroke-width="0.4"/>
  <line x1="8" y1="38" x2="8" y2="44" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="8" cy="44" r="1.2" fill="#c0c0c0"/>
  <text x="8" y="31.6" text-anchor="middle" font-family="monospace" font-size="1.9" fill="#ddd">VCC</text>
  <rect x="13.8" y="32.8" width="4.4" height="4.4" fill="#d9b44a" stroke="#8a6d1d" stroke-width="0.4"/>
  <line x1="16" y1="38" x2="16" y2="44" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="16" cy="44" r="1.2" fill="#c0c0c0"/>
  <text x="16" y="31.6" text-anchor="middle" font-family="monospace" font-size="1.9" fill="#ddd">GND</text>
  <rect x="21.8" y="32.8" width="4.4" height="4.4" fill="#d9b44a" stroke="#8a6d1d" stroke-width="0.4"/>
  <line x1="24" y1="38" x2="24" y2="44" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="24" cy="44" r="1.2" fill="#c0c0c0"/>
  <text x="24" y="31.6" text-anchor="middle" font-family="monospace" font-size="1.9" fill="#ddd">SDA</text>
  <rect x="29.8" y="32.8" width="4.4" height="4.4" fill="#d9b44a" stroke="#8a6d1d" stroke-width="0.4"/>
  <line x1="32" y1="38" x2="32" y2="44" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="32" cy="44" r="1.2" fill="#c0c0c0"/>
  <text x="32" y="31.6" text-anchor="middle" font-family="monospace" font-size="1.9" fill="#ddd">SCL</text>
  <rect x="37.8" y="32.8" width="4.4" height="4.4" fill="#d9b44a" stroke="#8a6d1d" stroke-width="0.4"/>
  <line x1="40" y1="38" x2="40" y2="44" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="40" cy="44" r="1.2" fill="#c0c0c0"/>
  <text x="40" y="31.6" text-anchor="middle" font-family="monospace" font-size="1.9" fill="#ddd">OUT</text>
  <rect x="45.8" y="32.8" width="4.4" height="4.4" fill="#d9b44a" stroke="#8a6d1d" stroke-width="0.4"/>
  <line x1="48" y1="38" x2="48" y2="44" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="48" cy="44" r="1.2" fill="#c0c0c0"/>
  <text x="48" y="31.6" text-anchor="middle" font-family="monospace" font-size="1.9" fill="#ddd">DIR</text>
</svg>
