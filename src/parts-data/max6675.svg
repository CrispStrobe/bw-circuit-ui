<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 36" width="40" height="36">
  <!-- MAX6675 K-Type Thermocouple Converter Module — bench-style -->
  <!-- PCB -->
  <rect x="2" y="4" width="36" height="24" rx="2" fill="#1a1a6b" stroke="#0d0d4d" stroke-width="0.8"/>
  <!-- MAX6675 SOIC chip -->
  <rect x="12" y="8" width="14" height="8" rx="1" fill="#303030" stroke="#222" stroke-width="0.5"/>
  <text x="19" y="14" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#aaa">MAX6675</text>
  <!-- Thermocouple screw terminal -->
  <rect x="4" y="18" width="12" height="6" rx="1" fill="#3a6a3a" stroke="#2a4a2a" stroke-width="0.5"/>
  <circle cx="7" cy="21" r="1.5" fill="#888" stroke="#666" stroke-width="0.3"/>
  <circle cx="13" cy="21" r="1.5" fill="#888" stroke="#666" stroke-width="0.3"/>
  <text x="10" y="26" text-anchor="middle" font-family="monospace" font-size="2" fill="#888">TC</text>
  <!-- Bottom pins: VCC, GND, SCK, CS -->
  <line x1="8" y1="28" x2="8" y2="36" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="8" cy="36" r="1.2" fill="#c0c0c0"/>
  <line x1="16" y1="28" x2="16" y2="36" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="16" cy="36" r="1.2" fill="#c0c0c0"/>
  <line x1="24" y1="28" x2="24" y2="36" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="24" cy="36" r="1.2" fill="#c0c0c0"/>
  <line x1="32" y1="28" x2="32" y2="36" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="32" cy="36" r="1.2" fill="#c0c0c0"/>
  <!-- Top pin: SO -->
  <line x1="8" y1="4" x2="8" y2="0" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="8" cy="0" r="1.2" fill="#c0c0c0"/>
</svg>
