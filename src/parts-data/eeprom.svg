<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 36" width="70" height="36">
  <!-- I2C EEPROM — 8-pin DIP package, bench-style -->
  <!-- Package body -->
  <rect x="8" y="2" width="54" height="32" rx="2" fill="#303030" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Notch -->
  <path d="M32 2 Q35 5 38 2" fill="#303030" stroke="#555" stroke-width="0.8"/>
  <!-- Pin 1 dot -->
  <circle cx="14" cy="8" r="1.5" fill="#b0b0b0"/>
  <!-- IC label -->
  <text x="35" y="18" text-anchor="middle" font-family="monospace" font-size="5" fill="#c0c0c0">EEPROM</text>
  <text x="35" y="26" text-anchor="middle" font-family="monospace" font-size="3.5" fill="#888">24LC256</text>
  <!-- Left pins -->
  <line x1="0" y1="8" x2="8" y2="8" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="0" cy="8" r="1.5" fill="#c0c0c0"/>
  <line x1="0" y1="16" x2="8" y2="16" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="0" cy="16" r="1.5" fill="#c0c0c0"/>
  <line x1="0" y1="24" x2="8" y2="24" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="0" cy="24" r="1.5" fill="#c0c0c0"/>
  <line x1="0" y1="32" x2="8" y2="32" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="0" cy="32" r="1.5" fill="#c0c0c0"/>
  <!-- Right pins -->
  <line x1="62" y1="8" x2="70" y2="8" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="70" cy="8" r="1.5" fill="#c0c0c0"/>
  <line x1="62" y1="16" x2="70" y2="16" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="70" cy="16" r="1.5" fill="#c0c0c0"/>
  <line x1="62" y1="24" x2="70" y2="24" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="70" cy="24" r="1.5" fill="#c0c0c0"/>
  <line x1="62" y1="32" x2="70" y2="32" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="70" cy="32" r="1.5" fill="#c0c0c0"/>
</svg>
