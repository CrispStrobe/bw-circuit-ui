<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <!-- Tuning capacitor — variable capacitor, panel mount with knob, top view -->
  <!-- Frame -->
  <rect x="8" y="10" width="44" height="36" rx="3" fill="#8c8c8c" stroke="#5a5a5a" stroke-width="0.8"/>
  <!-- Stator plates -->
  <path d="M12 16 L28 16 M12 22 L28 22 M12 28 L28 28 M12 34 L28 34 M12 40 L28 40" stroke="#c9c9c9" stroke-width="1.2"/>
  <!-- Rotor plates (half-moon, meshing) -->
  <path d="M30 13 A15 15 0 0 1 30 43 Z" fill="#d8d8d8" stroke="#9a9a9a" stroke-width="0.6"/>
  <!-- Knob -->
  <circle cx="30" cy="28" r="9" fill="#222" stroke="#000" stroke-width="0.8"/>
  <line x1="30" y1="28" x2="30" y2="20" stroke="#ddd" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Variable-capacitor arrow -->
  <path d="M40 46 L52 4" stroke="#e0a030" stroke-width="0.9"/>
  <path d="M52 4 L48.5 6.5 M52 4 L52.3 8.2" stroke="#e0a030" stroke-width="0.9"/>
  <!-- Leads -->
  <line x1="2" y1="52" x2="12" y2="46" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="58" y1="52" x2="48" y2="46" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="2" cy="52" r="2" fill="#c0c0c0"/>
  <circle cx="58" cy="52" r="2" fill="#c0c0c0"/>
  <text x="6" y="59" text-anchor="middle" font-family="monospace" font-size="3.5" fill="#888">A</text>
  <text x="54" y="59" text-anchor="middle" font-family="monospace" font-size="3.5" fill="#888">B</text>
</svg>
