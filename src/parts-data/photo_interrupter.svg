<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 45" width="32" height="45">
  <!-- Photo Interrupter Module — bench-style -->
  <!-- PCB -->
  <rect x="2" y="2" width="28" height="31" rx="2" fill="#1a1a6b" stroke="#0d0d4d" stroke-width="0.8"/>
  <!-- U-shaped photo interrupter body -->
  <rect x="6" y="6" width="8" height="18" rx="1" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
  <rect x="18" y="6" width="8" height="18" rx="1" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
  <!-- Slot gap -->
  <rect x="14" y="8" width="4" height="14" fill="none"/>
  <!-- IR emitter (left arm) -->
  <circle cx="13" cy="15" r="1.5" fill="#4a0000" opacity="0.8"/>
  <!-- IR detector (right arm) -->
  <circle cx="19" cy="15" r="1.5" fill="#333" stroke="#444" stroke-width="0.3"/>
  <!-- Status LED -->
  <circle cx="24" cy="27" r="1.5" fill="#600000" stroke="#400000" stroke-width="0.3"/>
  <!-- Label -->
  <text x="16" y="31" text-anchor="middle" font-family="monospace" font-size="2" fill="#aaa">SLOT</text>
  <!-- 3 header pins: VCC, GND, DO -->
  <line x1="8" y1="33" x2="8" y2="45" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="8" cy="45" r="1.5" fill="#c0c0c0"/>
  <line x1="16" y1="33" x2="16" y2="45" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="16" cy="45" r="1.5" fill="#c0c0c0"/>
  <line x1="24" y1="33" x2="24" y2="45" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="24" cy="45" r="1.5" fill="#c0c0c0"/>
</svg>
