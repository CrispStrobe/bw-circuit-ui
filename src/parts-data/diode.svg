<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 20" width="52" height="20">
  <!-- Diode — axial glass package (1N4148 style), bench-style -->
  <!-- Lead wires -->
  <line x1="2" y1="10" x2="12" y2="10" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40" y1="10" x2="50" y2="10" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Glass body -->
  <rect x="12" y="3" width="28" height="14" rx="3" fill="#2a2a2a" stroke="#444" stroke-width="0.8"/>
  <!-- Cathode band -->
  <rect x="35" y="3" width="4" height="14" rx="1" fill="#c0c0c0" opacity="0.8"/>
  <!-- Glass sheen -->
  <rect x="14" y="5" width="20" height="2" rx="1" fill="#666" opacity="0.3"/>
  <!-- Terminal pads -->
  <circle cx="2" cy="10" r="2" fill="#c0c0c0"/>
  <circle cx="50" cy="10" r="2" fill="#c0c0c0"/>
</svg>
