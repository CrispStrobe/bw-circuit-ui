<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 56" width="64" height="56">
  <!-- Voltage-controlled voltage source (SPICE E card) — schematic style.
       Left: the controlling port, drawn OPEN because it draws no current.
       Right: the dependent source in the output branch, diamond-bodied by
       convention so it reads as controlled rather than independent. -->
  <!-- Controlling port: two open terminals, sensed not connected -->
  <line x1="0" y1="18" x2="16" y2="18" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="0" y1="38" x2="16" y2="38" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="16" cy="18" r="2" fill="none" stroke="#aaa" stroke-width="1"/>
  <circle cx="16" cy="38" r="2" fill="none" stroke="#aaa" stroke-width="1"/>
  <text x="10" y="30" font-family="monospace" font-size="6" fill="#888">v</text>
  <!-- Control path: dashed, because it carries information and not current -->
  <path d="M16 21 L16 28 L34 28" fill="none" stroke="#7f8c8d" stroke-width="1"
    stroke-dasharray="2,2"/>
  <!-- Output branch: outp (top) through the source to outn (bottom) -->
  <line x1="64" y1="18" x2="44" y2="18" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="64" y1="38" x2="44" y2="38" stroke="#aaa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="18" x2="44" y2="19" stroke="#aaa" stroke-width="1.5"/>
  <line x1="44" y1="37" x2="44" y2="38" stroke="#aaa" stroke-width="1.5"/>
  <polygon points="44,19 52,28 44,37 36,28" fill="#2a2a3a" stroke="#b0b0b0" stroke-width="1"/>
  <!-- A VOLTAGE source: polarity marks, the same convention as a battery cell -->
  <text x="44" y="27" text-anchor="middle" font-family="monospace" font-size="5" fill="#d0d0d0">+</text>
  <text x="44" y="35" text-anchor="middle" font-family="monospace" font-size="6" fill="#d0d0d0">-</text>
  <!-- Card letter, not a value: E is the SPICE spelling of this element -->
  <text x="32" y="52" text-anchor="middle" font-family="monospace" font-size="5" fill="#888">E</text>
  <circle cx="64" cy="18" r="2" fill="#c0c0c0"/>
  <circle cx="64" cy="38" r="2" fill="#c0c0c0"/>
</svg>
