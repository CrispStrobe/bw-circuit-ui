    <circle cx="0" cy="25" r="2"/><circle cx="5" cy="25" r="2"/><circle cx="10" cy="25" r="2"/><circle cx="15" cy="25" r="2"/><circle cx="20" cy="25" r="2"/><circle cx="25" cy="25" r="2"/><circle cx="30" cy="25" r="2"/><circle cx="35" cy="25" r="2"/><circle cx="40" cy="25" r="2"/>
