<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- RGB LED — 4-pin through-hole, bench-style front view -->
  <!-- Clear lens dome with RGB glow -->
  <ellipse cx="24" cy="18" rx="14" ry="16" fill="#e8e8e8" opacity="0.5" stroke="#ccc" stroke-width="0.8"/>
  <!-- RGB color zones -->
  <circle cx="18" cy="15" r="5" fill="#ff3030" opacity="0.35"/>
  <circle cx="24" cy="12" r="5" fill="#30ff30" opacity="0.35"/>
  <circle cx="30" cy="15" r="5" fill="#3030ff" opacity="0.35"/>
  <!-- Highlight -->
  <ellipse cx="20" cy="10" rx="3" ry="4" fill="#fff" opacity="0.3"/>
  <!-- Base flat -->
  <rect x="10" y="32" width="28" height="4" rx="1" fill="#e8e0d8" stroke="#ccc" stroke-width="0.5"/>
  <!-- 4 leads going down -->
  <line x1="8" y1="36" x2="8" y2="48" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="18" y1="36" x2="18" y2="48" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="28" y1="36" x2="28" y2="48" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="38" y1="36" x2="38" y2="48" stroke="#aaa" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Terminal pads -->
  <circle cx="8" cy="48" r="1.5" fill="#ff6060"/>
  <circle cx="18" cy="48" r="1.5" fill="#60ff60"/>
  <circle cx="28" cy="48" r="1.5" fill="#6060ff"/>
  <circle cx="38" cy="48" r="1.5" fill="#c0c0c0"/>
  <!-- Labels -->
  <text x="8" y="44" text-anchor="middle" font-family="monospace" font-size="3" fill="#888">R</text>
  <text x="18" y="44" text-anchor="middle" font-family="monospace" font-size="3" fill="#888">G</text>
  <text x="28" y="44" text-anchor="middle" font-family="monospace" font-size="3" fill="#888">B</text>
  <text x="38" y="44" text-anchor="middle" font-family="monospace" font-size="3" fill="#888">K</text>
</svg>
