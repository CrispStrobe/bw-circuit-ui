<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" width="100" height="60">
  <!-- 8-Digit 7-Segment Display (2x4 layout), common cathode, bench-style -->
  <!-- Module body -->
  <rect x="4" y="5" width="92" height="50" rx="2" fill="#1a1a1a" stroke="#333" stroke-width="0.8"/>
  <!-- Display window -->
  <rect x="8" y="8" width="84" height="44" rx="1" fill="#111" stroke="#222" stroke-width="0.5"/>

  <!-- Digit template: 7-segment outline (a=top, b=top-right, c=bot-right, d=bot, e=bot-left, f=top-left, g=mid) -->
  <!-- Row 1: digits 0-3 (top row) -->
  <!-- Digit 0 -->
  <rect x="12" y="11" width="14" height="2" rx="0.5" fill="#331111"/>
  <rect x="25" y="12" width="2" height="9" rx="0.5" fill="#331111"/>
  <rect x="25" y="22" width="2" height="9" rx="0.5" fill="#331111"/>
  <rect x="12" y="31" width="14" height="2" rx="0.5" fill="#331111"/>
  <rect x="11" y="22" width="2" height="9" rx="0.5" fill="#331111"/>
  <rect x="11" y="12" width="2" height="9" rx="0.5" fill="#331111"/>
  <rect x="12" y="21" width="14" height="2" rx="0.5" fill="#331111"/>
  <circle cx="29" cy="32" r="1" fill="#331111"/>

  <!-- Digit 1 -->
  <rect x="33" y="11" width="14" height="2" rx="0.5" fill="#331111"/>
  <rect x="46" y="12" width="2" height="9" rx="0.5" fill="#331111"/>
  <rect x="46" y="22" width="2" height="9" rx="0.5" fill="#331111"/>
  <rect x="33" y="31" width="14" height="2" rx="0.5" fill="#331111"/>
  <rect x="32" y="22" width="2" height="9" rx="0.5" fill="#331111"/>
  <rect x="32" y="12" width="2" height="9" rx="0.5" fill="#331111"/>
  <rect x="33" y="21" width="14" height="2" rx="0.5" fill="#331111"/>
  <circle cx="50" cy="32" r="1" fill="#331111"/>

  <!-- Digit 2 -->
  <rect x="54" y="11" width="14" height="2" rx="0.5" fill="#331111"/>
  <rect x="67" y="12" width="2" height="9" rx="0.5" fill="#331111"/>
  <rect x="67" y="22" width="2" height="9" rx="0.5" fill="#331111"/>
  <rect x="54" y="31" width="14" height="2" rx="0.5" fill="#331111"/>
  <rect x="53" y="22" width="2" height="9" rx="0.5" fill="#331111"/>
  <rect x="53" y="12" width="2" height="9" rx="0.5" fill="#331111"/>
  <rect x="54" y="21" width="14" height="2" rx="0.5" fill="#331111"/>
  <circle cx="71" cy="32" r="1" fill="#331111"/>

  <!-- Digit 3 -->
  <rect x="75" y="11" width="14" height="2" rx="0.5" fill="#331111"/>
  <rect x="88" y="12" width="2" height="9" rx="0.5" fill="#331111"/>
  <rect x="88" y="22" width="2" height="9" rx="0.5" fill="#331111"/>
  <rect x="75" y="31" width="14" height="2" rx="0.5" fill="#331111"/>
  <rect x="74" y="22" width="2" height="9" rx="0.5" fill="#331111"/>
  <rect x="74" y="12" width="2" height="9" rx="0.5" fill="#331111"/>
  <rect x="75" y="21" width="14" height="2" rx="0.5" fill="#331111"/>
  <circle cx="92" cy="32" r="1" fill="#331111"/>

  <!-- Row 2: digits 4-7 (bottom row) -->
  <!-- Digit 4 -->
  <rect x="12" y="35" width="14" height="2" rx="0.5" fill="#331111"/>
  <rect x="25" y="36" width="2" height="7" rx="0.5" fill="#331111"/>
  <rect x="25" y="44" width="2" height="7" rx="0.5" fill="#331111"/>
  <rect x="12" y="50" width="14" height="2" rx="0.5" fill="#331111"/>
  <rect x="11" y="44" width="2" height="7" rx="0.5" fill="#331111"/>
  <rect x="11" y="36" width="2" height="7" rx="0.5" fill="#331111"/>
  <rect x="12" y="43" width="14" height="2" rx="0.5" fill="#331111"/>
  <circle cx="29" cy="51" r="1" fill="#331111"/>

  <!-- Digit 5 -->
  <rect x="33" y="35" width="14" height="2" rx="0.5" fill="#331111"/>
  <rect x="46" y="36" width="2" height="7" rx="0.5" fill="#331111"/>
  <rect x="46" y="44" width="2" height="7" rx="0.5" fill="#331111"/>
  <rect x="33" y="50" width="14" height="2" rx="0.5" fill="#331111"/>
  <rect x="32" y="44" width="2" height="7" rx="0.5" fill="#331111"/>
  <rect x="32" y="36" width="2" height="7" rx="0.5" fill="#331111"/>
  <rect x="33" y="43" width="14" height="2" rx="0.5" fill="#331111"/>
  <circle cx="50" cy="51" r="1" fill="#331111"/>

  <!-- Digit 6 -->
  <rect x="54" y="35" width="14" height="2" rx="0.5" fill="#331111"/>
  <rect x="67" y="36" width="2" height="7" rx="0.5" fill="#331111"/>
  <rect x="67" y="44" width="2" height="7" rx="0.5" fill="#331111"/>
  <rect x="54" y="50" width="14" height="2" rx="0.5" fill="#331111"/>
  <rect x="53" y="44" width="2" height="7" rx="0.5" fill="#331111"/>
  <rect x="53" y="36" width="2" height="7" rx="0.5" fill="#331111"/>
  <rect x="54" y="43" width="14" height="2" rx="0.5" fill="#331111"/>
  <circle cx="71" cy="51" r="1" fill="#331111"/>

  <!-- Digit 7 -->
  <rect x="75" y="35" width="14" height="2" rx="0.5" fill="#331111"/>
  <rect x="88" y="36" width="2" height="7" rx="0.5" fill="#331111"/>
  <rect x="88" y="44" width="2" height="7" rx="0.5" fill="#331111"/>
  <rect x="75" y="50" width="14" height="2" rx="0.5" fill="#331111"/>
  <rect x="74" y="44" width="2" height="7" rx="0.5" fill="#331111"/>
  <rect x="74" y="36" width="2" height="7" rx="0.5" fill="#331111"/>
  <rect x="75" y="43" width="14" height="2" rx="0.5" fill="#331111"/>
  <circle cx="92" cy="51" r="1" fill="#331111"/>

  <!-- Top pins: com0-com7 -->
  <line x1="12" y1="0" x2="12" y2="5" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="12" cy="0" r="1" fill="#c0c0c0"/>
  <line x1="24" y1="0" x2="24" y2="5" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="24" cy="0" r="1" fill="#c0c0c0"/>
  <line x1="36" y1="0" x2="36" y2="5" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="36" cy="0" r="1" fill="#c0c0c0"/>
  <line x1="48" y1="0" x2="48" y2="5" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="48" cy="0" r="1" fill="#c0c0c0"/>
  <line x1="60" y1="0" x2="60" y2="5" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="60" cy="0" r="1" fill="#c0c0c0"/>
  <line x1="72" y1="0" x2="72" y2="5" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="72" cy="0" r="1" fill="#c0c0c0"/>
  <line x1="84" y1="0" x2="84" y2="5" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="84" cy="0" r="1" fill="#c0c0c0"/>
  <line x1="96" y1="0" x2="96" y2="5" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="96" cy="0" r="1" fill="#c0c0c0"/>

  <!-- Bottom pins: a-g, dp -->
  <line x1="12" y1="55" x2="12" y2="60" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="12" cy="60" r="1" fill="#c0c0c0"/>
  <line x1="24" y1="55" x2="24" y2="60" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="24" cy="60" r="1" fill="#c0c0c0"/>
  <line x1="36" y1="55" x2="36" y2="60" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="36" cy="60" r="1" fill="#c0c0c0"/>
  <line x1="48" y1="55" x2="48" y2="60" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="48" cy="60" r="1" fill="#c0c0c0"/>
  <line x1="60" y1="55" x2="60" y2="60" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="60" cy="60" r="1" fill="#c0c0c0"/>
  <line x1="72" y1="55" x2="72" y2="60" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="72" cy="60" r="1" fill="#c0c0c0"/>
  <line x1="84" y1="55" x2="84" y2="60" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="84" cy="60" r="1" fill="#c0c0c0"/>
  <line x1="96" y1="55" x2="96" y2="60" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="96" cy="60" r="1" fill="#c0c0c0"/>
</svg>
