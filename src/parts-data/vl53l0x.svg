<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 36" width="40" height="36">
  <!-- VL53L0X Time-of-Flight Laser Distance Sensor Module — bench-style -->
  <!-- PCB (purple, typical GY-VL53L0X) -->
  <rect x="2" y="4" width="36" height="24" rx="2" fill="#4a1a6b" stroke="#2d0d4d" stroke-width="0.8"/>
  <!-- VL53L0X sensor package (metal can with aperture) -->
  <rect x="11" y="7" width="14" height="10" rx="1" fill="#555" stroke="#444" stroke-width="0.5"/>
  <!-- Dual aperture (emitter + detector) -->
  <circle cx="15" cy="12" r="2.5" fill="#222" stroke="#333" stroke-width="0.4"/>
  <circle cx="15" cy="12" r="1" fill="#440000" opacity="0.8"/>
  <circle cx="22" cy="12" r="2.5" fill="#222" stroke="#333" stroke-width="0.4"/>
  <circle cx="22" cy="12" r="1" fill="#111"/>
  <!-- Labels -->
  <text x="20" y="22" text-anchor="middle" font-family="monospace" font-size="2.5" fill="#ccc">VL53L0X</text>
  <text x="20" y="26" text-anchor="middle" font-family="monospace" font-size="2" fill="#888">ToF laser</text>
  <!-- Bottom pins: VCC, GND, SDA, SCL -->
  <line x1="8" y1="28" x2="8" y2="36" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="8" cy="36" r="1.2" fill="#c0c0c0"/>
  <line x1="16" y1="28" x2="16" y2="36" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="16" cy="36" r="1.2" fill="#c0c0c0"/>
  <line x1="24" y1="28" x2="24" y2="36" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="24" cy="36" r="1.2" fill="#c0c0c0"/>
  <line x1="32" y1="28" x2="32" y2="36" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="32" cy="36" r="1.2" fill="#c0c0c0"/>
  <!-- Top pins: XSHUT, GPIO1 -->
  <line x1="8" y1="4" x2="8" y2="0" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="8" cy="0" r="1.2" fill="#c0c0c0"/>
  <line x1="16" y1="4" x2="16" y2="0" stroke="#aaa" stroke-width="1" stroke-linecap="round"/>
  <circle cx="16" cy="0" r="1.2" fill="#c0c0c0"/>
</svg>
