<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90" width="90" height="90">
  <!-- LED Cube — 3D wireframe representation, bench-style -->
  <!-- Back face -->
  <polygon points="30,10 70,10 70,50 30,50" fill="none" stroke="#444" stroke-width="0.5"/>
  <!-- Front face -->
  <polygon points="20,30 60,30 60,70 20,70" fill="#1a1a2a" stroke="#555" stroke-width="0.8" opacity="0.8"/>
  <!-- Connecting edges (3D perspective) -->
  <line x1="20" y1="30" x2="30" y2="10" stroke="#444" stroke-width="0.5"/>
  <line x1="60" y1="30" x2="70" y2="10" stroke="#444" stroke-width="0.5"/>
  <line x1="60" y1="70" x2="70" y2="50" stroke="#444" stroke-width="0.5"/>
  <line x1="20" y1="70" x2="30" y2="50" stroke="#444" stroke-width="0.5"/>
  <!-- LED dots on front face (4x4 grid) -->
  <g fill="#4040ff" opacity="0.4">
    <circle cx="28" cy="38" r="2"/><circle cx="36" cy="38" r="2"/><circle cx="44" cy="38" r="2"/><circle cx="52" cy="38" r="2"/>
    <circle cx="28" cy="46" r="2"/><circle cx="36" cy="46" r="2"/><circle cx="44" cy="46" r="2"/><circle cx="52" cy="46" r="2"/>
    <circle cx="28" cy="54" r="2"/><circle cx="36" cy="54" r="2"/><circle cx="44" cy="54" r="2"/><circle cx="52" cy="54" r="2"/>
    <circle cx="28" cy="62" r="2"/><circle cx="36" cy="62" r="2"/><circle cx="44" cy="62" r="2"/><circle cx="52" cy="62" r="2"/>
  </g>
  <!-- Some lit -->
  <g fill="#6060ff" opacity="0.9">
    <circle cx="36" cy="46" r="2.5"/><circle cx="44" cy="46" r="2.5"/>
    <circle cx="36" cy="54" r="2.5"/><circle cx="44" cy="54" r="2.5"/>
  </g>
  <!-- Label -->
  <text x="45" y="84" text-anchor="middle" font-family="monospace" font-size="5" fill="#666">LED CUBE</text>
</svg>
