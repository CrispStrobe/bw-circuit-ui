name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Tests import the engine from a sibling bw-board checkout
      - name: Clone bw-board (sibling dependency)
        run: git clone --depth 1 https://github.com/CrispStrobe/bw-board.git ../bw-board

      - run: npm install
      - run: npm test
