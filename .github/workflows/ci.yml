name: CI

on:
  push:
    branches: [master, 'fable/**']
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Tests import the engine from a sibling bw-board checkout
      - name: Clone bw-board (sibling dependency)
        run: |
          git clone --depth 1 https://github.com/CrispStrobe/bw-board.git ../bw-board
          # bw-board's avr8js-adapter.js imports the `avr8js` runtime dependency;
          # install bw-board's deps so the sibling engine resolves under Node's
          # module resolution (../bw-board/node_modules). Without this the
          # cross-repo adapter test fails with "Cannot find package 'avr8js'".
          npm --prefix ../bw-board install --no-audit --no-fund --ignore-scripts

      # The terminal cross-check reads part sidecars from a sibling bw-parts.
      # Without this clone loadSidecars() returns null and the whole
      # cross-check SKIPS — which is how its ratchet sat at a stale 162 while
      # the real count was 163: the gate had never once run here.
      - name: Clone bw-parts (sidecar source)
        run: git clone --depth 1 https://github.com/CrispStrobe/bw-parts.git ../bw-parts

      # Fabric gate needs sb3-creator examples
      - name: Clone sb3-creator (examples source)
        run: git clone --depth 1 https://github.com/CrispStrobe/sb3-creator.git ../sb3-creator

      - run: npm install
      - run: npm test

      # Designer-side examples gate: breadboard-fabric circuits
      - name: Fabric examples gate
        run: node --test test/examples-fabric-gate.test.js

      # These three scripts existed and CI never invoked them, so ten test
      # files were gated only by someone remembering to run them by hand.
      # test:render no longer contains rendering.test.js, which hard-imports
      # playwright; the browser suite is `npm run test:browser` and is
      # deliberately not here (see test/test-registration.test.js).
      - name: Board presets and geometry
        run: npm run test:boards

      - name: Headless render gates
        run: npm run test:render

      - name: A2 board preset
        run: npm run test:a2

  kicad-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The independent DRC oracle: our router's output judged by a
      # checker nobody here wrote. kicad-cli 8+ has `pcb drc --format json`.
      - name: Install kicad-cli (KiCad 8 — `pcb drc` does not exist in the 7.x that plain apt ships)
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-8.0-releases
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends kicad
      - name: Clone bw-board (engine sibling, needed by test/_setup.js)
        run: git clone --depth 1 https://github.com/CrispStrobe/bw-board.git ../bw-board
      - name: Run the oracle
        run: node scripts/kicad-oracle.mjs
